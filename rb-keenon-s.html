</style><div class="wrap"><a class="back" href="robot-research.html">← Robotics research</a><article id="doc"></article></div><script type="text/markdown" id="md"># Keenon Robotics S100 and S300: Heavy-Load Delivery Robots for a Mixed-Use Miami Tower (research as of 2026-11-19)

Source-quality legend: **[Vendor]** = Keenon's own site or press release; **[Dist]** = distributor or reseller listing (often copies vendor data, sometimes with errors); **[Indep]** = independent trade press or analyst. No independent bench tests, user reviews, or long-term reliability data were found for either model.

## 1. What the S100 and S300 are (category, launch, positioning, naming ambiguity)

### Takeaway
Both are Keenon "Series S" heavy-load indoor delivery AMRs. The S100 is a 100 kg+ fixed-shelf courier. The S300 is a 300 kg shelf-lifting (jacking) "go-under" robot that docks under mobile racks. The S300 launched around October 2025. No exact S100 launch date was found, but it was in field use by February 2025. "S100" also names unrelated products, so searches need the "Keenon" qualifier.

### Cited Findings
- Keenon's official S100 page describes "100kg+ Load Capacity", LiDAR SLAM plus stereo vision, and plug-and-play setup with a pre-installed OS and App. [Vendor] — [Keenon S100](https://www.keenon.com/en/product/S100)
- Keenon markets the S300 as "A Single Touch Lifts 300 kg, Making Heavy Delivery Easy", with a shelfless structure and a lifting platform. [Vendor] — [Keenon S300](https://www.keenon.com/en/product/S300); [Keenon S300 (JP)](https://www.keenon.com/jp/product/S300)
- The S300 is called the "high-capacity counterpart to the KEENON S100 within Keenon's Series S heavy-load delivery platform". [Dist] — [Asia Satellite S300](https://www.asiasatellite.co/KEENON-S300.htm)
- **S300 launch timing:** The China Mobile Robot Alliance (CMRA) "Mobile Robot New Product Catalog in October", dated 5 Nov 2025, says Keenon "recently" released the S300, a "heavy-duty intelligent handling robot" with 300 kg capacity. [Indep/trade] — [CMRA](https://cnmra.com/mobile-robot-new-product-catalog-in-october/). A Keenon YouTube video, "NEW! KEENON S300", was about 405 days old in search results on 2026-11-19, which puts it around October 2025. [Vendor] — [YouTube](https://www.youtube.com/watch?v=rbSBAt1Hlvk)
- **S100 timeline:** It was deployed at Furama Hotel Chiang Mai, with a launch ceremony in February 2025. [Indep/trade, vendor-sourced] — [IoT M2M Council](https://iotm2mcouncil.org/iot-library/news/smart-building-construction-news/keenon-robots-service-thailand-hotel/). A distributor datasheet filename, "datasheet_s100-shelf_202410", suggests an Oct 2024 datasheet revision. [Dist] — [RobotShop CDN PDF](https://cdn.robotshop.com/rbm/2282f665-ba37-4819-bd0a-f5a8b19d0c02/a/a3d6d705-e52f-4b4f-98a4-3ed740ce88b3/4a5eed8a_datasheet_s100-shelf_202410.pdf) (filename only; the fetch returned 403)
- **Naming ambiguity:** Some aggregators label the robots "GuideBot S100" or "GuideBot S300". [Dist/aggregator] — [chipsilicon S100](https://chipsilicon.pages.dev/robots/keenon/guidebot-s100). Some resellers call the S100 "CourierBot S100". [Dist] — [Knoxlabs](https://www.knoxlabs.com/products/keenon-courierbot-s100-delivery-robot). An unrelated "S100 series" construction-elevator drive also comes up in searches. — [Hoplong catalog](https://img.hoplongtech.com/hoplong/catalogue/bien-tan/intelligent-control-system-s100-series-catalog.pdf)
- Target sites per vendor and distributors: factories, warehouses, hospitals, hotels, and large commercial facilities. [Dist] — [Pentagone Robotics S300](https://www.pentagone-robotics.com/en/robots/keenon-s300); the S100 for "Transporting suitcases at hotels" — [Shirai Denshi (JP distributor)](https://www.shiraidenshi.co.jp/homepage/en/robotics/product/s100/index.html)

### Inferences
- These are light-industrial, service-grade AMRs from a restaurant and hotel delivery-robot maker, not industrial AMRs in the class of OTTO or MiR. The S300 is a jacking robot like Pudu's T300 lift variant or Geek+/Hai-style shelf movers.
- With roughly 13 months on the market, the S300 has little field history, especially in the US.

### Gaps
- No official Keenon press release giving exact S100 or S300 launch dates was found.
- It is unclear whether the "GuideBot" naming is official or an aggregator artifact.

## 2. Specifications

### Takeaway
S100: about 925 × 640 × 1282 mm, 87.5 kg, 100 kg+ payload on a fixed 865 × 600 × 800 mm shelf, 1 m/s, 8 h runtime, 2.5 h charge, swappable battery. S300: 115 kg, 300 kg payload, 230 mm-high chassis that lifts racks up to 1200 × 1200 mm, about 1 m/s unloaded, 6 h at full load, 3.5 h charge, auto-charge. Both need a 90 cm minimum passage. Slope and threshold limits are mostly unpublished; one distributor gives a slope of 5° or less for the S300. Neither robot tows.

### Inferences
- **Passage-width unit error:** Keenon's S100 page pairs "90 cm" with "29.53 in", but 29.53 in is 75 cm. Either the 90 cm figure or the inch conversion is wrong. Plan for 90 cm clear width, plus more for turning: the S300 distributor suggests 110–120 cm for a U-turn.
- **Suspect S300 dimensions:** Keenon's S300 table copies the S100's 925 × 640 × 1282 mm, including the 1282 mm height. That is implausible for a 230 mm-high go-under chassis, so the table is probably a copy-paste error. A real S300 footprint and height must be obtained from Keenon.
- **Towing:** Neither model is marketed as a tugger. The S100 carries on a fixed shelf or box modules. The S300 jacks a rack of up to 1200 × 1200 mm, so the operator would need Keenon-compatible racks or carts with matching leg clearance. The vendor shows the shelf as an accessory sold separately — [Asia Satellite](https://www.asiasatellite.co/KEENON-S300.htm).
- **Fit with linen carts:** Standard hotel linen and soiled-linen carts are wheeled bins, not leg-type racks. Using the S300 means either fitting custom racks or confirming that existing carts have the ground clearance and leg spacing the 230 mm chassis needs. No such compatibility data was found.
- **Slope and thresholds:** A slope of 5° or less is modest. Elevator sills, loading-dock ramps, and lobby transitions need site surveys.

### Gaps
- Official threshold height, gap-crossing, and slope figures for the S100, and an official slope figure for the S300.
- S300 lift stroke, real height and footprint, and turning radius.
- IP rating for both; battery cycle life.
- The full S100 datasheet PDF, which RobotShop's CDN blocked with a 403.

## 3. Elevator, door, and multi-floor operation

### Takeaway
Distributors say the S100 supports elevator, gate, and door integration through separately sold control modules that require professional installation. The S300 lists "optional elevator integration." Keenon publishes no elevator-OEM partner list (KONE, Otis, Schindler, TK) and no technical details for the S-series.

### Cited Findings
- S100: "Linked functions for elevator use, gate passage, and remote calling"; "interconnection with elevators and security gates". [Dist] — [Shirai Denshi](https://www.shiraidenshi.co.jp/homepage/en/robotics/product/s100/index.html)
- A US reseller says the "Elevator Control / Automatic Door Control Modules are Sold Separately — professional elevator installation is required." [Dist] — per search snippet of [Knoxlabs S100](https://www.knoxlabs.com/products/keenon-courierbot-s100-delivery-robot) (a direct fetch returned 429)
- S300: "optional elevator integration". [Dist] — [Pentagone](https://www.pentagone-robotics.com/en/robots/keenon-s300)
- Keenon's official S100 and S300 pages do not mention elevators. [Vendor] — [S100](https://www.keenon.com/en/product/S100); [S300](https://www.keenon.com/en/product/S300)
- For Keenon's T10 hotel robot, US integrator RobotLAB says elevator integration takes about 2–3 days with modern controllers that have an API. Older elevators need a relay-based cab caller that emulates button presses, which adds about a week. RobotLAB also recommends "a single-vendor fleet per property" when brands are mixed. [Dist/integrator] — [RobotLAB Keenon](https://www.robotlab.com/manufacturers/keenon/)
- At Furama Chiang Mai, the trade article describes the elevator interface only for the Butlerbot handling cross-floor delivery. It does not say whether the S100 rides elevators there. [Indep/trade] — [IoT M2M Council](https://iotm2mcouncil.org/iot-library/news/smart-building-construction-news/keenon-robots-service-thailand-hotel/)

### Inferences
- The RobotLAB relay or API approach for the T10 likely applies to the S-series as well, since they share Keenon's IoT accessory ecosystem. This is not confirmed.
- In a 1M sq ft tower with a dedicated service-elevator bank, the S100 (about 0.59 m² footprint, over 87 kg plus load) and the S300 (rack up to 1.44 m², up to 415 kg gross) affect cab capacity and robot-alone-in-cab policies. Confirm the elevator OEM's robot interface, such as a KONE or Otis robot API, versus relay retrofits.

### Gaps
- No Keenon-published elevator-OEM certifications or partner list.
- No information on whether S-series robots support access-control or badge-reader integration for BOH doors.
- No confirmed S100 multi-floor deployment with technical detail.

## 4. Software, fleet scheduling, and third-party dispatch (APIs, Open-RMF, VDA 5050)

### Takeaway
Keenon runs its own App and Cloud Platform for monitoring and scheduling. One distributor claims S300 multi-robot scheduling of up to 20 units. No public developer API, SDK, Open-RMF adapter, or VDA 5050 support was found. That is a significant risk for dispatch by Hotel.OS. Pudu, by contrast, runs a public Open Platform.

### Cited Findings
- Keenon robots use the "KEENON App and Cloud Platform for real-time monitoring and task scheduling". This was stated for the C40, and the S-series appears to share the stack. [Indep/trade] — [Robotics Tomorrow, Mar 2025](https://www.roboticstomorrow.com/news/2025/03/31/keenon-robotics-marks-a-new-milestone-with-the-unveiling-of-the-humanoid-robot-xman-r1-and-the-latest-kleenbot-additions/24530/)
- S300 multi-robot scheduling: "up to 20 devices". [Dist] — [Robots International](https://www.robotsinternational.com/KEENON-S300.htm)
- The S300 runs path planning and tasks on the device, with no central control or external network needed. [Vendor] — [Keenon S300](https://www.keenon.com/en/product/S300)
- Calling methods include a pager center, pager buttons, and a notification bell (S100 accessories), plus smartphone remote calling. [Vendor] — [Keenon S100](https://www.keenon.com/en/product/S100); [Shirai Denshi](https://www.shiraidenshi.co.jp/homepage/en/robotics/product/s100/index.html). One reseller sells a "Keenon Control Center Gateway for S100". [Dist] — [RobotShop CA](https://ca.robotshop.com/products/reliablerobots-keenon-control-center-gateway-s100)
- API Evangelist's profile, scored Oct 2026, says Keenon publishes "no public developer API, developer portal, or OpenAPI". [Indep, but an automated or AI-assisted profile] — [API Evangelist](https://providers.apievangelist.com/providers/keenon-robotics/)
- Pudu runs a public Open Platform for developers. [Vendor, competitor] — [PUDU Open Platform](https://open.pudutech.com/en)
- No search results connect Keenon to Open-RMF or VDA 5050. — search of the Open Robotics discourse and VDA 5050 literature, e.g. [Open-RMF + VDA5050 thread](https://discourse.openrobotics.org/t/open-rmf-questions-from-a-real-integration-with-a-diff-robot-vda5050/54057)

### Inferences
- Integrating with Hotel.OS would probably mean negotiating partner or private API access with Keenon. Otherwise the options are emulating call buttons, for example triggering the Pager Center over IoT, or building a custom Open-RMF fleet adapter on whatever interface Keenon exposes. Make written API access, with documented endpoints for task dispatch, status, and telemetry, a contract precondition.
- The on-device, offline design (S300) adds resilience but complicates central orchestration.

### Gaps
- Whether Keenon offers a private or partner API for the S-series in the US, and what it covers.
- Whether S100 and S300 can be co-scheduled with Keenon's T10 or W3 in one fleet manager.

## 5. Safety and certifications (UL 3100, ISO 3691-4, ANSI/A3 R15.08, CE, FCC)

### Takeaway
Only CE is cited, by one EU distributor for the S300. No evidence was found of UL 3100, ISO 3691-4, or ANSI/A3 R15.08 certification for either model, nor an FCC ID record. For US deployment in a building with public areas, this is a key due-diligence item.

### Cited Findings
- S300: "Certification: CE". [Dist] — [Pentagone](https://www.pentagone-robotics.com/en/robots/keenon-s300)
- Keenon's official S100 and S300 pages list no certifications. [Vendor] — [S100](https://www.keenon.com/en/product/S100); [S300](https://www.keenon.com/en/product/S300)
- A search for Keenon plus UL 3100 returned only generic UL and SGS pages. UL describes UL 3100 as the outline of investigation for automated mobile platforms (AMPs) and says AMR evaluation to it supports "acceptance by code authorities". — [UL: UL 3100](https://www.ul.com/resources/safety-first-ul-3100-automated-electrical-equipment)
- Safety features per vendor: dual LiDAR, 3D vision, VSLAM, triple e-stops, and bumpers per a distributor. [Vendor/Dist] — [Keenon S100](https://www.keenon.com/en/product/S100); [Shirai Denshi](https://www.shiraidenshi.co.jp/homepage/en/robotics/product/s100/index.html)

### Inferences
- A Miami AHJ, insurers, or the building's elevator contractor may ask for UL 3100 or a NRTL listing, particularly for a 415 kg gross S300 in public or residential corridors. Ask Keenon for test reports and FCC IDs. The 4G and Wi-Fi radios would need FCC authorization for US sale.

### Gaps
- FCC ID, UL or ETL listing, ISO 3691-4 or R15.08 conformity, and battery UL 2271 or UN38.3 documentation were all not found.

### Takeaway
Keenon publishes no MSRP. US reseller listings put the S100 at about $19,000–22,000. The S300 appears at $13,995–18,500 on a distributor network of questionable reliability, and at €16,800 plus VAT in the EU. RobotLAB is the largest US Keenon integrator, with a Miami location and RaaS programs, but it does not list the S100 or S300. Warranty claims range from a 2-year manufacturer warranty to 5-year distributor packages.

## 7. Deployments, reviews, and problems

### Takeaway
Documented S100 use is in hotels outside the US: Furama Chiang Mai, Thailand, February 2025, and Shangri-La Traders Shanghai Hongqiao, October 2025, for luggage, linen, and supplies. No S300 deployments, US deployments of either model, independent reviews, or problem reports were found. Outcome data comes only from the vendor.

### Cited Findings
- Furama Hotel Chiang Mai (Feb 2025): the S100 "with its heavy-duty capacity of over 100kg" handles "bulky items such as hotel linens, luggage and supplies", supporting back-of-house and guest-facing deliveries. No robot count or measured outcomes are given. [Indep/trade, vendor-sourced] — [IoT M2M Council](https://iotm2mcouncil.org/iot-library/news/smart-building-construction-news/keenon-robots-service-thailand-hotel/)
- Shangri-La Traders, Shanghai Hongqiao (Oct 2025): the S100 handles luggage within a fleet of XMAN-R1, C40, S100, T10, T3, and W3 robots. [Vendor] — [Keenon news](https://www.keenon.com/en/news/keenon-robotics-partners-with-shangri-la-group-to-create-the-worlds-first-smart-hotel-powered-by-universal-specialized-robots); [PR Newswire Asia](https://en.prnasia.com/releases/apac/keenon-humanoid-robot-joins-hotel-workforce-pioneering-world-s-first-general-purpose-special-purpose-robot-collaboration-model-509473.shtml)
- A Horwath HTL case-study review calls that architecture credible but the outcome unverified. It also flags Keenon's claims of 15 years, 100,000+ units, and 60+ countries as unverified independently. [Indep] — [Horwath HTL](https://workshop.horwathhtl.com/resources/case-studies/shangri-la-keenon-counter-pattern)
- Hospital and factory use appears only in reseller copy, e.g. "Light industry: S100 moving parts and materials between stations". [Dist] — [Knoxlabs blog](https://www.knoxlabs.com/blogs/articles/keenon-service-robots-compared?view=articles-hub)

### Inferences
- The S-series is unproven in US hospitality, and in high-rise residential mixed-use buildings in general. A pilot with defined KPIs (trips per day, mean time between interventions, elevator success rate) is warranted.

### Gaps
- No user reviews, failure reports, or independent performance data.
- No count of S100 or S300 units deployed in the US.

## 8. Fit for hotel linen and waste transport versus alternatives

### Takeaway
For a 1M sq ft tower, the S100 suits mid-volume clean linen, amenities, and supply runs in standard 90 cm+ BOH corridors. The S300 is the only Keenon option for whole-cart moves, but only with compatible lift racks. Neither has published UL 3100 certification, an open API, or wet or waste-specific features, all of which matter for Hotel.OS dispatch and for waste. Pudu offers comparable products with a public Open Platform. Aethon TUG is the mature towing and cart option with long hospital and US track records. Specs for the competitors were not researched here.

### Cited Findings
- The S100 handles hotel linen, luggage, and supplies (Furama). — [IoT M2M Council](https://iotm2mcouncil.org/iot-library/news/smart-building-construction-news/keenon-robots-service-thailand-hotel/)
- S300 rack compatibility of up to 1200 × 1200 mm, with a 230 mm chassis. — [Keenon S300](https://www.keenon.com/en/product/S300)
- The S100 warns not to charge a wet robot. — [Keenon S100](https://www.keenon.com/en/product/S100)
- Pudu has a public developer Open Platform, versus no public Keenon API. — [PUDU Open Platform](https://open.pudutech.com/en); [API Evangelist](https://providers.apievangelist.com/providers/keenon-robotics/)

### Inferences
- **Linen:** Open-shelf S100 payloads are fine for clean linen. Soiled linen and waste raise hygiene and odor concerns, so enclosed bins or carts moved by an S300 are preferable to open shelves. The S300's 300 kg capacity covers a full soiled-linen cart.
- **Waste:** Wet waste conflicts with the "do not charge a wet robot" warning and with the unknown IP rating. Prefer a cart-based S300 or TUG flow that keeps the robot body away from the waste.
- **Room service and amenities:** The S100 is overkill and has an open, unsecured shelf. Keenon's enclosed T10 or W3, or Relay, fit better for guest-facing deliveries in residential and hotel corridors.
- **Dispatch by Hotel.OS:** Pudu's open platform is a structural advantage over Keenon for third-party orchestration. Confirm this against the Pudu research notes.

### Gaps
- Pudu T300/T600, Aethon TUG, OTTO, and Relay specs, prices, and certifications were outside this note's search budget. They should come from parallel research.
