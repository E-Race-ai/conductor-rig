**Put a Go2 EDU Plus with its factory Orin NX 16 GB dock on the robot. Run LiDAR odometry, navigation, the depth camera and the arm driver there, and send every large model (VLA, LLM/VLM, open-vocabulary detection, grasp and pose networks, GPU motion planning) to the RTX 5070 Ti over Wi-Fi.** That onboard/offboard split fits within published Jetson benchmarks, so you don't need an AGX Orin or Thor on the back. The ad you saw for a "Jetson Orin Nano 100 TOPS" is mislabeled. No Orin Nano reaches 100 TOPS. The Go2's 100 TOPS dock is an **Orin NX 16 GB** (EDU Plus), and the 40 TOPS dock is an **Orin Nano 8 GB** (EDU Standard). Check which one you have from the module part number or on the robot itself before you pay. Both docks ship on **JetPack 5.1 / Ubuntu 20.04**, so the newer Super mode is unavailable without an unsupported reflash. A third-party computer (best fit: Seeed reComputer Robotics J4012, Orin NX 16 GB Super, 19–54 V input, 2× CAN FD) earns its place only if you need JetPack 6 software onboard or native CAN for a PiPER. Power is the harder problem. The EDU's 432 Wh pack runs this stack for about **1.5 h of walking if everything draws from it**, and about **1.8 h if the arm, router and switch move to a separate 24 V accessory battery** (both calculated, not measured). A spare 15 Ah pack ($1,200) is the cheapest way to double mission time. Every runtime and power-budget figure in this report is a calculation from spec sheets and proxy measurements. Nobody has published a measured Go2 runtime with an arm or an add-on computer.

## The "Orin Nano 100 TOPS" ad mixes up two different docks

Unitree's own spec table only says the EDU's high computing power module is "Orin (40–100 TOPS)". It names no model, and the AIR, PRO and X get no module at all ([Unitree Go2](https://www.unitree.com/go2)). Reseller copies of Unitree's dock table fill in the detail. There are two dock SKUs with identical I/O: an **Orin Nano 8 GB rated "up to 40 TOPS"** and an **Orin NX 16 GB rated "up to 100 TOPS"** ([docs.quadruped.de](https://www.docs.quadruped.de/projects/go2/html/Overview_1.html)). The EDU Plus is model "Go2 EDU-U4", described as having an Orin NX at 100 TOPS ([UMBC](https://cypress.umbc.edu/testbed/trace/trace-testbed-design/unitree-go2-edu-plus-qugv)). QuakeLogic's EDU+ datasheet says **Orin NX 16 GB, 100 TOPS** ([QuakeLogic](https://quakelogic.net/datasheets/QL-Unitree-Go2-EDU+.pdf)). RoboStore sells "Go2 EDU (40 TOPS)" with an Orin Nano 8 GB ([RoboStore](https://robostore.com/products/go2-edu-40-tops-computing-quadruped-robot-dog)), and a MyBotShop forum thread confirms that the standard extension pack ships an Orin Nano 8 GB ([MyBotShop forum](https://forum.mybotshop.de/t/unitree-go2-no-cuda-installed-on-nvidia-orin-nano-8-gb-in-extension-pack/1020)). No Go2 variant with an AGX Orin or Thor dock turned up. Unitree's AGX docks are made for the G1 humanoid ([RobotShop](https://www.robotshop.com/products/unitree-nvidia-agx-thor-backplane-expansion-dock-g1-d)).

**The EDU Standard is labeled two ways.** Pakronics sells it as "40 Tops Jetson Orin **NX 8GB**" ([Pakronics](https://www.pakronics.com.au/products/unitree-go2-edu-package-basic-version-robot-quadruped-40-tops-jetson-orin-nx-8gb-lf-ut-go2edupack)). The University of Melbourne lists an "Orin NX 8GB … 40 TOPS … 7–15W" ([UniMelb KB](https://ms-kb.msd.unimelb.edu.au/next-lab/robotics/robotic-dog/expansion-equipment-attachments)). The numbers in those listings settle it. NVIDIA rates the Orin NX 8 GB at **70 TOPS and 10–20 W**, while **40 TOPS at 7–15 W is exactly the Orin Nano 8 GB spec** ([NVIDIA Jetson Orin](https://www.nvidia.com/en-us/autonomous-machines/embedded-systems/jetson-orin/)). The likely source of the confusion is that the same reseller page whose table says Nano 8 GB also refers to "Orin NX 8/16GB" in its power-interface text ([docs.quadruped.de](https://www.docs.quadruped.de/projects/go2/html/Overview_1.html)). Treat the Standard dock as a Nano 8 GB.

The "Orin Nano 100 TOPS" ad is wrong on its face. An Orin Nano is rated 40 TOPS. It reaches **67 TOPS only in MAXN SUPER mode, which requires JetPack 6.2** ([edge-ai-vision/NVIDIA](https://www.edge-ai-vision.com/2025/01/nvidia-jetpack-6-2-brings-super-mode-to-nvidia-jetson-orin-nano-and-jetson-orin-nx-modules/)), and Unitree ships JetPack 5.1. So the robot in the ad is either an EDU Plus with an Orin NX 16 GB described carelessly, or an EDU Standard with a Nano sold at Plus pricing.

The module specs differ in ways you can check from a shell:

| Module | CPU cores | RAM | TOPS (stock / Super) | Power | Part no. |
|---|---|---|---|---|---|
| Orin Nano 8 GB (EDU Standard) | 6× A78AE | 8 GB, 68 GB/s | 40 / 67 | 7–15 W (25 W Super) | P3767-0003 |
| Orin NX 8 GB (not used by Unitree) | 6× A78AE | 8 GB | 70 / 117 | 10–20 W | — |
| Orin NX 16 GB (EDU Plus) | 8× A78AE | 16 GB, 102 GB/s | 100 / 157 | 10–25 W (40 W Super) | P3767-0000 |

*Sources: [NVIDIA Jetson Orin](https://www.nvidia.com/en-us/autonomous-machines/embedded-systems/jetson-orin/), [edge-ai-vision](https://www.edge-ai-vision.com/2025/01/nvidia-jetpack-6-2-brings-super-mode-to-nvidia-jetson-orin-nano-and-jetson-orin-nx-modules/). The part numbers come from the research notes' inference, so confirm them against NVIDIA's module data.*

To verify before purchase, ask the seller for the module part number and a screenshot of `jtop`. On delivery, SSH to the dock (`unitree@192.168.123.18`, default password `123`; [ACRE-Lab wiki](https://github.com/ACRE-Lab-NCSU/ACRE-Wiki/wiki/Unitree-Go2)). Then check that `nproc` reports **8** cores and `free -h` shows about **16 GB**. A Nano shows 6 cores and about 8 GB. `cat /etc/nv_tegra_release` and `jtop` confirm the L4T release and the module name. If the ad's price matches an EDU Plus ($13,105–$13,205 at US dealers, or $16,900 at RoboStore; [RoboStore EDU Plus](https://robostore.com/products/go2-edu-plus-100-tops-computing-quadruped-robot-dog)), make the seller confirm NX 16 GB in writing.

### The dock is a 16–60 V hub with small regulated rails

Both docks have the same I/O: **1× USB 3.0-A, 1× USB 3.0-C, 1× USB 2.0-C, 2× Gigabit RJ45, 1× 100 Mbps GH1.25 Ethernet, and 1× M8 aviation plug**. Input is **16–60 V DC**, fed from the robot's **28.8 V battery output** ([docs.quadruped.de](https://www.docs.quadruped.de/projects/go2/html/Overview_1.html)). The electrical-interface table adds more detail ([docs.quadruped.de controller](https://www.docs.quadruped.de/projects/go2/html/controller.html)):

- **Two XT30 inputs, 16–45 V (60 V peak).** One powers the dock. The other is a pass-through for an external robotic arm.
- **User outputs of 12 V/3 A and 5 V/3 A.**
- **12 V/2 A on the M8 plug**, which also carries Gigabit Ethernet for a LiDAR.
- **USB power:** 5 V/1 A on USB-A, 5 V/3 A and 5 V/2 A on the two USB-C ports.

InDro's payload notes repeat the two inputs and the 12 V/3 A output ([InDro](https://indrorobotics.notion.site/Payload-1d61bb7999b280df802bc81a8a2cbc0c)). **The 12 V figures conflict across sources.** A Reddit thread about wiring a D1-T arm describes the extension output as "12 V 2 A" ([r/unitree mirror](https://axebps-redlib.hf.space/r/unitree/comments/1inyn2p/help_d1t_servo_arm_from_unitree)), and QuakeLogic lists "24V / 12V / 5V" external power ([QuakeLogic](https://quakelogic.net/datasheets/QL-Unitree-Go2-EDU+.pdf)). The most consistent reading is that there are two 12 V rails: the 3 A user output and the 2 A LiDAR feed on the M8. The Reddit "2 A" probably refers to the M8 rail. Until you measure your unit, design every 12 V load to fit **2 A (24 W)**. Unitree publishes no fuse values or current limit for the robot's 28.8 V output.

### JetPack 5.1, no Super mode, and no official upgrade path

The docks ship with **JetPack 5.1.x, Ubuntu 20.04, CUDA 11.4 and ROS 2 Foxy** ([NVIDIA forums](https://forums.developer.nvidia.com/t/unable-to-re-flash-unitree-go2-expansion-dock-nvidia-orin-nx-which-has-jetpack5-1/351374); [MyBotShop forum](https://forum.mybotshop.de/t/unitree-go2-no-cuda-installed-on-nvidia-orin-nano-8-gb-in-extension-pack/1020)). NVIDIA staff send reflash questions back to "the board vendor". Users report that **Unitree publishes no JetPack 6 image and advises against the move from 20.04 to 22.04**. Recovery mode also requires a pin-hole button and a power cycle ([MyBotShop forum](https://forum.mybotshop.de/t/unitree-go2-recovery-mode-entrance-with-jetpack-install/1060); [MyBotShop forum](https://forum.mybotshop.de/t/unitree-go2-edu-nvidia-orin-dist-upgrade/1632)). One owner reports running JetPack 6 on a Go2-W NX, but that is an unsupported path. In practice, the dock's **advertised TOPS are its real ceiling**: 40 or 100, not 67 or 157. The upgrade path from a Nano dock is to buy the "Go2 Docking Station 100 TOPS" as a complete unit ([AmericanSatellite](https://www.americansatellite.com/Unitree-Go2-Docking-Station-100Tops.htm)), at a price no reachable page showed. Nano and NX share the 260-pin SO-DIMM form factor ([Connect Tech](https://connecttech.com/orin-module-comparison/)), but a bare module swap would need a reflash on a carrier that NVIDIA won't support.

## Orin NX 16 GB covers the onboard workload once the 5070 Ti takes the models

The workloads split cleanly by how fast they must react and how much data they move. LiDAR-inertial odometry is a CPU job. **FAST-LIO2 stays within its 100 ms per-scan budget on an Orin NX** in 2026 benchmarks ([GLIO2, arXiv 2610.12411](https://arxiv.org/pdf/2610.12411)). By my estimate it needs one or two A78AE cores at 10 Hz with a 16–32 channel LiDAR, and Nav2 costmaps need one or two more. The depth-camera pipeline is cheap on any Orin. Isaac ROS release-5.1 measures **nvblox ESDF at 1.5 ms on AGX Orin and 5.1 ms on Orin Nano**, **RT-DETR at 39 fps on Orin Nano Super and 87 fps on AGX Orin**, and **ESS stereo depth at 36 fps on Nano Super** ([Isaac ROS performance](https://nvidia-isaac-ros.github.io/performance/index.html); [nvblox](https://nvidia-isaac-ros.github.io/repositories_and_packages/isaac_ros_nvblox/index.html)). The heavy models are a different story. **Mobile SAM manages only 3.9 fps on Nano Super and 7.6 fps on AGX Orin, against 58 fps on an RTX 5070**. **FoundationPose 6-DoF pose estimation runs at 0.89 fps on AGX Orin** ([Isaac ROS performance](https://nvidia-isaac-ros.github.io/performance/index.html)).

Language and action models show the same gap. TensorRT Edge-LLM measures **Qwen3-VL-2B at 52.6 tok/s and Qwen3-8B at 17.5 tok/s on Orin NX 16 GB**, against 32.3 tok/s for the 2B model on an Orin Nano 8 GB ([TensorRT Edge-LLM](https://nvidia.github.io/TensorRT-Edge-LLM/latest/user_guide/performance/performance-benchmarks.html)). Community tests put an RTX 5070 Ti at about **100–125 tok/s on an 8B Q4 model** ([local-llm.net](https://www.local-llm.net/benchmarks/rtx-5070-ti/)). Diffusion and flow VLAs are where Orin falls apart. **Naive pi0.5 runs at about 0.7 Hz on Orin**, and a heavily optimized asynchronous pipeline reaches about 10 Hz ([Jetson-PI](https://www.alphaxiv.org/abs/2607.12659)). Pi0, pi0.5 and GR00T only reach **22–25 Hz on AGX Thor**, and **50–80 Hz on an RTX 5090** ([FlashRT post](https://forums.developer.nvidia.com/t/real-time-inference-on-thor-rtx-pi0-5-gr00t-n1-6-1-7-thor-23-hz-rtx-5090-50-80hz/368788); [GR00T N1.7 on Thor](https://www.jetson-ai-lab.com/tutorials/groot_n17_on_thor/)). Scaling by memory bandwidth (896 vs 1,792 GB/s), I estimate the 5070 Ti at **about 25–40 Hz** for a 3B VLA. That is an estimate, not a measurement, but it is comfortably above the 10 Hz floor GR00T recommends for manipulation.

| Workload | Where it runs | Why |
|---|---|---|
| Unitree locomotion (`rt/lowcmd`) | Robot mainboard (.161), not user-accessible | Fixed by Unitree |
| E-stop, arm driver and trajectory execution, joint limits, Nav2 collision monitor | Onboard (hard) | Must survive a Wi-Fi drop |
| FAST-LIO2 / KISS-ICP at 10 Hz, local costmap and controller | Onboard, about 2–4 cores (estimate) | Feeds the control loop; raw point clouds don't fit over Wi-Fi |
| D435i driver, nvblox local map, one TensorRT detector, H.264 encode | Onboard (NX has NVENC; Nano does not) | Cheap; compressed video goes upstream |
| VLA policy (pi0.5, GR00T, SmolVLA) with action chunking | 5070 Ti | ~1 Hz on NX vs ~25–40 Hz est. on 5070 Ti |
| LLM/VLM task reasoning, Grounding DINO, SAM, FoundationPose, grasp nets, cuMotion/cuRobo | 5070 Ti | 5–60× faster; plans tolerate 100+ ms latency |
| Global mapping, loop closure, map merging, logging, visualization | EPYC 9175F | No real-time constraint |

The network sets the boundary. In Arm's measurements of rmw_zenoh over real Wi-Fi, a 3D point cloud generates **about 700 Mbps** of source traffic. After tuning, only **about one 7.37 MB cloud per second** got through, while compressed camera streams ran at full rate ([Arm learning path](https://learn.arm.com/learning-paths/cross-platform/tuning-zenoh-ros2-lp3/4-measure-real-wifi/)). A peer-reviewed comparison found CycloneDDS best on Ethernet and **Zenoh best on Wi-Fi and 4G** ([utupub.fi](https://www.utupub.fi/bitstreams/dbfed6d3-41d7-440f-9bf1-a0a0369b05a2/download)). So keep LIO onboard, and send H.264 video, compressed depth, downsampled clouds and maps across the link. Every offboard result should come back as a goal, trajectory or action chunk with a timeout. That way a lost link stops the robot rather than leaving it to act on stale commands. The Orin Nano dock can run the onboard column too, but with **8 GB of memory shared by CPU and GPU and no NVENC** it has no headroom for a fallback VLM or hardware video encoding. That is the practical reason to want the NX.

## Third-party computers make sense only for JetPack 6 or CAN

NVIDIA's July 22, 2026 price increase changed the arithmetic for add-on computers. List prices are now **$399 for the Orin Nano Super dev kit (was $249), $999 for an Orin NX 16 GB module (was $599), $3,499 for the AGX Orin dev kit (was $1,999) and $5,499 for the AGX Thor dev kit (was $3,499)**, increases of up to 101% ([CNX Software](https://www.cnx-software.com/2026/07/22/nvidia-increases-the-price-of-jetson-modules-and-devkits-by-up-to-101/?amp=1); [HWBusters](https://hwbusters.com/news/nvidia-jetson-prices-jump-up-to-101-the-249-orin-nano-super-is-now-399/)). On a Go2, the input-voltage range matters as much as the price. The pack swings from about 24 V to **33.6 V** at full charge, so a computer rated for 19–54 V or 9–36 V can run straight from the battery. Anything that tops out at 20 V needs a step-down converter, and a 28 V maximum is too close to a full pack.

| Option | Compute | Input | Weight | Price (post-July 2026) | Verdict |
|---|---|---|---|---|---|
| **Seeed reComputer Robotics J4012** | Orin NX 16 GB Super, 157 TOPS | **19–54 V XT30**, 2× CAN FD, GMSL2 | ~200 g (may be board only) | $1,412 (US, sold out) to $2,573 | Best add-on if one is needed |
| Connect Tech Boson + Orin NX 16 GB | Orin NX | 9–36 V | n/a | Quote | Only ~2.4 V margin over a full pack |
| Orin Nano Super dev kit + DC-DC | 67 TOPS, 8 GB | 9–19 V | ~176 g | $399 | Cheap sidecar; 1 GbE, no CAN |
| Neousys NRU-220S (AGX Orin) | 275 TOPS | 8–48 V | n/a | From $3,485 | Overkill; VLAs still 1–4 Hz |
| AGX Thor dev kit | T5000, 128 GB | needs DC-DC; 40–130 W | ~1.9–2.0 kg | $5,499 | Only for untethered VLA at 20+ Hz |
| Pi 5 + AI HAT+ 2 | 40 TOPS INT4 | 5 V via buck | light | $130 HAT + Pi | Driver bridge only; no CUDA |

*Sources: [Pakronics J4012](https://pakronics.com.au/products/recomputer-robotics-j4012-with-gmsl-extension-intelligent-edge-ai-computer-with-nvidia-jetson-orin-nx-super-16gb-ss100026552), [OpenELab](https://openelab.com/products/seeed-studio-recomputer-robotics-j4012), [Connect Tech Boson](https://connecttech.com/product/boson-for-framos-carrier-board-for-nvidia-jetson-orin-nx/), [DFRobot Nano Super](https://www.dfrobot.com/product-2900.html), [Coast IPC](https://coastipc.com/nru-220s?utm_id=1), [Waveshare Thor](https://www.waveshare.com/product/ai/boards-kits/jetson-agx-thor-developer-kit.htm), [SparkFun AI HAT+ 2](https://www.sparkfun.com/raspberry-pi-ai-hat-2.html). Reseller prices for the J4012 may predate the July increase.*

The J4012 is the strongest candidate because it fixes the dock's two real gaps. It runs a current JetPack, so Super mode (157 TOPS) and current Isaac ROS releases work without reflashing Unitree's carrier. It also has native CAN FD, which a PiPER needs; the D1 uses Ethernet. Even so, it duplicates the dock's Orin NX class of compute, and it can't fix the bigger constraint: VLAs are still too slow on any Orin. **AGX Orin is a poor buy here.** It costs $3,500 and draws up to 60 W, but runs VLAs at only 1–4 Hz, which is not enough faster than the NX to matter. Thor is the only Jetson that runs pi0.5/GR00T-class policies onboard at 20+ Hz. But it costs $5,499 and draws 40–130 W, and NVIDIA forum users report overheating and freezing even when capped at 70 W ([NVIDIA forum](https://forums.developer.nvidia.com/t/jetson-thor-overheating-and-freezing-power-mode-limited-to-70w-but-issue-persists/363204)). That makes it worth considering only if the robot must manipulate away from reliable Wi-Fi. No public build log shows a third-party AGX or Thor on a Go2 next to a LiDAR and an arm. The common pattern is the stock EDU Plus NX plus Unitree's Mid-360/XT16 and D1 bundles ([iRed](https://store.ired.co.uk/products/unitree-go2-edu-plus-xt16-d1-arm)).

## Power, network and mounting: give the arm its own supply and subnet discipline

### Power budget and rails

The dock's regulated rails add up to roughly 75 W, split across 12 V/3 A, 5 V/3 A and the M8's 12 V/2 A. That covers a LiDAR and a camera but not an arm. Unitree's accessory table gives the **Hesai XT16R at 9–36 V**, the **D1 arm at 24 V, 2.5 A (5 A max)**, and dual cameras at 3 W ([docs.quadruped.de](https://www.docs.quadruped.de/projects/go2/html/Overview_1.html)). The **PiPER runs on 24–26 V at ≤40 W average and ≤120 W peak**, plus up to 50 W for its gripper ([OpenELAB](https://openelab.io/blogs/learn/agilex-piper-vs-piper-x-the-ultimate-selection-guide-for-ros-amp-ai-robotics)). The **XT32 draws about 10 W, but Hesai recommends a supply of at least 30 W for inrush** ([OpenELAB XT32M2X](https://openelab.io/products/hesai-xt32m2x-32-channel-lidar)). The 24 W M8 rail falls short of that, so feed an XT32 from a 30 W+ DC-DC instead. An XT16 or L2 (about 9–13 W) fits the M8 rail. A VLP-16 needs **up to 3 A at 12 V during spin-up**, which only the 12 V/3 A user output provides, and with little margin. Two more constraints apply. The D1 is rated 24 V, below most of the battery's 24–33.6 V range, so it needs a **regulated 24 V DC-DC** and must never connect to the raw battery. A Go2 owner was also told not to run a D1-T off the 12 V/5 V outputs, and to use the battery-side port that feeds the dock instead ([r/unitree mirror](https://axebps-redlib.hf.space/r/unitree/comments/1inyn2p/help_d1t_servo_arm_from_unitree)). A published Go2 EDU payload build does the same thing: battery feed, then a DC-DC, then a small distribution board. Its advice is to size the converter for combined peak load, not average; that payload peaked at about 72 W ([dev.to](https://dev.to/yuanzhirobotics/how-to-add-a-thermal-camera-to-a-unitree-go2-edu-21ob)).

Brownout is the hidden risk. The Go2's peak working power is about **3,000 W**, roughly 100 A at 28.8 V ([docs.quadruped.de](https://www.docs.quadruped.de/projects/go2/html/Overview_1.html)), so jumps and stair climbs sag the bus. Any payload powered from the robot also dies at pack cutoff. Thor shows the consequence of a marginal supply: an over-current event at boot can **throttle its CPU to 242 MHz** until reboot ([NVIDIA forum](https://forums.developer.nvidia.com/t/jetson-thor-cpu-permanently-throttled-to-242-mhz-after-oc3-event-at-boot/361188)). If you tap the battery, use a wide-input buck rated at **1.5× peak**, an inline fuse, ideal-diode reverse-polarity protection, a TVS diode and hold-up capacitance.

### Network

The internal LAN is **192.168.123.0/24**. The motion MCU is at **.161** and publishes all robot topics, the dock Jetson is at **.18**, and integrators commonly add a router at .100 and developer PCs at .51 or .99 ([docs.quadruped.de driver](https://www.docs.quadruped.de/projects/go2/html/go2_ros2_driver.html); [unitree_ros2](https://github.com/unitreerobotics/unitree_ros2)). unitree_ros2 uses **CycloneDDS 0.10.x pinned to a named NIC** and recommends Humble ([unitree_ros2](https://github.com/unitreerobotics/unitree_ros2)). Third-party LiDARs default to 192.168.1.x: **Hesai XT and VLP-16 both use 192.168.1.201**, and the **L2 uses 192.168.1.62** ([ManualsLib XT32M2X](https://www.manualslib.com/manual/3350848/Hesai-Xt32m2x.html); [Unilidar 2 manual](https://oss-global-cdn.unitree.com/static/Unilidar%202%20User%20Manual.pdf)). Re-IP the LiDAR, or keep it on its own interface, and never run a VLP-16 and an XT on the same subnet without re-IPing one. Put a small gigabit switch on the payload for the D1 (RJ45) and any second computer. A PiPER goes on CAN through a USB-CAN adapter on the dock, or on the J4012's CAN FD ports. For the workstation link, mount a Wi-Fi 6 router on the payload with **its own subnet, routed or NATed**, and carry topics over Zenoh. Don't bridge 192.168.123.0/24 onto a shared network: **CVE-2026-27509 gives remote code execution on EDU firmware V1.1.11 to anyone on that subnet** ([Boschko](https://boschko.ca/unitree-go2-rce/)). Hesai XT units support PTP (≤1 µs) for time sync. The VLP-16 needs PPS + NMEA. The MCU clock is not PTP-disciplined, so expect millisecond-level skew between proprioception and LiDAR.

### Thermal and mounting

The Go2 is rated for **5–35 °C, fair weather, with no IP rating** ([docs.quadruped.de](https://www.docs.quadruped.de/projects/go2/html/Overview_1.html)). Keep compute in a ventilated, fan-cooled enclosure on top of the robot, not sealed in a shell. Use locking connectors (M8/M12, latched XT30) with strain relief, because falls and recoveries cause large shocks. The EDU payload is about **8 kg recommended and 12 kg max**. The **D1 weighs about 2.37 kg; the PiPER weighs 4.2 kg** ([Stemfinity D1](https://stemfinity.com/products/d1-servo-arm); [AgileX PiPER](https://global.agilex.ai/products/piper)). My rough budget for the recommended build is D1 2.4 kg, XT16 about 0.8 kg, two V-mount packs about 1.3 kg (typical spec, not sourced), switch, router and DC-DC about 0.3 kg, and 25% for brackets. That comes to **about 6 kg**. Swapping in a PiPER pushes it past 8 kg, so choose the **D1**. Open CAD for a two-level EDU deck with an AGX Orin bay, battery holder and LiDAR and RealSense mounts is available in [IADC-GO2-EDU](https://github.com/AliciaSuiseiko/IADC-GO2-EDU), and MYBOTSHOP's `go2_description` has xacros for the D1, Hesai, Mid-360 and RealSense ([MYBOTSHOP](https://www.docs.mybotshop.de/go2.html)). Mount the arm slightly forward, put batteries and compute behind center, and raise the LiDAR above the arm's sweep.

## 432 Wh buys about 1.5–1.8 hours with this stack

The EDU's long-endurance pack (BT2-06) is **15,000 mAh / 432 Wh, charges to 33.6 V, weighs about 2.5 kg, and fast-charges at 9 A** ([docs.quadruped.de](https://www.docs.quadruped.de/projects/go2/html/Overview_1.html); [Generation Robots](https://www.generationrobots.com/en/404131-go2-quadruped-robot-battery.html)). **Its rated voltage is quoted two ways.** Generation Robots, Scan and Canada Satellite give **28.8 V**, and 432 Wh ÷ 15 Ah = 28.8 V confirms it. Unitree's own battery page shows only a single **29.6 V / 8,000 mAh / 236.8 Wh** spec block, which is the standard BT2-05 pack. RoboticsCenter labels the long-range pack 29.6 V, apparently copying that page ([Unitree battery](https://www.unitree.com/en/go2/battery/); [RoboticsCenter](https://www.roboticscenter.ai/store/product/unitree-go2-long-range-battery)). Use 28.8 V nominal for the 15 Ah pack. The difference doesn't change any design decision, because both packs share the same 33.6 V maximum. Unitree claims **2–4 h** on this pack ([Unitree Go2](https://www.unitree.com/go2)). A Go2 study measured average currents of **about 4.0 A standing and 6.5 A walking at 0.5 m/s** (the paper mislabels them as mA), which is roughly 120 W and 190 W ([arXiv 2509.01765](https://arxiv.org/html/2509.01765v1)). The best US price for a spare long-range pack is **$1,200** at RoboticsCenter, plus about $147 for dangerous-goods shipping ([RoboticsCenter](https://www.roboticscenter.ai/store/product/unitree-go2-long-range-battery)). At over 160 Wh the pack cannot fly as passenger baggage ([FAA](https://www.faa.gov/hazmat/packsafe/more_info/?hazmat=7)). No aftermarket drop-in main pack exists. Questions about the proprietary 12-pin blade connector and booting without the BMS went unanswered on Unitree's forum ([MyBotShop forum](https://forum.mybotshop.de/t/go2-external-power-supply-procedure-like-go1-24v-20a-battery-discharge-connector-part-number/1866)).

**All figures in the table below are calculated estimates, not measurements.** Assumptions: 85% usable energy (about 370 Wh main), walking with payload at about 170 W, standing or manipulating at about 120 W, and 90% DC-DC efficiency. Dock-side loads are Orin NX at 25 W, XT16 at 10 W and D435i at 4 W, about 39 W total. The arm averages 30–60 W, the router and switch about 8 W, and an optional J4012 25 W.

| Configuration (estimate) | Main pack load | Main runtime | Aux load | Aux runtime (2× 98 Wh V-mount, ~176 Wh usable) | Aux runtime (24 V ~250 Wh, ~225 Wh usable) | Mission limit |
|---|---|---|---|---|---|---|
| Robot only, walking | ~150 W | ~2.5 h | — | — | — | 2.5 h |
| Everything on main pack, D1 light use | ~250 W | ~1.5 h | — | — | — | **1.5 h** |
| Everything on main pack, D1 working hard | ~285 W | ~1.3 h | — | — | — | 1.3 h |
| **Dock + sensors on main; D1 + router + switch on aux** | ~210 W | **~1.8 h** | 42–76 W | 2.3–4.2 h | 3.0–5.4 h | **~1.8 h** |
| Same, standing/manipulating | ~160 W | ~2.3 h | 42–76 W | 2.3–4.2 h | 3.0–5.4 h | ~2.3 h |
| + J4012 add-on on aux | ~210 W | ~1.8 h | 70–104 W | 1.7–2.5 h | 2.2–3.2 h | 1.7–1.8 h |
| Heavy: AGX Orin at 60 W + XT32 + D1, all on main | ~290–320 W | ~1.15–1.3 h | — | — | — | 1.2 h |

Two conclusions follow. First, the accessory battery **adds only about 20% to mission time** (1.5 h to 1.8 h), because locomotion dominates the draw. Its real value is electrical: it keeps the arm's 120 W peaks off the locomotion bus and off the dock's undocumented current limits, and it keeps the arm powered through a main-pack swap. Size it as **accessory W × target hours ÷ 0.9**. Two 98 Wh V-mount packs fit that sizing, stay under the 100 Wh airline limit ([FAA](https://www.faa.gov/hazmat/packsafe/airline-passengers-and-batteries)), and with a boost converter to 24 V outlast the main pack. Second, **a spare 15 Ah pack ($1,200) with a power-down swap of about a minute doubles mission time** more cheaply than anything else. Tuned RL gaits can add more: a Go1 study cut total battery power by 24–28% ([arXiv 2502.10956](https://ar5iv.labs.arxiv.org/html/2502.10956)). For unattended uptime, Unitree's **Self-Charging Board** works only with the **Go2 EDU Plus fitted with a Mid-360 or XT16** ([RobotShop](https://www.robotshop.com/products/unitree-self-charging-board-robotic-dog-go2-us-plug)). **Its price conflicts across sources.** Current US listings run **$1,195 (American Satellite) to $1,250 against a $1,299 list (Airpuria)** ([American Satellite](https://www.americansatellite.us/Unitree-Go2-Charging-Board.htm); [Airpuria](https://airpuria.com/products/unitree-go2-self-charging-board)). The **$1,044** figure in the companion Go2 report came from an older BotInfo summary that no live listing matched in November 2026. Budget about $1,200–1,300. Docking presumably relies on factory LiDAR localization, so test alignment after you add an arm or a LiDAR mast. Charging below 0 °C or above 50 °C triggers protection. Below freezing, expect capacity losses on the order of 20–30% (my estimate) plus LiDAR self-heating draw ([Livox Mid-360](https://www.livoxtech.com/mid-360/specs)).

## Recommended configuration and parts list

**Compute:** use the **Go2 EDU Plus's factory Orin NX 16 GB dock** as the only onboard computer. Image it before changing anything, leave JetPack 5.1 alone, and run your ROS 2 Humble stack in Unitree's Docker dev container ([unitree_ros2](https://github.com/unitreerobotics/unitree_ros2)). Run FAST-LIO2, Nav2 with its collision monitor, the D435i driver, a TensorRT detector, the D1 driver and NVENC video encoding on it. Run VLA, LLM/VLM, SAM, Grounding DINO, FoundationPose and cuRobo on the 5070 Ti, plus global mapping on the EPYC. Add a **reComputer Robotics J4012** on the aux rail only if you need JetPack 6, Isaac ROS or Super mode onboard, or if you choose the PiPER. Consider Thor only if VLA manipulation must run without Wi-Fi.

**Power:** run the dock, LiDAR and camera from the robot (dock rails: XT16 or L2 on the M8 port, D435i on USB). Put the D1, switch and router on a separate accessory battery: two 98 Wh V-mounts into a protected 24 V boost/regulator, or a 24 V Li-ion pack of about 250 Wh with its own BMS, fuse and e-stop. Carry a spare 15 Ah main pack.

**Network:** connect the dock (.18), D1 and any J4012 (.20–.50) through a gigabit switch on 192.168.123.0/24. Re-IP the LiDAR or isolate it on its own port. Mount a Wi-Fi 6 router on the payload with its own NATed subnet, and run Zenoh to the workstation. Set CycloneDDS on every machine to the robot-facing NIC and use a single `ROS_DOMAIN_ID`.

The core build is an EDU Plus, an L2 or XT16, a D1, a spare pack and the aux power, network and mount hardware. It comes to roughly **$20–21k with an L2 or $26–27k with the XT16 bundle**, before the optional board, dock and tax, using the low-end dealer prices above.

## Conclusion

The question this build turns on is battery and radio, not TOPS. Once the 5070 Ti handles the models, the 100 TOPS Orin NX already in the dock has more headroom than the stack needs, while locomotion consumes about 70% of every watt-hour. Spending on more onboard compute (AGX Orin, Thor) buys inference the workstation already does faster, and it takes runtime and payload from the robot. What actually limits the system is a 1.5–1.8 h mission and a Wi-Fi link that can't carry raw point clouds. That makes the most valuable work architectural: keep every safety-critical loop onboard, make every offboard output time-limited, and carry a second main pack.

The biggest unknowns are electrical. Unitree publishes no current limit for the 28.8 V body output or the dock's arm pass-through, and nobody has published a measured Go2 runtime with an arm. Log battery voltage and current from `lowstate` on your first sessions, and measure the dock rails before wiring the LiDAR. Treat every runtime above as a starting estimate to replace with your own data.
