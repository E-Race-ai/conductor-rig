</style><div class="wrap"><a class="back" href="research.html">← Research library</a><article id="doc"></article></div><script type="text/markdown" id="md"># The platform outruns its single GPU

This build is a 32-core, 8-channel, 256 GB Threadripper PRO workstation whose platform is sized for four GPUs and whose one 48 GB card is the part that limits local AI work. The parts fit together cleanly on paper: the board's two SlimSAS ports match the two U.3 drives, the PSU's two EPS cables match the two CPU inputs a single-PSU build uses, the case takes SSI-EEB boards and a 420 mm front radiator, and estimated full-load draw is about 835–890 W at the wall, roughly half the PSU's rating and well inside a 15 A circuit. Verified performance is strong where it has been measured: the 9975WX scores 4,070 in Cinebench 2024 multi-core and beats its 64- and 96-core siblings in lightly threaded work, and the RTX PRO 5000 runs 32B models at about 50 tokens/s and 70B models at about 26 tokens/s at 4-bit with short context. For orchestration, 256 GB of RAM and 32 cores comfortably cover 20 or more cloud-backed agents alongside a resident local model. The risks sit in assembly, not in sizing: an older-stock board needs a BIOS update before a 9000-series CPU will POST, the AIO fits the case with zero stated thickness margin, the memory runs at DDR5-4800 until EXPO is switched on, and the 13–19 W enterprise SSDs need direct airflow. A large share of what is published about these parts is vendor-sourced or conflicting, and no one has measured this exact system; the last section lists what remains open.

## What is in the box, and what each part is rated for

The CPU is the middle of the Zen 5 "Shimada Peak" range: **four 8-core CCDs plus one I/O die** in a package that carries twelve CCDs on the 96-core part ([ServeTheHome](https://www.servethehome.com/amd-reveals-ryzen-threadripper-9000-family-big-zen-5-chips-for-hedt-and-workstations/)). It is the first Threadripper generation with a full 512-bit AVX-512 datapath ([Igor's Lab](https://www.igorslab.de/en/amd-ryzen-threadripper-9000-wx-series-zen-5-workstation-power-in-neuer-dimension/)). Against the 7975WX it keeps the same core count, base clock, cache and TDP, and gains 100 MHz of boost and DDR5-6400 support for about 5% more money ([Puget Systems](https://www.pugetsystems.com/labs/articles/amd-ryzen-threadripper-pro-9000wx-content-creation-review/)).

The board is a workstation-server hybrid. All seven PCIe slots and all four M.2 slots hang off the CPU at PCIe 5.0; the two SlimSAS ports and four SATA ports come from the WRX90 chipset. It has no onboard Wi-Fi and no display output for a discrete GPU: the rear VGA port belongs to the BMC, and the USB4 ports carry video only when a GPU's DisplayPort is looped into the board's Mini DP inputs ([ASUS manual](https://doc.moyo.ua/19319326_1708005161.pdf)). The BMC has its own 1 GbE port and provides IPMI, a web UI and iKVM, which makes the machine manageable headless ([ASUS press release](https://press.asus.com/news/press-releases/asus-announces-pro-ws-wrx90e-sage-se-pro-ws-trx50-sage-wifi)).

The GPU is a 300 W card in the same dual-slot envelope as the RTX PRO 6000 Max-Q, with about 58% of that card's CUDA cores and 75% of its memory bandwidth ([CG Channel](https://www.cgchannel.com/2025/12/nvidia-launches-new-72gb-rtx-pro-5000-blackwell-gpu/)). It supports MIG as either one 48 GB instance or two isolated 24 GB instances ([NVIDIA/PNY datasheet](https://www.pny.com/File%20Library/Company/Support/Product%20Brochures/NVIDIA%20RTX/English/nvidia-rtx-pro-5000-blackwell.pdf)). The SSDs are 2020-era, read-intensive data-centre drives with power-loss protection; ServeTheHome scored the 7.68 TB model 9.1 overall ([ServeTheHome](https://www.servethehome.com/kioxia-cd6-pcie-gen4-data-center-ssd-review/)).

## Measured performance: one lab for the CPU, vendor blogs for the GPU

### The 9975WX is the fastest per-thread chip in its family

The only independent lab data with a documented bench for this CPU is Puget Systems' launch review, and it was run on this exact motherboard ([Puget Systems](https://www.pugetsystems.com/labs/articles/amd-ryzen-threadripper-pro-9000wx-content-creation-review/)).

| Benchmark (Puget) | 9975WX | 7975WX | 9985WX (64c) | 9995WX (96c) |
|---|---|---|---|---|
| Cinebench 2024 multi | 4,070 | 3,566 | 6,595 | 7,508 |
| Cinebench 2024 single | 125.7 | 109.3 | 125.7 | 125.3 |
| Blender CPU | 1,092.5 | 960.1 | 1,875.9 | 2,370.1 |
| V-Ray CPU | 87,274 | 70,902 | 145,710 | 179,697 |
| Unreal Engine code compile (time, lower is better) | 717 | 841 | 468 | 377 |
| Premiere Pro overall (standard) | 18,025 | 15,289 | 16,520 | 17,508 |
| llama.cpp CPU prompt processing (tok/s) | 246.4 | 208.1 | 394.1 | 429.2 |
| llama.cpp CPU token generation (tok/s) | 37.5 | 40.4 | 47.3 | 43.1 |

Puget states the generational gain as **14% in Cinebench multi, 17% in Premiere Pro, and a code compile that takes 85% of the 7975WX's time**. The 32-core part also beats the 60-core Xeon w9-3595X in Blender by 4%. Two things in the table matter for this build. First, single-thread speed is identical across the 32-, 64- and 96-core parts, and the 9975WX posts the highest Premiere, Photoshop, After Effects and DaVinci scores of the family, so the cheaper chip gives up nothing on the bursty, lightly threaded work that agent tooling generates. Second, the llama.cpp figures used a small model (Phi-3 Mini Q4) and show a regression in token generation against the older chip, so "faster at CPU inference" holds only for prompt processing. Puget's raw 7000WX-versus-9000WX numbers also fold in a memory-speed change (DDR5-5200 against DDR5-6400), so they are platform uplifts, not iso-memory CPU uplifts.

Other Cinebench 2024 multi-core figures for this chip range from 3,570 to 4,091, all from aggregator or reseller pages without a documented bench ([cpu-monkey](https://www.cpu-monkey.com/en/cpu-amd_ryzen_threadripper_pro_9975wx), [Punch Technology](https://www.punchtechnology.co.uk/hands-on-with-the-threadripper-9000-series/)). Puget's number is the one to trust.

### Memory channels matter more than memory speed

This build fills all eight channels, which is the decision that counts. Puget's follow-up testing on this board found that moving between DDR5-5200, 5600 and 6400 changed most results by about 3% or less, while going from four channels to eight made Unreal shader compiles 82% faster on the 9995WX and llama.cpp about 14% faster ([Puget Labs](https://www.pugetsystems.com/labs/articles/impact-of-ram-speed-on-amd-threadripper-pro-content-creation-performance/)). The kit's theoretical peak is 358.4 GB/s at DDR5-5600 and 307.2 GB/s at its DDR5-4800 default, against 409.6 GB/s for the platform's rated DDR5-6400; those are arithmetic ceilings, and no source has published a measured STREAM or AIDA64 figure for WRX90.

### The RTX PRO 5000 delivers about 50 tokens/s at 32B

Every GPU inference number found comes from hosting-vendor blogs, not independent labs. The best-corroborated set is single-user Ollama at 4-bit ([Database Mart](https://www.databasemart.com/blog/ollama-gpu-benchmark-pro5000)).

| Model (4-bit, Ollama) | File size | Tokens/s |
|---|---|---|
| gpt-oss 20b | 14 GB | 175.3 |
| deepseek-r1 14b | 9 GB | 110.0 |
| gemma3 27b | 17 GB | 51.1 |
| deepseek-r1 32b | 20 GB | 53.5 |
| qwen3 32b | 20 GB | 47.6 |
| llama3.3 70b | 43 GB | 26.1 |
| qwen2.5 72b | 47 GB | 23.7 |

A second vendor's fleet median puts qwen3:32b at 50 tokens/s on this card against 64 on the RTX PRO 6000, which corroborates the 32B figure ([Trooper.ai](https://www.trooper.ai/benchmarks-compare-RTX-Pro-5000-Blackwell-with-RTX-Pro-6000-Blackwell)). Under batched load the card is a different machine: vLLM with 50 concurrent prompts reached **about 2,100 output tokens/s on 8B FP16 models and about 1,250 on 14B models** ([Database Mart vLLM](https://www.databasemart.com/blog/vllm-gpu-benchmark-pro5000)). The gap to the RTX PRO 6000 is 17% on single-user Ollama and 54% on high-concurrency vLLM, which tracks the bandwidth deficit in the first case and the core-count deficit in the second ([Trooper.ai](https://www.trooper.ai/benchmarks-compare-RTX-Pro-5000-Blackwell-with-RTX-Pro-6000-Blackwell)). Stable Diffusion 3.5 Medium takes 5.5 s per image against 3.5 s on the 6000, with resolution and step count not stated.

The 70B result needs a caveat. A 43 GB file fits in 48 GB only with a short context: a separate test of a 72B Q4 model on this card fell to 12.1 tokens/s at 8K context and 4.4 tokens/s at 32K as layers spilled to the CPU ([computingforgeeks](https://computingforgeeks.com/rtx-pro-4000-vs-rtx-pro-5000-blackwell-local-ai-benchmarks/)). Treat 48 GB as a comfortable 32B-class card and a marginal 70B-class card.

### Supporting parts test well where tests exist

The power supply is the best-documented component. Cybenetics measured **91.6% average efficiency at 115 V, 93.6% at 50% load, 26.5 ms hold-up time**, ripple of 39.9 mV on 12 V at full load, and a fan that stays stopped from 10% to 50% load ([Cybenetics](https://www.cybenetics.com/evaluations/psus/2737/en/)). HWBusters rated it 9.3/10 and reports that it passes all ATX 3.1 transient tests ([HWBusters](https://hwbusters.com/psus/asrock-taichi-tc-1650t-atx-v3-1-psu-review/5)). Gamers Nexus found the Antec 900's thermals good but not class-leading, at 39 °C over ambient on CPU and 40 °C on GPU at full fan speed and 40.1 dBA, and declined to recommend it at $300 when Antec's own Flux Pro performs similarly for $180 or less ([Gamers Nexus](https://gamersnexus.net/cases/goat-antec-900-case-revisit-new-900-2026-review-benchmarks-and-thermals)). KitGuru built a Threadripper 9980X and RTX 5080 in the same case, measured 880 W at the wall, and scored it 8/10 ([KitGuru](https://www.kitguru.net/components/cases/leo-waldock/antec-900-case-review-2026/)).

The cooler is the least-tested part. No independent review measures the AW420 on any CPU. The only data points are for its smaller AW360 sibling, reported second-hand: a 9995WX held below 55 °C at about 350 W through a two-hour V-Ray render, and a 9970X with PBO reached 95 °C at about 445 W ([gaming-st.com](https://gaming-st.com/pcparts/thermaltake-aw360-aw420-workstation-aio-625w-tdp/)). Those results imply a stock 350 W chip runs comfortably on the larger radiator, and that enabling PBO consumes most of the headroom.

## Where the parts meet: fit, cabling and firmware

### Power connections match with nothing to spare on EPS

The board has seven power inputs: one 24-pin, two EPS 8-pin (CPU_12V), two PCIe 8-pin slot-power inputs (PCIE_8P_PWR), and two "PCIe-to-CPU" inputs used only in the dual-PSU scheme ([ASUS manual](https://doc.moyo.ua/19319326_1708005161.pdf)). The manual's single-PSU diagram shows the 24-pin, both EPS and both slot-power inputs connected, and requires the slot-power inputs once two or more graphics cards are installed. The TC-1650T ships exactly two EPS cables, eight PCIe 6+2 connectors and two 600 W 12V-2x6 cables ([HWBusters](https://hwbusters.com/psus/asrock-taichi-tc-1650t-atx-v3-1-psu-review)). So the wiring for this build is: 24-pin, both EPS to CPU_12V(1) and (2), one 12V-2x6 to the GPU's single 16-pin, and two PCIe 6+2 leads to PCIE_8P_PWR. The last pair is optional with one GPU, but connecting it clears the board's PLUG_8PIN_PCIE warning LED and costs nothing. The PCIE_CPU_12V pair stays empty. The manual asks for a single-rail PSU when the slot-power inputs are used, and this unit is single-rail at 137.5 A. A second 300 W GPU later drops onto the spare 12V-2x6 with no new hardware.

### The cooler fits one place, with zero stated margin

The 420 mm radiator goes in the front of the case because the top mount stops at 360 mm ([Antec](https://antec.com/product/case/900)). Radiator plus fans is 27 + 25 = 52 mm, exactly the case's listed thickness limit; Gamers Nexus measured the shroud cutout at about 55 mm, so real margin is around 3 mm and push-pull is out. The radiator is 456 mm long by the better-attested figure and houses the pump, with about 460 mm of tubing to reach the socket; no source confirms that this specific radiator clears the case's front bracket and PSU shroud, so test-fit before mounting the board. A front-mounted radiator displaces the three stock 140 mm intake fans, two of which fit the top as exhaust. That matters because the radiator dumps 350 W of CPU heat into the case ahead of the GPU and drives. The case ships without a fan hub, and the board supplies CPU_FAN, CPU_OPT, five chassis headers and a pump header at 3 A each, which is enough ([ASUS manual](https://doc.moyo.ua/19319326_1708005161.pdf)).

One firmware-level detail belongs in the cooling plan. Owners report that leaving CPU_FAN and CPU_OPT empty makes the BMC log about 100 lower-critical fan events a day, which wrapped one user's event log and erased months of crash evidence ([Level1Techs](https://forum.level1techs.com/t/wrx90e-sage-se-9975wx-two-separate-faults/252190)). Plug the radiator fans into CPU_FAN and the pump into W_PUMP+ rather than running everything from chassis headers.

### Flash the BIOS before the first boot

The first-edition manual lists only 7000-series CPUs, and Puget found the early 1106 BIOS incompatible with some DDR5-6400 RDIMMs until updated to 1203 ([Puget Labs](https://www.pugetsystems.com/labs/articles/impact-of-ram-speed-on-amd-threadripper-pro-content-creation-performance/)). An owner of a board manufactured in March 2025 reports it needed 1203 for a 9000-series chip ([Level1Techs](https://forum.level1techs.com/t/asus-pro-ws-wrx90e-sage-se-build-questions/244743/4)). BIOS FlashBack works with only the 24-pin connected and no CPU: rename the file to **A5496.CAP**, put it on a FAT32 stick in the marked port, and hold the button for three seconds ([ASUS manual](https://doc.moyo.ua/19319326_1708005161.pdf)). Do this on the bench before anything else. The same procedure is the fix for a known failure in which the board hangs at Q-Code B2 after a GPU swap and Clear CMOS does not help ([Level1Techs](https://forum.level1techs.com/t/psa-wrx90e-sage-se-stuck-at-q-code-b2-after-a-gpu-swap-bios-flashback-fixed-it-clear-cmos-didnt/253591)).

Expect a long first boot. ASUS states that 9000-series CPUs take longer to boot because of memory calibration and calls this normal ([ASUS techspec](https://www.asus.com/us/motherboards-components/motherboards/workstation/pro-ws-wrx90e-sage-se/techspec/)). BIOS 1317 carries a reported erratum in which a tuned tREFI value resets on every POST and forces a full retrain each boot; two users confirmed it and two did not, including one running the eight-module version of this exact Kingston memory ([Level1Techs](https://forum.level1techs.com/t/psa-asus-pro-ws-wrx90e-sage-se-bios-1317-errata/246753)).

### Memory arrives at DDR5-4800 until EXPO is enabled

The modules' SPD default is DDR5-4800 CL40 at 1.1 V; the advertised 5600 CL28 is an EXPO profile at 1.35 V ([Kingston datasheet](https://www.kingston.com/datasheets/KF556R28RBE2K4-128.pdf)). On a 9975WX the frequency is within the CPU's rating, but the timings and voltage are not JEDEC. Given Puget's finding that speed moves most workloads by 3% or less, EXPO is worth enabling and equally reasonable to abandon if training becomes unreliable. Two four-module kits are not a matched set of eight. Kingston's guidance for this board is to install identical groups of eight, and it sells a K8-256 kit for that purpose ([Kingston memory finder](https://kingston.com/en/memory/search/model/108920/asus-pro-ws-wrx90e-sage-se-motherboard)). Two kits of the same part number are the same module, so this is a caution, not a defect. Owners also report RDIMM temperatures of 65 °C in normal work and 80 °C in heavy compiles on this platform, and ASUS itself recommends extra memory cooling at full load ([Level1Techs](https://forum.level1techs.com/t/overkill-threadripper-9985wx/236032?page=2)). With an AIO, nothing blows across the DIMMs by default, which is another reason to add top exhaust fans.

### Storage maps one-to-one onto SlimSAS, on the board's slower path

The board has exactly two SlimSAS ports, each PCIe 4.0 x4, and the drives are PCIe 4.0 x4, so both run at full interface speed with no HBA and no PCIe slot consumed ([ASUS manual](https://doc.moyo.ua/19319326_1708005161.pdf)). Kioxia states its CD6 U.3 drives are natively backward compatible with U.2 NVMe connections ([Kioxia](https://business.kioxia.com/en-ca/news/2020/ssd-20200825-1.html)). The cable is a SlimSAS 4i (SFF-8654) to SFF-8639 lead with a SATA power tail, and all drive power comes through that tail ([STC Cable](https://www.stc-cable.com/u-2-u2-sff-8639-to-slimline-sff-8654-4i-nvme-pcie-ssd-cable.html)). At up to 19 W per drive, give each its own connector from the PSU's twelve SATA plugs. Generic cables of this type have a record of link errors on forums, so keep them short and verify the link after install ([Level1Techs](https://forum.level1techs.com/t/a-neverending-story-pcie-3-0-4-0-5-0-6-0-sci-fi-bifurcation-adapters-switches-hbas-cables-nvme-backplanes-risers-extensions-the-good-the-bad-the-ugly-will-there-be-a-final-solution/171428?page=3)).

Three things about this storage choice deserve attention. The drives are built for forced-air server bays, and the case's four combo bays under the PSU shroud, next to the two reverse-flow fans, are the likeliest place they will get airflow; whether the case's 2.5-inch mounts accept 15 mm drives is unconfirmed. The SlimSAS ports run through the chipset at Gen4 while the board's four CPU-attached Gen5 M.2 slots sit empty, so the fastest storage path on the board is unused. And HPE-branded Kioxia drives carry HPE's warranty and firmware channel, not Kioxia's ([Kioxia HPE OEM](https://business.kioxia.com/en-ca/ssd/oem/hpe.html)), so the listing's provenance determines what support exists.

### The GPU needs a current software stack

Blackwell requires an R570-or-newer driver and CUDA 12.8 or newer; older framework builds fail with "no kernel image is available" because they lack `sm_120` kernels ([NVIDIA Developer Forums](https://forums.developer.nvidia.com/t/software-migration-guide-for-nvidia-blackwell-rtx-gpus-a-guide-to-cuda-12-8-pytorch-tensorrt-and-llama-cpp/321330)). On Linux, Blackwell runs only on NVIDIA's open kernel modules ([NVIDIA driver README](https://download.nvidia.com/XFree86/Linux-x86_64/595.84/README/kernel_open.html)). PyTorch has supported it in stable releases since 2.7 with CUDA 12.8 builds. The card's headline 2,064 AI TOPS is an "effective FP4 with sparsity" figure reachable only through TensorRT 10.8+ or NVFP4 checkpoints; GGUF Q4 models in llama.cpp and Ollama use a different 4-bit scheme and see none of it.

The board's seven slots at single-slot pitch, ASUS's recommended four-card layout in slots 1, 3, 5 and 7, and the case's eight expansion slots together allow four dual-slot blower cards. Exxact validated that layout on this board with four same-size 300 W RTX PRO 6000 Max-Q cards, which held 300 W each and peaked at 85 °C, but only after custom cooling; with stock airflow the cards throttled ([Exxact](https://www.exxactcorp.com/blog/news/exxact-validates-4x-nvidia-rtx-pro-6000-blackwell-max-q-in-a-workstation)). A builder also found slot 7 collides with the board's audio and USB3 headers ([Level1Techs](https://forum.level1techs.com/t/solved-wrx90e-sage-se-trouble-posting-with-more-than-4-gpus/212695)).

## Power: about 850 W at the wall, half the PSU's capacity

No one has measured this system, so the whole-system figure is an estimate built from sourced component ratings. The CPU at its 350 W TDP, the GPU at 300 W, two SSDs at up to 19 W each and the AIO at about 17 W sum to roughly 705 W. An assumed 75–125 W for the board, VRM losses, eight RDIMMs, the BMC and case fans brings the DC total to about 780–830 W, or 47–50% of the PSU's rating. At the unit's 93.6% efficiency at that load, **wall draw is about 835–890 W, or 7.0–7.4 A at 120 V**. KitGuru's 880 W measurement of a comparable Threadripper-plus-GPU system in the same case supports the estimate ([KitGuru](https://www.kitguru.net/components/cases/leo-waldock/antec-900-case-review-2026/)). Enabling PBO adds roughly 100 W at the CPU, judging by the 9970X data point.

That load sits at the PSU's efficiency peak and inside the range where Cybenetics found the fan stopped, so the supply should be silent and the noise will come from the radiator fans (rated 31.6 dBA each at maximum) and case fans. It also fits a household circuit. Continuous loads on a 120 V, 15 A circuit are capped at 1,440 W under the NEC 125% rule ([EEPower](https://eepower.com/technical-articles/national-electrical-code-basics-sizing-and-protecting-branch-circuit-conductors/)), which leaves room for a second 300 W GPU but not much else on the circuit. The PSU's full 1,650 W output is a different matter: at 90% efficiency it needs about 1,833 W and 15.9 A at 115 V, which only a 20 A or 240 V circuit supplies. The unit's 64 A inrush at 115 V is relevant when choosing a UPS ([Cybenetics](https://www.cybenetics.com/evaluations/psus/2737/en/)). Idle power could not be sourced for this board or this build.

## What it does for agents and local models

Agent fan-out runs out of system RAM before it runs out of cores or VRAM, and this build is sized for that. In one documented Claude Code case, six parallel subagents spawned about 70 Node processes using 43.5 GB of resident memory and triggered the OOM killer with no CPU saturation ([GitHub #70523](https://github.com/anthropics/claude-code/issues/70523)); each session also launches its own copy of every configured MCP server at 44–300 MB apiece ([GitHub #40667](https://github.com/anthropics/claude-code/issues/40667)). On that evidence **256 GB is a comfortable target for 10–20 or more concurrent agents**, with enough left to hold a large model's CPU-side layers. Agents waiting on cloud APIs use almost no CPU; cores are consumed by the compiles, test suites, containers and headless browsers they launch. Thirty-two cores at the family's best single-thread speed suit that pattern, and Puget's Unreal compile result is the nearest measured proxy for parallel build work. No published benchmark measures agents per core, so the headroom claim is reasoning from workload shape, not a measurement.

For local models, 48 GB changes what can stay resident beside the agents. A 20B-class router such as gpt-oss-20b runs at about 175 tokens/s and uses 14 GB, leaving room for an embedding and reranker pair on the same card. A 30B-class coder fits at high-precision quantisation: Qwen3-Coder-30B-A3B is about 19 GB at Q4 and 32 GB at Q8 ([localaimaster](https://localaimaster.com/models/qwen-3-coder)). MIG can split the card into two isolated 24 GB halves, one per model. For shared serving, vLLM's batched throughput of 1,250–2,100 tokens/s on 8–14B models means one card can serve many agents making small calls concurrently, which is a better fit for orchestration than a single fast stream.

What 48 GB does not do is hold the strongest open models. gpt-oss-120b needs 61–68 GB and GLM-4.5-Air about 68 GB ([llama.cpp #15396](https://github.com/ggml-org/llama.cpp/discussions/15396), [llamabuilds.ai](https://www.llamabuilds.ai/models)), so both run here only in hybrid mode, with expert layers in system RAM. Hybrid speed is bounded by memory bandwidth, where this build's eight populated channels help: consumer rigs report 8–30 tokens/s for gpt-oss-120b in that mode, with RAM speed moving the result about threefold ([hardware-corner](https://www.hardware-corner.net/gpt-oss-offloading-moe-layers/)). No measurement exists for this configuration. The CPU alone is a weak inference engine for anything large; Puget's 37.5 tokens/s is for a 3.8B model, and Puget did not test large models.

The upgrade path follows from this. The 72 GB variant of the same card has identical compute and bandwidth, so it would run at the same speed and add only capacity; no benchmarks of it exist. A second 48 GB card gives 96 GB for less than one 72 GB card at launch pricing and drops into the existing PSU and slots, but multi-GPU tensor parallelism depends on PCIe peer-to-peer support that is unconfirmed on RTX PRO Blackwell. Running one model per GPU avoids the question.

## Conclusion

The build's balance is the reverse of most AI rigs: the CPU, memory, board, PSU and case are all provisioned for a machine two to four times larger on the GPU side, and the single 48 GB card is the only component working near its limit. That is a defensible shape for an orchestration box, because the agents live in RAM and on cores while the heavy reasoning goes to cloud APIs, and it makes every future dollar easy to place. A second blower card needs no new PSU, slot, or circuit. Past two cards, the constraints become case airflow and wall power, not the platform.

The practical uncertainty is concentrated in three places that only the assembled machine can resolve: whether the AW420 physically clears the Antec 900's front mount and holds a 350 W chip quietly, whether the eight Kingston modules train reliably at EXPO 5600 on current BIOS, and how hot two server SSDs run without backplane airflow. A first-boot checklist of FlashBack, a memory stress pass at both JEDEC and EXPO, `lspci -vv` to confirm 16 GT/s x4 on each drive, drive and DIMM temperatures under load, and a wall-power reading would turn most of the unverified table above into measured facts, and would produce the first published data for this cooler and this exact configuration.
