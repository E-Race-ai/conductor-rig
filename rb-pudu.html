</style><div class="wrap"><a class="back" href="robot-research.html">← Robotics research</a><article id="doc"></article></div><script type="text/markdown" id="md"># Pudu Robotics: Hospitality-Relevant Service Robots (as of Nov 2026)

Notes for choosing robots for a hotel "staff augmentation" layer dispatched by Hotel.OS. Most figures come from Pudu's own pages (vendor claims) or US resellers (also vendor-side). Labels used below: **[Pudu]** = Pudu official page or press release; **[Reseller]** = distributor or retailer listing; **[3rd-party]** = trade press or forum. I found no independently measured performance data, such as tests or audits, for any Pudu model.

## 1. Which current Pudu models fit hotels, and their specs

### Takeaway
For a hotel, the core Pudu lineup is FlashBot / FlashBot Max (enclosed room delivery that rides elevators), T300 (heavy loads for luggage, linen and back-of-house; 300 kg), BellaBot Pro and KettyBot Pro (restaurant, lobby and F&B trays on one floor), and CC1 Pro / MT1 Vac (floor cleaning). In Pudu's own 2026 hotel project, FlashBot handles amenity delivery and the T300 handles luggage. I found no Pudu security or patrol robot.

### Cited Findings

**Pudu's own hotel lineup (2026 reference design)**
- In the June 2026 Shenzhen "full-scenario robot-serviced hotel" project with Shenzhen Culture & Tourism Industry Development Co., Pudu assigned roles as follows: FlashBot for beverage vending and delivery from mobile orders; PUDU T300 for heavy luggage (300 kg payload, rides elevators on its own); CC1 Pro and MT1 for cleaning and floor maintenance; BellaBot Pro for coffee service; KettyBot Pro for snacks with an ad screen; PUDU D5 for guest "performances." Trial operations are planned for late 2026, and the vision runs to 2030 [Pudu press release] — [Hospitality Net](https://www.hospitalitynet.org/news/4132730/pudu-robotics-and-shenzhen-ctid-co-ltd-launch-the-worlds-first-full-scenario-robot-serviced-hotel-project)
- The project runs on Pudu's "PuduFM 1.0" embodied-AI foundation model and its "PuduAgent" platform, marketed as "One Brain, Multiple Embodiments" [Pudu] — [Hospitality Net](https://www.hospitalitynet.org/news/4132730/pudu-robotics-and-shenzhen-ctid-co-ltd-launch-the-worlds-first-full-scenario-robot-serviced-hotel-project)
- A report gives the room count as 44 guestrooms. Only one source has this figure and I could not confirm it — [search summary of Pulse report](https://www.pulse.bot/hotels/news/china-to-launch-fully-robot-operated-hotel-in-shenzhen-by-end2026-2e52fe56-be9d-4915-bbb8-4bf9ab74bf8b/)
- Pudu says it has shipped more than 130,000 units in more than 85 countries and regions (2026) [Pudu]. Its December 2023 release said "nearly 70,000" — [Hospitality Net](https://www.hospitalitynet.org/news/4132730/pudu-robotics-and-shenzhen-ctid-co-ltd-launch-the-worlds-first-full-scenario-robot-serviced-hotel-project); [Pudu news 2023](https://www.pudurobotics.com/about/news/658bfff79bc71f00446c345b)

**FlashBot Max (multi-floor enclosed delivery; main room-delivery model)** [Pudu] — [Pudu product page](https://pudurobotics.com/products/flashbot-new)
- Dimensions 538 × 534 × 1052 mm; weight 60 kg; path clearance 60 cm ("for narrow corridors and various elevator sizes").
- 2 to 4 adjustable compartments at 10 kg per layer. Single compartment 187 × 410 × 280 mm; double 380 × 410 × 280 mm.
- Cruise speed 0.5–1.2 m/s; runtime 9 h; charge 4 h; returns to dock on its own.
- Navigation uses VSLAM+ and LiDAR SLAM, with multi-sensor fusion for 3D perception of low and overhanging obstacles.
- Elevators: cloud elevator control that needs no elevator modification, compatible with KONE and OTIS, or Pudu's own hardware elevator-control module. IoT integration covers turnstiles and doors. Compartments unlock by password, phone number or NFC.
- Pudu markets it for "semi-outdoor hospitality," which suits resorts with covered walkways — [RobotLAB room service](https://www.robotlab.com/capabilities/room-service/)
- Note: the URL slug "flashbot-new" now renders the FlashBot Max page. Searches also turned up a "FlashBot Arm" variant (Pudu pages in DE and ES) with 2, 3 or 4 compartments and 70 cm path clearance — [search results](https://pudurobotics.com/de/products/flashbot-new). Third-party reports give the Arm as 539 × 515 × 1440 mm and 15 kg payload, and say it presses elevator buttons, swipes access cards and opens doors without building retrofits. Weight (50 vs ~70 kg) and price ($20k vs $34k) conflict across [chipsilicon](https://chipsilicon.pages.dev/humanoid/flashbot-arm-humanoid-robot), [Humanoid Press](https://humanoid.press/database/humanoid-press-database-flashbot/) and [humanoid.guide](https://humanoid.guide/?p=6698). Treat all Arm figures as unverified.

**FlashBot (original / prior generation)**
- RobotLAB lists 2–4 modular compartments, up to 12 h runtime, about 4 h charge, IoT elevator calling and boarding, and automatic doors. It does not publish payload ("Contact for details") [Reseller] — [RobotLAB FlashBot](https://www.robotlab.com/store/pudu-flashbot/)
- Pudu's 2024-07-15 datasheet is hosted by RobotShop. It is a prior-generation document — [RobotShop PDF](https://cdn.robotshop.com/media/P/Pud/RB-Pud-17/pdf/flashbot-20240715-en-datasheet.pdf)

**PUDU T300 (industrial delivery; luggage, linen carts, back-of-house)** [Pudu] — [Pudu T300 page](https://www.pudurobotics.com/products/pudut300)
- Two versions, Standard (WTID01) and Lifting (WTIDL1). Both are 835 × 500 × 1350 mm; weight 65 kg (Standard) or 81 kg (Lifting); max payload 300 kg.
- Max speed 1.2 m/s; runtime 12 h unloaded and 8 h at full load; charge 2 h (0–90%).
- Path clearance ≥60 cm (Standard). Crosses thresholds up to 20 mm and gaps up to 35 mm. The Lifting version raises 60 mm.
- Navigation uses VSLAM and LiDAR SLAM. Sensors are LiDAR, depth cameras, collision sensors and E-stops. Pudu claims ISO 3691-4 compliance.
- Modes: Standard, Shelf, Lifting and Towing; Auto, Follow and Power-assist. IoT: elevator control, e-gate/turnstile, pager remote call. Managed through the PUDU Link app.
- RobotLAB lists up to 20 robots coordinated through PUDU Scheduler [Reseller] — [RobotLAB T300](https://www.robotlab.com/pudu-t300)
- **T600 series:** 600 kg payload [Pudu comparison sheet] — [Pudu PDF](https://a.storyblok.com/f/306385/x/77d4c8bdd7/pudu-t600-series-pudu-t300-comparison-page-en.pdf). It has modular IoT for access control, elevators and call buttons, and can be deployed on-premises or in a private cloud — [Robotics 24/7](https://www.robotics247.com/article/pudu_robotics_launches_pudu_t600_series_of_industrial_delivery_robots). Industrial and oversized for most hotels.
- **T150:** a light-payload industrial model that lists e-gate control, elevator control and pager calling — [Pudu KR](https://www.pudurobotics.com/kr/products/puduT150). I did not collect detailed specs.

**BellaBot Pro (open trays; restaurant, room-service staging, lobby)** [Pudu] — [Pudu BellaBot Pro page](https://www.pudurobotics.com/en/products/bellabotpro)
- 57 × 55 × 129 cm; 55 kg; max payload 40 kg; tray 410 × 500 mm rated 10 kg each. The page does not state the tray count.
- Speed 0.2–1.2 m/s; runtime 11 h unloaded; charge 4.5 h; path clearance 65 cm.
- Sensors: 2 forward cameras, 3 RGBD sensors and 1 radar on the front chassis. Navigation is VSLAM + Marker + LiDAR SLAM.
- The product page does not mention elevator support, so treat it as a single-floor F&B robot.
- The original BellaBot is the prior generation, and BellaBot Pro supersedes it.

**KettyBot Pro (small tray robot with large ad screen; lobby greeting and snacks)**
- Payload up to 30 kg at 10 kg per layer [3rd-party/reseller] — [Sparkobot](https://sparkobot.pages.dev/robots/kettybot-pro). Weight is 38 kg per the Pudu datasheet of 2024-01-29 — [RobotShop PDF](https://cdn.robotshop.com/media/P/Pud/RB-Pud-12/pdf/kettybot-pro-datasheet-20240129.pdf).
- Runtime and battery conflict: about 9 h runtime and 3.5 h charge with a 20 Ah battery (datasheet), versus 25 Ah and 11 h — [Hospitality Hub](https://img0.hospitalityhub.com.au/pudu-robotics-restaurant-food-delivery-robot-10kg-tray-kettybot-pro/p/273404). Pudu product page: [KettyBot Pro](https://www.pudurobotics.com/product/detail/kettybot_pro)

**HolaBot (bussing / tableware return)**
- Up to 12 h operation per charge [Reseller] — [Deus Robotics](https://deusrobotics.com/pudu-robots/holabot). I found no payload or tray specs. Used for tableware return at Parkhotel Eisenstadt — [Pudu news](https://www.pudurobotics.com/about/news/658bfff79bc71f00446c345b)

**SwiftBot**
- Pudu Academy describes it only as an indoor robot with SLAM navigation. The excerpt I retrieved had no payload or battery data — [Pudu Academy](https://academy.pudutech.com/en/docs/chan-pin-jian-jie)

**PUDU CC1 Pro (4-in-1 scrub/sweep/vacuum/mop; lobbies, ballrooms, corridors)**
- Launched in 2025 — [Robotics 24/7](https://www.robotics247.com/article/pudu_robotics_launches_pudu_cc1_pro_ai_powered_autonomous_cleaning_robot)
- Covers 5,000–8,000 m² per deployment cycle; 700–1,000 m²/h for full coverage and 1,500–3,000 m²/h for AI spot scrubbing [spec sheet via reseller] — [Sparkobot spec sheet](https://sparkobot.pages.dev/docs/sparkobot-cc1-pro-spec-sheet.pdf)
- Runtime by mode: 5 h scrubbing, 5 h sweeping/vacuuming, 4 h carpet vacuuming, 9 h silent mopping; charge about 3 h. Other sellers say "up to 8 h" — [Sparkobot](https://sparkobot.pages.dev/docs/sparkobot-cc1-pro-spec-sheet.pdf)
- About 24.76 × 21.73 × 27.36 in; 165.35 lb (75 kg). Noise is <75 dB or <70 dB(A) depending on the seller. Auto charge and water refill/drain need an optional dock. IEC 63327 — [RobotShop CA](https://ca.robotshop.com/products/pudu-cc1-pro-intelligent-cleaning-robot-black)
- The original CC1 is the prior generation. A version comparison is here: [RobotShop PDF](https://cdn.robotshop.com/media/P/Pud/RB-Pud-40/pdf/cc1-version-comparison.pdf)

**PUDU MT1 Vac (large-area sweeper/vacuum; carpeted corridors, ballrooms)** [Pudu] — [Pudu MT1 Vac page](https://www.pudurobotics.com/products/mt1-vac)
- 840 × 600 × 490 mm; 75 kg; 55 cm vacuum width (70 cm with side brush); up to 1,400 m²/h.
- Runtime 3–6.5 h (4 h standard on hard floor); charge <3.5 h. Two 7 L dust bags (14 L) plus a 6 L trash bin.
- Navigation is VSLAM + marker + LiDAR SLAM, with AI trash detection and AI floor-type (carpet) recognition. H11 filtration (H13 optional).
- Pudu's spec sheet claims that in a typical 1,000 m² hotel carpet area it runs up to 10 days without emptying — [search summary of Pudu spec sheet](https://www.pudurobotics.com/products/mt1-vac)
- One European distributor claims "24-hour runtime." This conflicts with Pudu's own figure and should be disregarded — [Europa Satellite](https://www.europasatellite.com/PUDU-MT1-Vac-Al-powered-Robotic-Sweeper-Vacuum.htm)
- The product page shows "Elevators" and "E-gates" only as IoT labels, with no detail.

### Inferences
- The likely Hotel.OS stack is: FlashBot Max for guest-room amenity and in-room dining delivery; T300 for luggage and linen carts (the 60 cm path clearance matters for service elevators); BellaBot Pro or KettyBot Pro for F&B outlets; CC1 Pro for hard-floor public areas; MT1 Vac for carpeted corridors and ballrooms.
- The 60–65 cm path clearance across delivery models fits standard US hotel corridors, which are usually ≥1.1 m. The binding constraints are elevator cab depth and crowding.
- Cleaning robots likely need per-floor deployment or staff moving them between floors, because multi-floor elevator riding for CC1 Pro / MT1 is not documented. This is unverified.

### Gaps
- I found no Pudu security or patrol robot. I did not research the SH1 (or a similarly named) cleaning model, nor PUDU D5 or legged and humanoid models.
- HolaBot and SwiftBot payload, tray and battery figures were not found. BellaBot Pro tray count is not stated on its page.
- FlashBot (current) per-compartment payload is not published on RobotLAB. FlashBot Arm specs are inconsistent and not from Pudu.

## 2. Elevator and door integration

### Takeaway
Pudu offers two elevator routes: cloud or API integration with elevator OEMs (KONE and OTIS named; Otis Integrated Dispatch tested), or Pudu's own hardware elevator-control module for buildings without smart elevators. E-gates, turnstiles and automatic doors connect through Pudu IoT modules. Support varies by model.

### Cited Findings
- FlashBot Max: cloud elevator control with no elevator modification, compatible with KONE and OTIS, plus a "self-developed hardware elevator control" option. IoT handles turnstile access and automatic calls [Pudu] — [Pudu FlashBot Max](https://pudurobotics.com/products/flashbot-new)
- Pudu tested cloud integration between FlashBot and elevators with Nippon Otis using an API, via cloud or local connection, described as more scalable than hard-wired integration [3rd-party] — [Automated Warehouse](https://www.automatedwarehouseonline.com/pudu-robotics-successfully-integrates-flashbot-with-elevators/); [Elevator World](https://elevatorworld.com/news/daily-news/delivery-robot-successfully-integrated-with-japan-elevator/)
- T300: elevator control module, e-gate/turnstile control, pager remote call, managed through the PUDU Link app [Pudu] — [Pudu T300](https://www.pudurobotics.com/products/pudut300)
- T600: modular IoT for access control, elevator rides and goods call buttons — [Robotics 24/7](https://www.robotics247.com/article/pudu_robotics_launches_pudu_t600_series_of_industrial_delivery_robots)
- A RobotShop community answer says "many (though not all)" Pudu robots support smart elevators and electronic doors, and that an elevator upgrade module exists for non-smart elevators. This is a forum answer, not official [3rd-party] — [RobotShop community](https://community.robotshop.com/forum/t/can-pudu-robots-work-across-multiple-floors-or-use-elevators/134201/1)
- RobotLAB tells buyers to confirm compatibility with a specific building [Reseller] — [RobotLAB FlashBot](https://www.robotlab.com/store/pudu-flashbot/)
- Four Seasons Resort Maui: room-service robots across 12 floors with elevator integration [Reseller case study] — [RobotLAB room service](https://www.robotlab.com/capabilities/room-service/)

### Inferences
- For Hotel.OS, the cleanest route is likely the elevator OEM's cloud API (Otis Integrated Dispatch, KONE APIs), with Pudu as the robot side. That keeps elevator arbitration in the building OS rather than in Pudu's cloud. Whether Pudu lets a third party own elevator arbitration is unconfirmed.

### Gaps
- I found no public spec, price or install requirements for Pudu's hardware elevator-control kit, and no list of supported elevator controllers beyond KONE and OTIS.
- Access-control door integration (card readers, HID, ASSA ABLOY) is not documented beyond "e-gate/turnstile" and "access control." FlashBot Arm card-swipe claims are third-party only.

## 3. Fleet management and APIs

### Takeaway
Pudu's Open Platform (GA in August 2023) offers a Cloud API (task calls, status, webhooks), a Private Cloud API, a robot-side PUDU OS SDK, and a "PUDU Skill" for AI coding tools, authenticated with App Key/Secret. Multi-robot coordination uses PUDU Scheduler (up to 20 robots per RobotLAB). I found no official Open-RMF, MassRobotics or VDA 5050 support.

### Cited Findings
- The Open Platform went GA in August 2023. It standardizes interfaces so distributors and developers can access core robot functions remotely, for both delivery and cleaning robots [Pudu] — [Pudu news](https://pudurobotics.com/about/news/64eeb7cb13fc2f004432c9cd); [PR Newswire](https://prnewswire.com/news-releases/pudu-robotics-launches-open-platform-for-deeper-integration-and-remote-management-of-delivery-and-cleaning-robots-301910279.html)
- The developer portal lists the PUDU Cloud API (call robot tasks, check status, receive callbacks across regions), PUDU Private Cloud API, PUDU OS SDK (robot-side apps and plugins), PUDU Skill, and "Built-in Webhooks for real-time task status." Quick Start uses an App Key and Secret. The page does not name specific models or document map or elevator APIs [Pudu] — [open.pudutech.com](https://open.pudutech.com/en); [PUDU Skill](https://open.pudutech.com/pudu-skill)
- Developers can apply for free access; distributors onboard separately — [Pudu Open Platform](https://www.pudurobotics.com/en/open-platform). A legacy portal also exists — [open-legacy.pudutech.com](https://open-legacy.pudutech.com/en)
- PUDU Scheduler lets multiple robots share tasks. RobotLAB cites up to 20 robots for the T300 — [RobotLAB T300](https://www.robotlab.com/pudu-t300); [Automated Warehouse](https://www.automatedwarehouseonline.com/pudu-robotics-launches-open-platform-for-remote-management-of-amrs/)
- Open-RMF: a February 2025 Open Robotics Discourse thread shows a team *considering* a Pudu integration through the Open Platform API, with advice to build a fleet adapter that maps RMF waypoint names to robot points. No finished or official adapter is confirmed [3rd-party] — [Open Robotics Discourse](https://discourse.openrobotics.org/t/robot-integration-623/44594)
- Pudu and Deloitte published a white paper on an "Open Full-Stack Intelligent Service Robot Ecosystem" (April 2025) — [AAP / Cision](https://www.aap.com.au/aapreleases/cision20250424ae72143)

### Inferences
- Hotel.OS can probably dispatch Pudu delivery tasks through the Cloud API plus webhooks. A Private Cloud API option exists if data residency or on-premises control is required (the T600 explicitly supports on-premises). An Open-RMF bridge would need custom fleet-adapter work.

### Gaps
- I could not see endpoint-level docs: task types per model, map/POI access, elevator commands, rate limits, or whether the Cloud API covers cleaning missions to the same depth as delivery.
- No MassRobotics interoperability or VDA 5050 support found.

## 4. US pricing, purchase/lease/RaaS, distributors, warranty

### Takeaway
US reseller list prices are roughly $16k–$28k per unit, with 36-month RaaS around $400–$670/month. Prices are inconsistent even within one reseller's site. Warranty terms are not published on the pages reviewed.

### Cited Findings (all [Reseller], RobotLAB unless noted)
- BellaBot Pro: $16,000 purchase; RaaS $399/mo (36 mo) — [RobotLAB T300 page cross-listing](https://www.robotlab.com/pudu-t300)
- FlashBot Max: from $20,000; RaaS $559/mo (36 mo) — [RobotLAB room service](https://www.robotlab.com/capabilities/room-service/)
- FlashBot: the same page lists both $20,000 and $28,000, and the FAQ calls it "mid-five-figure" — [RobotLAB FlashBot](https://www.robotlab.com/store/pudu-flashbot/)
- T300: $20,990 or $21,000 (both appear); RaaS from $589/mo — [RobotLAB T300](https://www.robotlab.com/pudu-t300)
- CC1 Pro: $24,000 (RobotLAB, financing from $669/mo; ImageNet $24,000; UCG $25,000). Canada and NZ prices are higher. Self-cleaning dock about $2,854 extra — [RobotLAB CC1 Pro](https://www.robotlab.com/store/pudu-cc1-pro-robot/); [ImageNet](https://shop.imagenetconsulting.com/collections/all/products/pudu-cc1-pro)
- MT1 Vac: about $21,000 with a subscription option — [RobotLAB MT1 Vac](https://www.robotlab.com/store/pudu-mt1-vac/)
- Competitor reference on the same page: Keenon W3 is $29,600 or RaaS $829/mo — [RobotLAB room service](https://www.robotlab.com/capabilities/room-service/)
- US distributors and resellers seen: RobotLAB, RobotShop, ImageNet Consulting, UCG/ucghdd, Deus Robotics, Sparkobot, Canada Satellite (CA).
- Pudu reportedly opened a US headquarters in Dallas in April 2026. Only a third-party site reports this — [Chozan](https://chozan.co/pudu-robotics/)

### Gaps
- Warranty length and terms, service SLAs, spare-parts availability, and Pudu-direct US pricing were not found.
- No price found for the elevator kit or IoT modules, or for KettyBot Pro, HolaBot or SwiftBot in the US.

## 5. Notable hotel deployments and outcomes

### Takeaway
Named, verifiable hotel deployments are thin. Parkhotel Eisenstadt in Austria (Pudu press release, 2023) and Four Seasons Resort Maui (RobotLAB case study) are the only named properties found. Neither has independent outcome data. Pudu's Shenzhen robot hotel is a 2026–27 showcase, not yet an operating reference.

### Cited Findings
- **Parkhotel, Eisenstadt, Austria (Dec 2023)** [Pudu]: KettyBot greeting, BellaBot restaurant delivery, HolaBot tableware return, FlashBot room delivery of towels, toiletries and meals by elevator, CC1 meeting-room cleaning. Benefits are qualitative only — [Pudu news](https://www.pudurobotics.com/about/news/658bfff79bc71f00446c345b)
- **Four Seasons Resort Maui** [Reseller claim]: room service across 12 floors with elevator integration, "average delivery in under 8 minutes." The page does not confirm the robot model is Pudu (it lists FlashBot Max and Keenon W3) — [RobotLAB room service](https://www.robotlab.com/capabilities/room-service/)
- RobotLAB markets "hotel robots trusted by Four Seasons, Hilton, and Hyatt" and "200+ properties" without naming properties or brands per robot. It cites a "payback on the order of one to two years" as a target, not a measured result — [RobotLAB room service](https://www.robotlab.com/capabilities/room-service/); [RobotLAB hotel blog](https://www.robotlab.com/blog/hotel-efficiency-with-service-robots-2026/)
- **Shenzhen robot-serviced hotel** (West Artificial Island): trial in late 2026, with timelines to 2027 or 2030 varying by outlet — [Hospitality Net](https://www.hospitalitynet.org/news/4132730/pudu-robotics-and-shenzhen-ctid-co-ltd-launch-the-worlds-first-full-scenario-robot-serviced-hotel-project); [Fox News](https://www.foxnews.com/tech/chinas-robot-run-hotel-opens-public-2027). A Polish outlet questioned whether it is a "one-off spectacle" — [chip.pl](https://www.chip.pl/2026/06/hotel-sterowany-robotami-pudu)

### Gaps
- I found no named US Marriott, Hilton or Hyatt property using Pudu with published metrics, and no independent ROI or labor-hour study. Hotel trade press (Hotel Management, Skift) produced no Pudu-specific US case in my searches.
