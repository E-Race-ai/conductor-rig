</style><div class="wrap"><a class="back" href="robot-research.html">← Robotics research</a><article id="doc"></article></div><script type="text/markdown" id="md"># Pudu and Keenon Robots Under a Third-Party Building OS (Hotel.OS / Open-RMF): Integration, Security, Regulatory and Operational Risk (US, as of Nov 2026)

Research date: 2026-11-19. Scope: a large mixed-use Miami property (hotel, public lobby retail, residential floors) running a "staff augmentation" fleet of delivery and cleaning robots dispatched by Hotel.OS through Open-RMF where possible. Primary legal sources (FCC PDFs) were only partly readable, so several regulatory points rest on law-firm summaries. Each item says which kind of source it rests on.

## 1. Interoperability: Pudu/Keenon APIs, Open-RMF, MassRobotics/VDA 5050, how integrators connect

### Takeaway
Pudu has a documented developer program (PUDU Open Platform, cloud APIs, with a private-cloud option). Keenon has no public API/SDK documentation that I could find. Neither vendor has a published Open-RMF fleet adapter, and neither appears in MassRobotics or VDA 5050 materials. Integrating with Hotel.OS would mean building a custom "fleet-manager-level" RMF adapter on top of the vendor cloud API, and for Keenon a commercial SDK agreement.

### Cited Findings
- Pudu runs a developer portal, the PUDU Open Platform (open.pudutech.com), plus a legacy portal. Developers enroll ("Apply for Free as a Developer"). — [PUDU Open Platform](https://open.pudutech.com/en); [Pudu open-platform page](https://www.pudurobotics.com/en/open-platform); [legacy portal](https://open-legacy.pudutech.com/en)
- Pudu launched the Open Platform in Aug 2023. Per the announcement it "standardizes development interfaces and protocols," gives distributors and developers remote access to core robot functions, and supports integration with existing systems for food ordering, item delivery, inventory and opening smart doors. — [Pudu press release, Aug 2023](https://pudurobotics.com/about/news/64eeb7cb13fc2f004432c9cd); [Robotics Tomorrow, 29 Aug 2023](https://roboticstomorrow.com/news/2023/08/29/pudu-robotics-launches-open-platform-for-deeper-integration-and-remote-management-of-delivery-and-cleaning-robots/21027)
- The Pudu portal now offers a "PUDU SKILL" for AI coding tools that exposes the PUDU APIs, with a public-cloud install and a private-cloud option for enterprises. — [PUDU Open Platform – Pudu Skill](https://open.pudutech.com/pudu-skill)
- Pudu offers a "private deployment" option that keeps operational data on customer infrastructure instead of Pudu's cloud. A Tech Times analysis says this reduces Chinese-law data exposure but does not eliminate it. — [Tech Times, 9 Nov 2026](https://www.techtimes.com/articles/330290/20261109/pudu-robotics-puts-one-ai-model-three-robots-fcc-has-banned-its-humanoid-quadruped-us-markets.htm)
- No published Open-RMF fleet adapter for Pudu or Keenon was found. The only Pudu-specific Open-RMF item is a community discussion thread (2025) in which a team planned to integrate Pudu robots via the robots' API and asked which adapter approach fits. A reply noted that Pudu AMRs navigate around obstacles on their own, so they don't need dense waypoints. — [Open Robotics Discourse #623](https://discourse.openrobotics.org/t/robot-integration-623/44594)
- Open-RMF provides `fleet_adapter_template`, a Python full_control adapter template for wrapping a vendor fleet-manager API, and a community "awesome_adapters" list. An InOrbit RMF adapter exists as a precedent for connecting via a third-party cloud fleet manager. — [fleet_adapter_template](https://github.com/open-rmf/fleet_adapter_template); [awesome_adapters](https://github.com/open-rmf/awesome_adapters); [InOrbit RMF adapter announcement](https://discourse.openrobotics.org/t/announcing-rmf-fleet-adapter-for-inorbit/30577)
- MassRobotics AMR Interoperability Standard v1.0 (May 2021) shares status data (location, activity) between AMRs. It is used for monitoring. VDA 5050 is used for command/control under a common fleet manager, and the two can coexist. Coverage of both is about warehouse/logistics AMRs, and no Pudu or Keenon participation was found. — [MassRobotics/BlueBotics explainer](https://www.massrobotics.org/what-is-the-massrobotics-amr-interoperability-standard/); [Robotics 24/7 demo report](https://www.robotics247.com/article/massrobotics_partners_demonstrate_interoperability_standard_amr_logistics_week)
- Keenon: in a March 2023 press release, Keenon said it partnered with KONE to build an API platform letting robots ride elevators autonomously. This is a vendor claim; no technical docs were found. The same period saw a Keenon–Wyndham strategic cooperation announcement. — [KEENON–Wyndham release via AAP, Mar 2023](https://www.aap.com.au/aapreleases/cision20230326ae51652/)
- Keenon US reseller RobotLAB says that with a modern elevator controller that has an API, integration takes a "2–3 day spec." Otherwise it installs a relay-based cab caller that emulates button presses (about +1 week). This is reseller marketing. — [RobotLAB Keenon page](https://www.robotlab.com/manufacturers/keenon/)

### Inferences
- The realistic Pudu path is a Hotel.OS → Open-RMF fleet adapter (fleet_adapter_template pattern) → Pudu cloud or private-cloud API. RMF would do traffic and lift arbitration at a coarse level, and Pudu would keep local navigation. Expect "read-only plus task dispatch" control rather than true RMF path-level full_control.
- For Keenon, assume API access has to be negotiated contractually (a distributor or Keenon SDK agreement). Budget for an adapter built from scratch, and for the risk that Keenon exposes only task-level calls.
- Neither vendor supports MassRobotics or VDA 5050, so these standards add no value for this fleet. Open-RMF with custom adapters is the only standards-adjacent route.

### Gaps
- Endpoint-level Pudu API docs (auth model, task dispatch semantics, rate limits, webhooks) were not retrieved. Fetch open.pudutech.com directly.
- No public Keenon SDK/API documentation found. Whether Keenon offers a cloud API to US third parties is unknown.
- No confirmed hotel-tech-platform (PMS/service-request) integrations with Keenon were found. For Pudu, the Open Platform material mentions ordering, delivery and smart-door integration but names no hotel tech partners.

## 2. Elevator integration in practice (OEM APIs vs vendor IoT modules; cost; Florida fire code/AHJ)

### Takeaway
All four major OEMs have, or have announced, robot-facing cloud APIs (KONE Service Robot API, Otis Integrated Dispatch, TKE MAX APIs). Schindler's robot-specific API is unconfirmed. Pudu and Keenon also sell their own IoT/relay elevator modules, which are cheaper and faster but involve hard-wiring into the car operating panel. No authoritative cost data exists. The one per-elevator figure ($20K–$40K for KONE) comes from an unsourced vendor blog. Florida enforces ASME A17.1-2019 through 61C-5 F.A.C., so any modification touching elevator controls needs a licensed elevator contractor and permitting through the Miami-Dade elevator AHJ.

### Cited Findings
- KONE: Its Service Robot API links autonomous cleaning, delivery and security robots to KONE lifts. In a KONE hospitality reference (Sudima Hotels), a room-service robot called, rode and exited lifts autonomously. — [KONE Australia – Sudima Hotels reference](https://www.kone.com.au/stories-and-references/references/kone-partners-sudima-hotels.aspx); [Archify – KONE APIs in hospitality](https://www.archify.com/au/product/kone-au/updates/detail/bringing-digital-apis-and-connected-elevators-to-the-hospitality-sector)
- Otis Integrated Dispatch is a cloud API that lets autonomous robots use elevators capable of API connection. Otis has publicized an integration with a delivery robot at a Polish hotel and one in New Zealand. The search summary says the Otis NZ hotel case (Sudima Auckland) used a Pudu robot; this was not verified on the primary page. — [Otis Integrated Dispatch](https://www.otis.com/en/bh/products-services/products/otis-integrated-dispatch); [Elevator World – Otis NZ](https://elevatorworld.com/?p=107002); [Elevator World – Otis Polish hotel](https://elevatorworld.com/?p=78410)
- TK Elevator launched elevator and escalator APIs for its MAX IoT platform. — [Elevator World – TKE MAX APIs](https://elevatorworld.com/?p=56287)
- Otis has also expanded elevator-robot integration with Cobalt Robotics (security robots), a precedent for a non-hospitality robot vendor using an OEM API. — [Elevator World – Otis & Cobalt](https://elevatorworld.com/?p=55522)
- Schindler: no public robot-dispatch API was found (one secondary Chinese-language developer blog reports finding only an access-control/destination-dispatch interface). This is unverified. — [CSDN developer blog](https://damodev.csdn.net/6ad4158b49ed150a32d86301.html)
- Cost: one vendor blog lists KONE integration at about $20K–$40K per elevator ($2K–$5K engineering, $5K–$15K hardware). The same page makes an unsourced "78% of deployments fail" claim, so these numbers are unverified. — [ulearnrobotics blog](https://ulearnrobotics.pages.dev/resources/elevator-integration-delivery-robots)
- Timeline: RobotLAB claims 2–3 days for API-capable controllers and about 1 extra week for relay-based retrofit (reseller claim). — [RobotLAB Keenon page](https://www.robotlab.com/manufacturers/keenon/)
- Florida: the Bureau of Elevator Safety (DBPR) adopted ASME A17.1-2019, A17.3-2020 and A18.1-2020 via Rule 61C-5.001 F.A.C. (amended 30 Jan 2024). — [Fla. Admin. Code 61C-5.001 (Cornell LII)](https://www.law.cornell.edu/regulations/florida/Fla-Admin-Code-Ann-R-61C-5-001); [FL Bureau of Elevator Safety news](https://www2.myfloridalicense.com/elevator-safety/bes-news-room/)
- The Florida bureau has issued bulletins on door-lock monitoring and Firefighters' Emergency Operation testing. Chapter 399 F.S. governs elevator regulation, including Phase II firefighter service. — [FL BES news](https://www2.myfloridalicense.com/elevator-safety/bes-news-room/); [Fla. Stat. 399.02](https://www.flsenate.gov/Laws/statutes/2001/399.02)
- Miami-Dade County runs its own elevator inspection/violation regime (local AHJ). — [Miami-Dade Elevator Violation Codes](https://www.miamidade.gov/facilities/elevator-violation-codes.asp)

### Inferences
- Under fire recall (Phase I), cars return to the recall floor and stop answering hall/API calls. Robots inside a car will be carried to the lobby. Hotel.OS/RMF needs a "lift unavailable / fire alarm" state (an RMF lift-adapter mode) and robot policies to clear lobby egress paths. This is engineering inference, not a cited code provision.
- An OEM cloud API (no change to the safety circuit) is likely easier to approve with the AHJ than relay retrofits wired into car operating panels. Any panel modification is likely to need a licensed Florida elevator contractor, a permit and inspection under Ch. 399/61C-5. Confirm with the Miami-Dade elevator unit.
- In a mixed-use tower, residential and hotel banks may be on different OEMs/controllers. Model one RMF lift adapter per bank.

### Gaps
- No official pricing from KONE, Otis, TKE or Schindler, and no confirmed lead times.
- No Florida-specific ruling, bulletin or AHJ guidance on robots riding elevators was found.
- No primary documentation of the Pudu or Keenon elevator IoT modules (hardware, connectivity, certification) was retrieved.

## 3. Security: published vulnerabilities, cloud data flows to China, cameras/mics

### Takeaway
One major confirmed disclosure: in Aug 2025 a researcher showed that Pudu's cloud robot-management API checked tokens but not ownership, which allowed cross-tenant control of fleets (BellaBot, KettyBot, FlashBot and others). Pudu fixed it within days of escalation and set up a Security Response Center. No CVE was assigned. Nothing comparable was found for Keenon, which means there is no published research, not that Keenon is secure. Data-sovereignty risk comes from Chinese law (National Intelligence, Data Security and Cybersecurity Laws), and the FCC cited surveillance risk in its 2026 action.

### Cited Findings
- Researcher "BobDaHacker" (post 29 Aug 2025, updated 3 Sep 2025): Pudu robot-management APIs validated auth tokens but not permissions or ownership, so any authenticated user could act on any robot. The specific issues were reading any robot's call history (up to 20,000 store IDs per request, with no rate limit), creating calls (dispatching robots), changing robot settings, and listing robots by store. Models named: BellaBot, KettyBot, PuduBot, CC1, PUDU SH1 and FlashBot. Disclosed 12 Aug 2025; the researcher escalated to Pudu customers (e.g. Skylark Holdings, Zensho) and Pudu fixed the issues within days. — [Researcher's post (pentester.ca)](https://pentester.ca/blog/hacked-biggest-chinese-robot-company)
- The researcher hypothesized that a FlashBot (building delivery robot that rides elevators) could be misused to carry documents out of offices, and that robot screens could be hijacked for ransom/QR-code messages. These are hypotheses, not demonstrated attacks. — [pentester.ca](https://pentester.ca/blog/hacked-biggest-chinese-robot-company); [The Register, 29 Aug 2025](https://www.theregister.com/2025/08/29/pudu_robots_hackable/)
- Pudu's response: thanked the researcher for responsible disclosure, said it was upgrading the PUDU Security Response Center (SRC) and set up a dedicated security email. The researcher's 3 Sep update called the delay a communication breakdown, not malice. — [pentester.ca update](https://pentester.ca/blog/hacked-biggest-chinese-robot-company); [The Register](https://www.theregister.com/2025/08/29/pudu_robots_hackable/)
- No CVE or formal Pudu advisory was found for the Aug 2025 issue. Tech Times (Nov 2026) says no ongoing third-party audit has been publicly confirmed. — [Tech Times, 9 Nov 2026](https://www.techtimes.com/articles/330290/20261109/pudu-robotics-puts-one-ai-model-three-robots-fcc-has-banned-its-humanoid-quadruped-us-markets.htm)
- Pudu holds ISO 27001/27701 certifications (DNV, May 2024). Tech Times argues these, its privacy policy and server location do not change its obligations under China's National Intelligence Law (2017), Data Security Law (2021) and Cybersecurity Law (2017). — [Tech Times](https://www.techtimes.com/articles/330290/20261109/pudu-robotics-puts-one-ai-model-three-robots-fcc-has-banned-its-humanoid-quadruped-us-markets.htm)
- The FCC's July 2026 robotics action cited security vulnerabilities found in Unitree robots and an incident where a DJI robot-vacuum user accidentally gained access to about 7,000 other robots. The notice warned such devices could "collect data that could be leveraged by malign actors to surveil Americans." — [Forbes, 28 Jul 2026](https://www.forbes.com/sites/johnkoetsier/2026/07/28/united-states-bans-chinese-humanoid--quadruped-robots-citing-national-security/); [Tech Times](https://www.techtimes.com/articles/330290/20261109/pudu-robotics-puts-one-ai-model-three-robots-fcc-has-banned-its-humanoid-quadruped-us-markets.htm)
- Keenon: no published vulnerability research, CVEs or disclosures were found in searches through Nov 2026. — (search result: none found; see Gaps)

### Inferences
- The Pudu flaw was a cloud multi-tenant authorization failure. A property integrating through the vendor cloud inherits that blast radius: another tenant, or an attacker, could move robots inside the building. Mitigations: Pudu private deployment, robots on an isolated VLAN/SSID with egress allow-listing, Hotel.OS as the only dispatcher, physical-zone geofencing (no residential-floor access without access-control credentials), and contractual vulnerability-disclosure/patch SLAs.
- Delivery robots that ride elevators can cross security boundaries between hotel, retail and residential areas. Treat robot elevator credentials like a staff badge, scoped by floor and time.
- Cameras/depth sensors and any microphones (voice interaction on BellaBot-type units) in guest and residential corridors create privacy-notice obligations. Florida residential floors raise the stakes. This is an inference; no Florida-specific robot privacy rule was found.

### Gaps
- Exact Pudu/Keenon US data-residency (AWS US region vs China) and data categories (images, maps, audio) were not confirmed from primary privacy policies.
- No information on whether the robots store or upload camera imagery by default.
- No Keenon security posture data (no SRC, no bug bounty found).

## 4. US regulatory exposure (FCC Covered List, 1260H, state rules, tariffs) and support continuity

### Takeaway
The biggest 2026 change: on 28 Jul 2026 the FCC added all foreign-produced "advanced robotic devices" to the Covered List (DA 26-786). The definition plausibly covers wheeled delivery and cleaning AMRs. Previously authorized models can still be imported, sold and used, and a waiver allows security/compatibility software updates through at least 1 Jan 2029. New Pudu/Keenon models, though, can't get FCC authorization without Conditional Approval, which is reviewed by the Department of War. This is a model-roadmap and support-continuity risk rather than a ban on existing fleets. No evidence was found of Pudu or Keenon on the Section 1260H list. Tariffs add roughly 25%, possibly about 37.5%, to landed cost; secondary sources disagree.

### Cited Findings
- **28 Jul 2026, FCC Public Notice DA 26-786:** the Public Safety and Homeland Security Bureau added "foreign-produced advanced robotic devices" to the Covered List under the Secure Networks Act, following National Security Determinations of 27 Jul 2026. This is a category (place-of-production) listing, not a named-entity listing. — [FCC DA 26-786](https://docs.fcc.gov/public/attachments/DA-26-786A1.pdf); [Morgan Lewis, Aug 2026](https://www.morganlewis.com/pubs/2026/08/fcc-adds-foreign-produced-advanced-robotic-devices-and-power-inverters-to-covered-list-opens-conditional-approval-process); [Sidley, Aug 2026](https://www.sidley.com/en/insights/newsupdates/2026/08/fcc-adds-all-foreign-produced-advanced-robotic-devices-to-the-covered-list)
- **Definition (per Morgan Lewis):** mechanical mobile devices (AMRs, humanoids, quadrupeds) that meet all of these: they move on the ground (locomotion/navigation/obstacle avoidance); operate at a distance from humans on commands and/or sensor data; weigh more than 4.4 lb with any dock; and have an environmental sensor, at least 200 kbps connectivity, and software controlling navigation, perception, data collection or remote command. Morgan Lewis says this "may encompass" wheeled systems in logistics, security, commercial services and homes, "such as vacuum robots and robot lawn mowers." Excluded: connected vehicles, rail-only vehicles, UAS, UUVs, certain FDA-regulated devices, and fixed industrial/medical robots. — [Morgan Lewis](https://www.morganlewis.com/pubs/2026/08/fcc-adds-foreign-produced-advanced-robotic-devices-and-power-inverters-to-covered-list-opens-conditional-approval-process)
- **Conflicting characterizations:** Forbes and Fox describe the action as covering humanoid and quadruped robots. The law-firm summaries use the broader "advanced robotic devices" definition. Tech Times (9 Nov 2026) says Pudu's D9 humanoid and D5 quadruped cannot enter the US as new products, while Pudu's existing cleaning and delivery robots, which already hold FCC authorizations, "continue to be sold and operated." — [Forbes, 28 Jul 2026](https://www.forbes.com/sites/johnkoetsier/2026/07/28/united-states-bans-chinese-humanoid--quadruped-robots-citing-national-security/); [Fox News](https://www.foxnews.com/tech/foreign-robot-ban-targets-china-security-fears); [Tech Times](https://www.techtimes.com/articles/330290/20261109/pudu-robotics-puts-one-ai-model-three-robots-fcc-has-banned-its-humanoid-quadruped-us-markets.htm)
- **Existing equipment:** previously authorized models may continue to be imported, marketed, sold and used. Equipment already acquired is unaffected. Status should be checked per model and FCC ID. Models not authorized before 28 Jul 2026 don't qualify. Private contracts or procurement rules may still restrict Covered List equipment. — [Morgan Lewis](https://www.morganlewis.com/pubs/2026/08/fcc-adds-foreign-produced-advanced-robotic-devices-and-power-inverters-to-covered-list-opens-conditional-approval-process)
- **Software updates:** the OET waiver (DA 26-789, 28 Jul 2026) permits qualifying Class I/II software and firmware updates (vulnerability patches, OS compatibility) for devices authorized before 28 Jul 2026, through at least 1 Jan 2029. — [Morgan Lewis](https://www.morganlewis.com/pubs/2026/08/fcc-adds-foreign-produced-advanced-robotic-devices-and-power-inverters-to-covered-list-opens-conditional-approval-process)
- **Conditional Approval:** for robots it is reviewed by the Department of War alone. Submissions require disclosure of corporate structure and 5% owners, foreign-government influence, BOM/component origin and a time-bound US manufacturing plan with quarterly reporting. There is no stated review timeline and decisions are final. Morgan Lewis gives the deadline for Conditional Approval submissions as 1 Jan 2028. — [Morgan Lewis](https://www.morganlewis.com/pubs/2026/08/fcc-adds-foreign-produced-advanced-robotic-devices-and-power-inverters-to-covered-list-opens-conditional-approval-process)
- **Later FCC notices:** DA 26-1114 (16 Oct 2026) concerns conditional approval and exemption of certain advanced robotic devices and power inverters. I could not read which entities were approved (the PDF did not parse). DA 26-1130 (21 Oct 2026) also exists, but its content was not reviewed. — [FCC DA 26-1114](https://docs.fcc.gov/public/attachments/DA-26-1114A1.pdf); [FCC DA 26-1130](https://docs.fcc.gov/public/attachments/DA-26-1130A1.pdf)
- **Keenon:** not named in the FCC notice. A secondary blog lists Keenon (T9, T8, W3, DINERBOT) among affected brands, which is unverified. — [OpenDroids blog](https://www.opendroids.com/blog/fcc-robot-ban-2026); [Knox Labs](https://www.knoxlabs.com/blogs/articles/fcc-rules-foreign-produced-robots)
- **Allied production:** the rule applies by place of production, so a non-Chinese company manufacturing in China is treated the same. Exemptions for allied-country production are expected (speculative). China has threatened retaliation. — [Rest of World, 2026](https://restofworld.org/2026/china-robot-ban-silicon-valley/); [Lexology](https://www.lexology.com/library/detail.aspx?g=49f7a6be-bb5e-4816-ba2f-86ce576edb09)
- **Congress:** the House NDAA (FY2027) includes provisions targeting foreign-adversary humanoid robots. Final enacted status was not verified. — [Cleary Trade Watch, Aug 2026](https://www.clearytradewatch.com/2026/08/fcc-adds-foreign-produced-robotics-power-inverters-to-covered-list-house-ndaa-targets-foreign-adversary-humanoid-robots/)
- **Section 1260H:** the Department of War added 65 entities, including robotics companies, around 8–10 Jun 2026. Listing does not impose sanctions, but from 30 Jun 2026 DoD may not buy directly from listed entities, and indirect restrictions follow in 2027. No source places Pudu or Keenon on the list. — [WilmerHale, 11 Jun 2026](https://www.wilmerhale.com/en/insights/client-alerts/20260611-pentagon-adds-65-new-entities-to-the-1260h-list-of-chinese-military-companies); [Holland & Knight, Jul 2026](https://www.hklaw.com/en/insights/publications/2026/07/department-of-war-updates-section-1260h); [MoFo, Jun 2026](https://www.mofo.com/resources/insights/260626-dod-expands-the-section-1260h-chinese-military-companies-list)
- **Tariffs:** secondary sources say Chinese-origin robots under HTS 8479.50/8428.70 carry a 25% Section 301 duty, plus a reported additional 12.5% Section 301 duty from 24 Jul 2026 (9903.05.31) after the IEEPA tariffs ended. These are blog sources and conflict, so verify against the HTSUS. — [Sourcebotics guide](https://sourcebotics.com/guides/us-tariffs-on-chinese-robots-2026/); [Robot Central duty stack](https://robotcentral.store/guides/us-tariffs-on-chinese-robots/); [VentureOutsource](https://ventureoutsource.com/contract-manufacturing/section-301-robotics-systems-components/)
- **Section 232 (robotics):** on 28 Oct 2026 the President declared robot imports a national-security concern but set no tariff rate, ordering negotiations with a progress update within 180 days (about 26 Apr 2027). — [The Next Web](https://thenextweb.com/news/trump-robot-imports-national-security-section-232); [Metrology News](https://metrology.news/no-new-u-s-tariffs-on-industrial-machinery-and-robotics/)

### Inferences
- For a 2026–2027 purchase: buy only models with a pre-28-Jul-2026 FCC grant (verify the FCC ID). Contract for spare parts and battery stock and firmware support through 2029+. Expect new Pudu/Keenon models (e.g. next-gen delivery units) to be unavailable in the US unless Conditional Approval is granted, which is unlikely for Chinese-produced devices given the US-manufacturing-plan requirement.
- Replacement radios (Wi-Fi/LTE modules) and any hardware revision needing a new FCC grant could become blocked, which threatens repairability. This inference has not been confirmed by FCC guidance.
- The Covered List also creates reputational and contractual risk: residential HOA/condo boards, corporate retail tenants or government-contract tenants may contractually bar Covered List devices.
- Total landed duty of about 25–37.5% is plausible, but confirm with a customs broker.

### Gaps
- Who received Conditional Approvals (DA 26-1114) and whether Pudu/Keenon applied.
- Whether the FCC intends to revoke existing authorizations (Tech Times says it has not done so for Pudu).
- No Florida or other state law restricting Chinese robotics vendors was found. Florida's existing "foreign country of concern" laws (e.g. on government procurement/data) were not researched here.
- Keenon's corporate status (e.g. any HK IPO) was not confirmed.

## 5. Operations: ADA, safety standards, insurance, labor, utilization/ROI

### Takeaway
Safety standards for public-space service robots are thin. ANSI/A3 R15.08 covers industrial mobile robots, ISO 13482 covers personal-care robots, and UL 3300 (service/communication/information/education robots) applies to mobile service robots in commercial spaces, but I could not verify which Pudu/Keenon models are certified to it. UNITE HERE has a national technology program and contract language requiring notice/bargaining and retraining before new technology. ROI figures are almost entirely vendor-sourced and vary widely; realistic hotel delivery volume appears to be tens per day per robot, not hundreds.

### Cited Findings
- ANSI/A3 R15.08-2 (2023) covers integrating industrial mobile robots and fleets into sites. It builds on R15.08-1-2020, Part 3 (user requirements) is planned, and the scope is industrial, not public spaces. — [A3 announcement](https://www.automate.org/robotics/company-industry-news/ansi-a3-r15-08-2-safety-standard-for-industrial-mobile-robot-systems-and-applications-now-available); [Design World](https://www.designworldonline.com/a3-releases-more-safety-standards-for-industrial-mobile-robots/)
- UNITE HERE (written testimony to the Senate HELP Committee, 9 Oct 2025) says it began a national technology program in 2018 covering bargaining and research on workplace technology. — [UNITE HERE testimony, Senate HELP, 9 Oct 2025](https://www.help.senate.gov/download/aramayo-testimonypdf)
- The Las Vegas Culinary Union added technology-adoption language in its 2018 contract and protected/expanded it in 2023, including notice and free retraining. A report says a robotics company had to meet with UNITE HERE before deploying robots on tasks such as bed-making. — [Facilities Dive](https://www.facilitiesdive.com/news/hospitality-union-tech-battles/734712/); [Culinary Union 226 clip (Mashable)](https://www.culinaryunion226.org/news/clips/robotics-company-makes-aggressive-push-into-las-vegas-service-industry)
- Relay Robotics case studies: The Concordia (DC) averages about 2,500 deliveries/yr (about 7/day); EMC2 Hotel Chicago about 400/week for 195 rooms (about 57/day); Residence Inn LAX reports about $1.7K/month incremental revenue and a 0.5%+ RevPAR lift. These are vendor case studies. — [Relay – The Concordia](https://relayrobotics.com/case-studies/the-concordia-washington-dc); [Relay – Residence Inn LAX](https://relayrobotics.com/case-studies/residence-inn-by-marriott-lax); [Relay Robotics](https://relayrobotics.com)
- Third-party and reseller ROI claims conflict: RobotLAB estimates about $15/day operating cost and 50–200 deliveries per shift; OXmaint says 12–18-month payback at 90%+ uptime; Robozaps says 5–8 months. — [RobotLAB blog 2026](https://www.robotlab.com/blog/hotel-efficiency-with-service-robots-2026/); [OXmaint](https://oxmaint.com/industries/hospitality/room-service-robots-hotel-maintenance); [Robozaps](https://blog.robozaps.com/b/humanoid-robots-in-hospitality)

### Inferences
- ADA: robots in corridors, elevators and lobby retail must not block the 36-in minimum accessible route or elevator access for wheelchair users, and must yield. Configure RMF lift policy so robots never take the last car or ride with guests who use mobility devices. This is a design inference from ADA Standards; no robot-specific DOJ guidance was found.
- Union exposure: if the Miami property's hotel workforce is or becomes UNITE HERE–represented (e.g. Local 355 in South Florida), deploying robots for housekeeping or delivery duties likely triggers notice and bargaining obligations. Framing the robots as "staff augmentation" with no headcount reduction and a retraining commitment matches union contract precedent.
- Insurance: expect carriers to ask for the robot's safety certifications (UL 3300 / ISO 13482), vendor product liability coverage, and cyber coverage covering the cloud-hijack scenario. No insurer-specific guidance was found.

### Gaps
- UL 3300 and ISO 13482 certification status of specific Pudu/Keenon models (e.g. Pudu FlashBot, Keenon W3, Pudu CC1) was not verified.
- No independent (non-vendor) hotel ROI study was found. No AHLA position statement on robots was retrieved.
- No South Florida–specific union statement on robots was found.

## 6. Non-Chinese alternatives (brief)

### Takeaway
US- and Korea-backed options exist for each function: Relay (hotel room delivery, US), Bear Robotics (now LG-controlled, F&B delivery), and Avidbots/Brain Corp (floor cleaning). Their place of production still determines FCC exposure, because the Covered List is production-based, not ownership-based.

### Cited Findings
- Relay Robotics (US, ex-Savioke) builds hotel room-delivery robots. Relay2 offers double the capacity of its predecessor. — [Robotics 24/7 – Relay2](https://www.robotics247.com/article/relay_robotics_releases_new_hotel_delivery_robot_that_offers_double_the_capacity_of_its_predecessor); [Hospitality Net](https://www.hospitalitynet.org/news/4116700.html)
- LG took a 51% controlling stake in Bear Robotics (Silicon Valley) in Jan 2025, after a $60M/21% investment in Mar 2024. LG's commercial CLOi robot business is being integrated with Bear. — [LG newsroom, Jan 2025](https://www.lg.com/global/newsroom/news/corporate/lg-acquires-majority-stake-in-bear-robotics-to-bolster-robotic-capabilities/); [Hotel Management](https://www.hotelmanagement.net/tech/lg-acquires-majority-stake-bear-robotics)
- The FCC Covered List applies by production location, so a US/Korean/Japanese brand manufacturing in China is treated like a Chinese vendor. — [Rest of World](https://restofworld.org/2026/china-robot-ban-silicon-valley/); [Lexology](https://www.lexology.com/library/detail.aspx?g=49f7a6be-bb5e-4816-ba2f-86ce576edb09)

### Inferences
- Before treating any "non-Chinese" vendor as lower-risk, ask for country of final assembly and FCC grant dates.
- Relay was originally a hotel-native product, which may simplify PMS/phone-system integration compared with Pudu/Keenon's restaurant-first design.

### Gaps
- Avidbots, Brain Corp and Richtech Robotics were not researched in this pass (searches returned nothing usable). Their manufacturing locations, APIs and Open-RMF support are unknown.
- Whether Relay or Bear publishes an Open-RMF adapter or open dispatch API was not checked.
