Plan written 2026-11-18. It is based on the research in `research_notes/Go2 X addon integration/`, `Go2 onboard compute options/`, `Robotic arm on Go2 EDU/` and `Velodyne VLP16 Puck LiDAR/`. Figures marked *est.* are my calculations, not measurements.

## What you have

- **Robot:** Unitree Go2 X.
  - 8 Ah / 237 Wh battery, about 1–2 h of walking.
  - About 8 kg rated payload.
  - Wi-Fi 6, 4G and Bluetooth.
  - L2 (or older L1) LiDAR in the head.
  - Rated "partial" developer access by Unitree. There is no EDU expansion dock and no Unitree-documented power output for accessories.
- **Add-on computer:** NVIDIA Jetson Orin Nano Super Developer Kit (B&H 1994308, part 945-13766-0000-000).
  - 6-core Arm CPU, 1024-core Ampere GPU, 8 GB shared memory.
  - Up to 67 TOPS in Super mode with JetPack 6.2, at 7–25 W.
  - Powered by a 19 V barrel plug.
  - 1× Gigabit Ethernet, 4× USB 3, 2× M.2 slots for an NVMe SSD, onboard Wi-Fi/Bluetooth card.
  - About 176 g; the board is roughly 100 × 79 mm.
  - It has **no hardware video encoder**, so streaming video costs CPU.
  - NVIDIA's list price rose from $249 to $399 in July 2026.

## Step 1: Find out what the X lets the Jetson control (do this first)

This decides the whole software stack. No one has publicly confirmed low-level control on an X.

1. **Phone app:** look for an option to turn off sport mode. If there isn't one, low-level joint control is almost certainly blocked.
2. **Save the key before anything else:** while the robot still has internet, pull the per-robot AES key from your Unitree account. The community drivers need it on firmware 1.1.15 and later.
3. **Stop automatic updates:** after that, keep the dog offline (Wi-Fi to the internet and the 4G SIM). Firmware updates have broken the community drivers twice.
4. **Network test:**
   - Run a cable from the X's rear Ethernet port to the Jetson.
   - Give the Jetson the static address 192.168.123.99/24. Avoid .161 (motion board), .18 and .100.
   - `ping 192.168.123.161`, then list the CycloneDDS topics with unitree_ros2 (`ros2 topic list`).
5. **Result A:** `rt/lowstate`, `rt/sportmodestate` and the sport request topics appear. Use the official **unitree_sdk2 / unitree_ros2 over the cable**. The X then behaves like an EDU, minus the dock. Test lowcmd only with the dog hung up, starting in damping or zero-torque.
6. **Result B:** only a few topics, or no response. Use the community **WebRTC drivers** (`go2_ros2_sdk`, `unitree_webrtc_connect`) from the Jetson over the robot's Wi-Fi. You get walk/turn/stand commands, video, the head LiDAR and slow (~1 Hz) joint state, but no joint control.

## Step 2: Software on the Jetson

- **NVMe SSD:** add a 1 TB NVMe SSD (~$80–120 est.) and boot from it, not microSD.
- **JetPack 6.2:** flash it on Ubuntu 22.04 to unlock **Super mode** (67 TOPS, 25 W profile). It pairs with **ROS 2 Humble**, the version unitree_ros2 recommends. Pin CycloneDDS 0.10.x to match the robot.
- **Containers:** run Docker with Isaac ROS containers as needed.
- **Over the cable (Result A):** bind CycloneDDS to the Ethernet interface.
- **Link to the workstation:** Zenoh (rmw_zenoh or zenoh-bridge) over Wi-Fi to the EPYC/5070 Ti workstation. Zenoh handles Wi-Fi better than DDS.

### What runs where

| On the Jetson (must keep working if Wi-Fi drops) | On the 5070 Ti workstation |
|---|---|
| Robot interface (SDK2 or WebRTC driver) and a command watchdog that stops the dog when commands time out | Vision-language-action models (SmolVLA → π0.5) for the arm, using action chunking |
| LiDAR driver plus Point-LIO / FAST-LIO2 odometry | LLM/VLM task planner (e.g. Qwen-VL / gpt-oss via vLLM or Ollama) |
| Nav2 local planner and collision monitor | Open-vocabulary detection, SAM, grasp planning |
| Arm driver plus arm e-stop logic | Global map and loop closure, training (LeRobot, Isaac Lab) |
| Low-resolution camera stream (software encoded, about 640×480 at 15 fps) | Data logging |

The 8 GB of shared memory is the limit. Don't try to run VLAs or LLMs larger than about 3B on the Nano. A Qwen3-VL-2B-class model runs at about 30 tok/s if you want an offline fallback.

## Step 3: Power

Don't count on a power output from the X. No Unitree source documents a live, current-rated port on non-EDU bodies. If you find the 2-pin 28.8 V output on the back, measure it under load before using it. The plan below powers the add-ons from their **own battery** and connects to the robot by **Ethernet only**.

- **Accessory battery:** a 24 V-class pack (6S Li-ion at 22.2 V or 8S LiFePO4 at 25.6 V), about **150–250 Wh**, roughly 1–1.5 kg. A 24 V pack runs a future PiPER arm directly.
- **Main fuse plus a latching e-stop switch** right after the battery.
- **Buck converter to 19 V, ≥3 A**, feeding the Jetson's barrel jack (5.5 × 2.5 mm). Its own fuse.
- **Buck converter to 12 V, ≥5 A**, feeding the Gigabit switch, the add-on LiDAR, the SO-101 arm's servo bus (check your kit's voltage) and an optional travel router. Fuse each branch.
- **Ground** at a single point. Use isolated converters if you ever tap the robot's 28.8 V.

**Power budget (est.):**

| Load | Watts |
|---|---|
| Jetson | 25 |
| L2 LiDAR | ~10 |
| Switch | 5 |
| SO-101 | 10–30 |
| Router | 8 |
| **Total** | **≈ 60–80 W** |

A 200 Wh pack runs that for about 2.5 h, so it outlasts the dog.

**Main battery:** swap in the **15 Ah BT2-06 long-endurance pack** (432 Wh). It has the same size, weight and 33.6 V charge voltage, and is very likely X-compatible. Unitree rates it at 2–4 h against 1–2 h for the standard pack. Get the **9 A fast charger** too; the X's 3.5 A charger takes about 4.5 h (est.). Dealers charge about $1,200 for the battery plus shipping.

## Step 4: Network on the robot

- **Gigabit switch:** a small 12 V 5-port unmanaged switch (~$30–60). Connect the X rear port, the Jetson, the add-on LiDAR and a spare port for the arm or laptop.
- **LiDAR address:** move the add-on LiDAR onto 192.168.123.x. The L2 defaults to 192.168.1.62; the Hesai XT and VLP-16 default to 192.168.1.201.
- **Workstation link:** a travel router on its own subnet with NAT, or the Jetson's Wi-Fi as a client. Do not bridge 192.168.123.x to your home or office network: the robot's DDS has no authentication (CVE-2026-27509), and BLE exploits exist (UniPwn).
- **Hardening:** turn off Bluetooth on the robot once it's set up, pull or disable the 4G SIM, and give the Jetson a firewall and key-only SSH.

## Step 5: LiDAR and arm

- **LiDAR:** the **Unitree L2** ($419, 230 g, 360°×96° field of view, sees from 0.05 m, built-in IMU, Point-LIO ROS 2 package). Mount it high at the rear so the arm doesn't block it. Your X already has an L1 or L2 in the head, so start with that for mapping. Add a second, top-mounted L2 when you need full coverage.
  - Hesai XT16 only if you need range beyond 30 m outdoors.
  - Skip the VLP-16. It's discontinued, 830 g, blind within 0.9 m, has no IMU, and its 9–18 V input needs its interface box.
- **Arm, phase 1:** the **SO-101** ($440–530, under 1 kg). It plugs into the Jetson over USB and is natively supported by LeRobot. Record demos with leader-follower or a Quest 3 and train SmolVLA or ACT on the 5070 Ti.
- **Arm, phase 2:** the **AgileX PiPER** (about $2–3.5k arm-only, 1.5 kg payload, 24 V CAN through a USB-CAN adapter), only if your weighed payload leaves room. It weighs 4.2 kg. Log leg-motor temperatures from the first walk; a 3.4 kg arm overheated a Go2's leg motors in 5–10 minutes in Stanford's UMI on Legs work.
  - Skip the Unitree D1. Its control loop runs at about 10 Hz, it overheated in Caltech's tests, support is thin, and it's sold only for EDU/Ent.

**Weight budget (est.):**

| Item | Weight |
|---|---|
| Jetson with case | ~0.3 kg |
| Switch, converters, wiring | ~0.4 kg |
| Accessory battery | 1–1.5 kg |
| Plate | ~0.5 kg |
| L2 | 0.23 kg |
| SO-101 | ~0.8 kg |
| **Total** | **≈ 3.2–3.7 kg** |

That is comfortable. With the PiPER instead of the SO-101 it's about 6.6–7.1 kg, close to the 8 kg rating.

## Step 6: Mounting

- The Go2's back has M4 mounting holes, and the rear Ethernet port sits under most plates, so use a **flat-edge RJ45 cable**.
- Start from open CAD:
  - **IADC-GO2-EDU** on GitHub (SolidWorks, STL and 3MF files; decks for compute, LiDAR and battery).
  - Printables' **Go2 T-Track base**, which needs no drilling, and the **Jetson Thor backpack**.
  - Futurology's $99.99 rail kit.
  - These are made for the EDU shell, which the X shares. Check them against your dog before printing.
- Keep heavy items, the battery especially, low and between the hips. Put the arm base near the front of the deck and the LiDAR at the rear.
- Lock every connector, add strain relief, and use a ventilated Jetson case. The dev kit's fan needs airflow.

## Shopping list for what you don't have yet

| Item | Est. price |
|---|---|
| 1 TB NVMe SSD for the Jetson | $80–120 |
| 24 V accessory battery, ~200 Wh, plus charger | $150–350 |
| 19 V and 12 V buck converters, fuse block, e-stop, wiring | $80–150 |
| 12 V Gigabit 5-port switch | $30–60 |
| Unitree L2 LiDAR | $419 |
| SO-101 arm, assembled (leader + follower kit if teleoperating) | $440–530 |
| Mount plate (3D printed or rail kit) | $0–100 |
| 15 Ah long-endurance battery + 9 A charger (recommended) | ~$1,350–1,600 |
| **Total without the battery upgrade** | **≈ $1.2–1.7k** |
| **Total with the battery upgrade** | **≈ $2.6–3.3k** |
| Later: AgileX PiPER + USB-CAN | ~$2.2–4k |

## Risks and unknowns

- **Developer access on the X** is unverified until you run Step 1. If the result is B, you are limited to high-level control. That is still enough for navigation, a LiDAR and a separately controlled arm (stop, then manipulate).
- **Warranty:** mounting and wiring accessories counts as a modification and can void the 12-month warranty. Keep the add-ons bolt-on and reversible.
- **Firmware:** a robot left online can auto-update and break your drivers.
- **No published X build** with a Jetson, LiDAR and arm exists. Plan on bench-testing everything (power, network, arm) off the dog first.
