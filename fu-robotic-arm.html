**For a Go2 EDU that will also carry a LiDAR and extra compute, and that you want to drive with learned policies from your RTX 5070 Ti workstation, the arm to buy is the AgileX PiPER (4.2 kg, 1.5 kg payload, 626 mm reach, 24 V, CAN, roughly $2k–$3.5k arm-only).** Before it arrives, prove out the whole pipeline on a $440–$530 SO-101. Almost nothing on RobotShop's arm catalogue fits the job. The Lite 6 (~8 kg) and Kinova Gen3 Lite (5.4 kg) eat the Go2's entire ~8 kg rated payload. The Dobot units are desktop arms. The myCobot and mechArm reach only 270–280 mm. Unitree's own D1 is the only arm sold for the Go2 and the lowest-integration-risk choice at 2.37 kg, 60 W and Ethernet, about $4.5k–$5.5k. But it lifts only 500 g, a Caltech lab hit a ~10 Hz control-cycle limit and overheating servos with it, and its supply and support are uncertain. Every arm is mounted the same way. A plate slides into the expansion dock's rail and bolts to M3 hard points. Power comes from the dock's second XT30 battery port through a 24 V converter, never from the 12 V accessory outputs. Data runs over Ethernet or USB-CAN to the onboard Jetson. The physics are unforgiving: Stanford's UMI on Legs team found a 3.4 kg arm could overheat Go2 leg motors within 5–10 minutes, so any arm over about 2.5 kg makes heat and runtime real constraints. On the software side, the stock Unitree gait plus a ROS 2/MoveIt arm works in weeks. VR teleop plus imitation learning, with the VLA running on your 5070 Ti, is a one-to-three-month project that reaches 40–70% success on narrow tasks. True whole-body control is research-grade work. A complete Go2 EDU Plus + Mid-360 LiDAR + D435i depth camera + arm costs **about $21k–$24k**, roughly a fifth of a Spot Arm, with about a twentieth of its lifting capacity.

## Only arms under about 4.5 kg belong on a 15 kg dog

The Go2 EDU weighs about 15 kg with its battery. Unitree rates it for **about 8 kg of payload, with a maximum of about 12 kg**, and runs it on a 28–33.6 V pack ([Unitree Go2](https://www.unitree.com/go2)). Some retailers list a 10 kg maximum, so the ceiling varies by source ([RobotShop comparison](https://community.robotshop.com/blog/show/comprehensive-unitree-go2-robot-comparison)). The 8 kg figure is misleading for arms. An arm is cantilevered forward of the body's center of mass, it moves, and it pushes back on the body when it grabs something, so it stresses the robot far more than the same mass strapped flat on the back. It also has to share the budget with your LiDAR, any extra compute, the mounting plate and the DC-DC converter. In practice, **≤2.5 kg is the comfortable class and 4–4.5 kg is the aggressive ceiling.** Stanford's UMI on Legs team, who built the best-documented Go2 arm system, rejected the 5 kg Unitree Z1 as "too heavy" for the Go2 and chose the 3.4 kg ARX5 instead ([UMI hardware notes](https://raw.githubusercontent.com/real-stanford/umi-on-legs/main/real-wbc/docs/hardware_design_choices.md)).

Against that budget, RobotShop's US arm catalogue is mostly a list of things that don't fit. The UFACTORY Lite 6 ($3,629.84 bare) weighs about 8 kg for a 600 g payload. The Kinova Gen3 Lite ($14,439.28) weighs 5.4 kg for 500 g. The Dobot Magician and MG400 are desktop arms. The AgileX PiPER and Trossen WidowX AI, which are the two strongest third-party candidates, don't appear in RobotShop's US catalogue view at all ([RobotShop robotic arms](https://www.robotshop.com/collections/robotic-arms); [Lite 6 docs](https://docs.lite6.ufactory.cc/9.technical_specifications.html); [Clearpath Gen3 Lite](https://docs.clearpathrobotics.com/docs/robots/accessories/manipulators/kinova_gen3_lite)). The realistic shortlist is below.

| Arm | Mass | Payload | Reach | Power | Interface | US price (Nov 2026) | Go2 verdict |
|---|---|---|---|---|---|---|---|
| **Unitree D1 / D1-T** | 2.37 kg (see conflict below) | 0.5 kg | 550 mm (670 mm w/ gripper) | 24 V, 2.5 A (5 A peak), 60 W | RJ45 Ethernet (Unitree DDS) | $4,459 RobotShop (special order); $4,655 RoboStore; $5,400 Stemfinity | Purpose-built and bundled; weak payload, ~10 Hz control cycle, support risk |
| **AgileX PiPER** | 4.2 kg (one reseller: 4.5 kg) | 1.5 kg | 626 mm | 24 V, ≤40 W avg, ≤120 W max | CAN (USB-CAN) | ~$2k–$3.5k arm-only; $7,428 w/ gripper via RobotShop USA storefront | Best capability per dollar; heavy; Go2 VLA precedent |
| **Trossen WidowX AI** | 4 kg | 1.5 kg | 700–769 mm | 24 V, 15 A peak | Ethernet | $4,545.95 base | Strong ROS 2/LeRobot support; high peak current, heavy |
| **SO-ARM101 (Hiwonder/Seeed)** | ~0.8 kg | ~0.5 kg (varies with pose) | ~500 mm | 12 V, ≥3 A | USB serial (Feetech bus) | $439.99–$529.99 assembled (RobotShop) | Fits easily; 3D-printed hobby servos; LeRobot-native |
| **Unitree Z1 Air/Pro** | 4.3–4.5 kg | 2 to ≥3 kg | 740 mm | 24 V, >20 A | Ethernet | ~$7.2k–$16k | Sized for AlienGo/B1; excluded |
| **myCobot 280 / mechArm 270** | ~0.86–0.9 kg | 0.25 kg | 270–280 mm | n/a | USB serial | $599–$849 | Fits, but can't reach the ground from the dog's back |

Sources for the table: [Unitree D1-T](https://www.unitree.com/D1-T), [RobotShop D1](https://www.robotshop.com/products/unitree-go2-servo-robotic-arm-d1), [RoboStore D1](https://robostore.com/products/unitree-go2-ai-robot-dog-servo-arm), [Stemfinity D1](https://stemfinity.com/products/d1-servo-arm), [AgileX PiPER](https://global.agilex.ai/products/piper), [Trossen docs](https://docs.trossenrobotics.com/trossen_arm/main/specifications/wxai.html), [Trossen WidowX AI](https://www.trossenrobotics.com/widowx-ai), [SO-101 specs](https://www.roboticscenter.ai/hardware/so-101/specs), [Unitree Z1](https://www.unitree.com/z1), [QVIRO myCobot 280-Pi](https://qviro.com/product/elephant-robotics/mycobot-280-pi/specifications).

### The D1: officially supported, practically shaky

The D1 is the only arm Unitree makes for the Go2. Dealers sell it in Go2 EDU Plus bundles with a Mid-360 or XT16 LiDAR, so mounting it alongside a LiDAR is a solved configuration ([iRed Mid-360 + D1](https://store.ired.co.uk/products/unitree-go2-edu-plus-mid-360-d1-arm)). MYBOTSHOP's ROS 2 stack drives it through a `d1_controller` with a standard `FollowJointTrajectory` action ([MYBOTSHOP Go2 docs](https://www.docs.mybotshop.de/go2.html)). The case against it comes from field experience. Caltech's AMBER lab found the arm shook under joystick control and stopped following commands after a few minutes, with servos running "burning hot." The student's 100 Hz command loop failed because **"10 Hz is the control cycle of the arm"** ([Caltech SURF 2025 report](https://eloisezeng.people.caltech.edu/documents/32338/2025_SURF_Final_Report.pdf)). A 10 Hz arm can play back a MoveIt trajectory, but it can't run the reactive learned policies that are the reason to own a 5070 Ti.

**Conflict resolved: is the D1 still sold?** The same Caltech report says Unitree support told the lab that the arm R&D team had been "poached" and that Unitree **no longer sells the D1**, as of roughly March 2025 ([Caltech SURF report](https://eloisezeng.people.caltech.edu/documents/32338/2025_SURF_Final_Report.pdf)). In November 2026, though, RobotShop lists it at $4,459 as a non-returnable "special order" with no lead time ([RobotShop](https://www.robotshop.com/products/unitree-go2-servo-robotic-arm-d1)). RoboStore and Stemfinity also list it, AIFitLab shows the D1-T as backordered, and Unitree's own site sells D1-T dual-arm ($8,500) and quad-arm ($16,000) teleoperation kits ([Unitree D1-T](https://www.unitree.com/D1-T); [AIFitLab D1-T](https://aifitlab.com/products/unitree-d1-t-robot-arm)). The most consistent reading is that Unitree dropped or paused the original standalone D1 around 2025 and relaunched the hardware as the D1-T, aimed at teleop kits. US listings are probably drawn from leftover or special-order supply. Both sources are accurate for their dates. For you, this means the D1 can still be bought but should be treated as **thinly supported**: get a written lead time before ordering, because special orders can't be returned.

**Conflict resolved: what does the D1 weigh?** The 2.37 kg figure appears consistently on Unitree's D1-T page and at several retailers ([Elektor](https://www.elektor.com/products/unitree-go2-d1-servo-robotic-arm); [Stemfinity](https://stemfinity.com/products/d1-servo-arm)). The D1Training project cites 3.152 kg as Unitree's published figure for the D1-550, and notes that the URDF it ships lists only 0.72 kg ([D1Training](https://github.com/Lukasterixx/D1Training)). The 0.72 kg number is a modeling error: a whole six-axis aluminum arm with a gripper can't weigh that little. The difference between 2.37 and 3.152 kg most likely comes from what's counted (gripper, base flange, cabling) or which variant is measured. That's an inference, since no source breaks it down. **Budget 3.2 kg and weigh the arm when it arrives.** If you simulate the arm, overwrite the URDF masses with your measured values. A 4× mass error will wreck any sim-to-real controller.

### The PiPER: more arm for less money, at a weight cost

The PiPER carries three times the D1's payload, has ±0.1 mm repeatability, and uses CAN, so it can be driven at the rates learned policies need ([AgileX PiPER](https://global.agilex.ai/products/piper)). It also has the most relevant 2026 software precedent. Minelli et al. deployed a VLA on a Go2 + PiPER for closed-loop loco-manipulation ([arXiv 2610.32271](https://arxiv.org/abs/2610.32271)), and a community SDK drives a Go2W and a PiPER through a single API ([grasp-lyrl SDK mirror](https://github.xiaohuzi123231346.workers.dev/grasp-lyrl/unitree_go2w_agent_sdk)). Its cost is mass. At 4.2 kg it is about 1.2× the ARX5 that already overheated UMI's Go2.

**Conflict resolved: what does a PiPER cost?** Quotes run from $1,999 (AIFitLab, arm-only, backordered) to $8,091 (RobotShop Canada, with gripper) ([AIFitLab](https://aifitlab.com/products/agilex-piper-robotic-arm); [RobotShop CA](https://ca.robotshop.com/products/roboworks-agilex-robotics-piper-6dof-robotic-arm-with-gripper)). The spread has two causes. The first is the gripper. Arm-only listings cluster at **€2,040–€2,400 in Europe, £1,480 in the UK and $3,500 at Robotics Center in the US** ([Generation Robots](https://www.generationrobots.com/en/404258-6-axis-robotic-arm-piper.html); [RoboSavvy](https://robosavvy.co.uk/agilex-piper-arm.html); [Robotics Center](https://www.roboticscenter.ai/hardware/agilex-piper)). The second is RobotShop's RoboWorks-sourced gripper bundles, which carry a large markup: €4,330.59 in the EU, but $7,428 on the US storefront ([RobotShop EU](https://eu.robotshop.com/products/roboworks-piper-with-gripper); [reach.dog / RobotShop USA](https://reach.dog/shop/robotshop-usa/products/roboworks-piper-with-gripper)). A US buyer should plan on **$3.5k–$4.5k for an arm with gripper from a specialist seller**. The upper end of that range is my estimate of the gripper add-on, not a quoted price. The $7k+ bundles are not worth it.

## A dock rail, a 24 V converter and one cable do the integration

Unitree publishes no dimensioned hole pattern for the Go2's back. The proven method comes from UMI on Legs. The arm bolts to a board with 10 mm M3 screws. The board has a sponge-taped depression that sits on the Go2's head "bump," slides into the **expansion dock's top rail**, and is screwed to the body with M3 screws. The stock belt that holds the dock is removed, and its anchor holes become usable hard points ([UMI-on-Legs assembly](https://raw.githubusercontent.com/real-stanford/umi-on-legs/main/real-wbc/docs/assembly.md)). The Onshape CAD for that Go2–ARX5 mount is public and is the right starting point for a PiPER or D1 adapter plate ([Go2-ARX5 mount CAD](https://cad.onshape.com/documents/871e34dff99a08f156ada60c/w/69c70cd7dba620ca310bb3c1/e/4207c73e769cc874ee5dbfb5)). MYBOTSHOP staff posted a link to Unitree's simplified Go2 + dock model, which can be used to check the rail geometry ([MYBOTSHOP forum](https://forum.mybotshop.de/t/unitree-go2-dimensions-of-expansion-dock-orin-nx-16gb-top-rail/1819)). Print in PLA only for fit checks. A cantilevered arm hitting the ground in a fall needs a CF-nylon or machined aluminum plate. Mind the yaw orientation too: the ARX5 base gets about 180° of travel one way and 120° the other, so whichever way the base faces sets the workspace. For an external LiDAR alongside the arm, the Unitree-bundle pattern puts the arm at one end and the LiDAR (for example, a Mid-360 on the back, as Southampton runs it) at the other ([Soton Go2 wiki](https://robots.ecs.soton.ac.uk/go2/external_lidar)). Configure a box crop in the point-cloud pipeline so the arm doesn't show up as an obstacle.

Power is where the conflicting figures matter. The Go2 battery is 8S Li-ion: **28.8 V nominal, 33.6 V full**, 432 Wh in the 15,000 mAh pack ([RobotsAsia battery](https://www.robotsasia.com/Unitree-Go2-Long-Range-15000Mah-Fast-Charge-28V-Battery-GO2-LBATTERY.htm)). The dock's electrical table, as reproduced by MYBOTSHOP, lists an XT30 power interface accepting **16–45 V (60 V peak) with two ports, one for the dock and one "for external robotic arm."** It also lists a 12 V/3 A user output, a 5 V/3 A user output, and an M8 aviation connector carrying Gigabit Ethernet plus **12 V/2 A**, labeled as the "radar" (LiDAR) port ([MYBOTSHOP Go2 manual](https://www.docs.mybotshop.de/downloads/GO2_User_Manual.pdf)).

**Conflict resolved: 12 V/2 A vs 12 V/3 A.** Both figures are correct, for different connectors. The 12 V/3 A rail is the general accessory output. The 12 V/2 A rail is part of the M8 LiDAR connector. The Reddit user who warned that the dock's accessory power is "12 V 2 A / 5 V" was describing the smaller of the two ([r/unitree mirror](https://axebps-redlib.hf.space/r/unitree/comments/1inyn2p/help_d1t_servo_arm_from_unitree)). Neither rail can run a 24 V arm: 36 W at most, against the D1's 60 W and the PiPER's 120 W peaks. That user ended up powering the D1-T from the battery-fed connector instead. UMI did the same with a full chain: **XT30-F from the dock's second BAT port → DC-DC converter to 24 V → inline switch → XT30-M → arm**. The ARX5 needs less than 30 V, and a full pack exceeds 32 V ([UMI-on-Legs assembly](https://raw.githubusercontent.com/real-stanford/umi-on-legs/main/real-wbc/docs/assembly.md)). OpenMind's onboard-compute backpack hit the same issue when it wired a 9–28 V Jetson AGX Thor directly to a 28–33.6 V Go2 XT30 port ([OpenMind brainpack issue](https://github.com/OpenMind/brainpack/issues/2)). That matters for your extra compute too: **anything you add needs regulation off the battery.** My sizing rule, not a sourced spec: use a **buck-boost** converter (22–34 V in, 24 V out) rated at least 1.5× the arm's peak, about 200 W for either the D1 or the PiPER, plus a fuse and an e-stop switch. Use buck-boost rather than plain buck because an 8S pack sagging under leg load can drop near 24 V, where a buck converter browns out. No source gives the current limit of the arm XT30 port, so bench-test the arm on a lab supply first, as UMI did.

Data is simpler. The Go2's internal network is 192.168.123.0/24. The MCU sits at .161, the onboard computer at .18 and the router at .100, so give an Ethernet arm such as the D1 a static address well away from those, in the .200s ([MYBOTSHOP Go2 docs](https://www.docs.mybotshop.de/go2.html)). The D1 speaks Unitree DDS. Caltech had to name the network interface explicitly when initializing the DDS ChannelFactory and correct the feedback topic to `rt/arm_Feedback` ([Caltech SURF report](https://eloisezeng.people.caltech.edu/documents/32338/2025_SURF_Final_Report.pdf)). CAN arms such as the PiPER and ARX5 connect through a USB-CAN adapter on the Jetson's USB ([UMI-on-Legs assembly](https://raw.githubusercontent.com/real-stanford/umi-on-legs/main/real-wbc/docs/assembly.md)). Either way, keep the arm's servo loop on the Jetson. Wi-Fi is for commands, not control.

## Every kilogram on the back costs leg heat and runtime

Overheating is the best-documented failure. With the 3.4 kg ARX5 mounted and an early whole-body controller that loaded the front legs inefficiently, **Go2 motors overheated every 5–10 minutes**, tripped an e-stop and forced a restart. The team resorted to ice packs, and only later controllers could stand for 30+ minutes. A Go2 controller board also failed during the project ([UMI hardware notes](https://raw.githubusercontent.com/real-stanford/umi-on-legs/main/real-wbc/docs/hardware_design_choices.md)). The front-leg pattern follows from the geometry. A forward-mounted arm shifts the center of mass forward, and the front knees and hips carry the extra torque, against a 45 N·m peak joint torque ([MYBOTSHOP manual](https://www.docs.mybotshop.de/downloads/GO2_User_Manual.pdf)). A heavier PiPER will be worse, not better.

Balance looks less dramatic in simulation than the heat problem suggests. In D1Training's Isaac Lab tests, the stock Go2 walking policy, which never saw an arm in training, kept **95% of a commanded 1.0 m/s with a D1 welded on (96% bare), and maximum tilt rose only from 5.9° to 7.3°** ([D1Training](https://github.com/Lukasterixx/D1Training)). That run used the erroneous 0.72 kg URDF mass, so it understates the real effect. The other caveat is dynamics. No source shows Unitree's stock controller compensating for arm reaction forces, and Unitree exposes no payload or CoM parameter in the API. The only related advice is Weston Robot's guide, which says to update the payload setting in the app's Device → Data screen when components are added ([Weston Robot](https://docs.westonrobot.com/guides/unitree/go2_diag_guide/)). The robot will carry a folded arm reasonably well. It won't anticipate the arm swinging out or pulling on a drawer.

Runtime has no measured figure with an arm attached, so this is my estimate. The 432 Wh pack, rated for 2–4 h, implies an average draw of roughly 110–215 W. Adding a 40–60 W average arm draw plus extra compute raises that by 20–50% and cuts runtime by roughly **15–35%**, before counting the extra leg torque from carrying the load. Plan on **1.5–2.5 h** of mixed use with a PiPER and LiDAR, and less in hot conditions. That's consistent with the University of Melbourne's 1–2 h field figure for a loaded Go2 ([UniMelb NExT Lab](https://ms-kb.msd.unimelb.edu.au/next-lab/robotics/robotic-dog/expansion-equipment-attachments)). A separate 6S/24 V pack for the arm would isolate current spikes and avoid the over-voltage issue, but it adds 0.5–1.5 kg to a budget that's already tight.

Falls need explicit protection. MYBOTSHOP warns that built-in athletic actions such as "wallow" flip the robot onto its back and can destroy a mounted arm. The arm must also be homed before power-down or it drops ([MYBOTSHOP manual](https://www.docs.mybotshop.de/downloads/GO2_User_Manual.pdf)). Disable those actions in the app, walk with the arm tucked and centered, keep a compliant layer at the mount (UMI used three layers of sponge tape), and run a watchdog that tucks or de-energizes the arm when the IMU reports a fall.

## Software splits into three tiers, and the VLA belongs on your 5070 Ti

**Tier 1 is decoupled control, and it's achievable in weeks.** Unitree's locomotion controller takes velocity and posture commands through unitree_sdk2 or ROS 2, and the arm runs as a separate MoveIt 2 device. MYBOTSHOP documents this stack, with high-level behaviors exposed as ROS 2 services and the D1 on `FollowJointTrajectory`. Their docs also note that the robot side runs ROS 2 Foxy, simulation uses Humble, and their driver source sits in a private repo ([MYBOTSHOP Go2 docs](https://www.docs.mybotshop.de/go2.html)). The working pattern is walk, stop, stand, plan and execute an arm motion. The dog doesn't know the arm exists, so reaching while walking and pushing or pulling anything heavy is where this tier breaks down. A Gazebo + MoveIt 2 package for the D1 exists, with assumed link inertias ([D1 Gazebo sim](https://github.com/Subhanjal-Pant/unitree-d1-gazebo-simulation)).

**Tier 2 is VR teleop plus imitation learning, and it takes one to three months.** The reference recipe is AnchorVLA's real-robot setup, which uses exactly a **Go2 EDU + SO-101**. A Meta Quest 3's right joystick drives base velocity, the controller's pose sets the 6-DoF end-effector target, and the trigger works the gripper. Wrist and head cameras record at 15 Hz, with **50 demonstrations per task** ([AnchorVLA](https://arxiv.org/html/2604.01567v1); [code](https://github.com/jason-lim26/AnchorVLA)). Logging to LeRobot format lets you train ACT, SmolVLA or π0.5 on the same data. Be realistic about results: AnchorVLA reached **40% average real-world success, against 15% for SmolVLA**, on opening drawers and lifting bags. UMI on Legs avoids robot teleop entirely by collecting data with a handheld gripper and reported >70% success ([arXiv 2407.10353](https://arxiv.org/abs/2407.10353)).

**Tier 3 is learned whole-body control, which is research-grade.** It means turning off sport mode and running your own locomotion policy in low-level mode. That gives up Unitree's balance safeguards; MYBOTSHOP says it's aimed at people already fluent in gait planning ([MYBOTSHOP Go2 docs](https://www.docs.mybotshop.de/go2.html)). UMI on Legs is the only Go2-native arm WBC with complete open sim-training and real-deployment code. Its authors found that policies trained without latency shook on hardware, and they had to re-calibrate URDF inertias ([real-stanford/umi-on-legs](https://github.com/real-stanford/umi-on-legs)). RoboDuet (Go1 + ARX5) and VBC (apparently B1 + Z1) have code for other robots, and FT-WBC (Go2 + Airbot Play, 2026) has no code link ([RoboDuet](https://github.com/locomanip-duet/RoboDuet); [VBC](https://github.com/Ericonaldo/visual_wholebody); [FT-WBC](https://arxiv.org/pdf/2606.24466)). New work should start in Isaac Lab rather than the deprecated Isaac Gym, which older codebases use. **Arm choice decides how much of this you can reuse.** ARX5, PiPER and SO-101 all have more Go2 research code than the D1, even though the D1 is Unitree's own arm.

The compute question has a clear answer from measured latencies. On a Jetson AGX Orin, which is stronger than the Go2's Orin NX, **π0.5 takes 949 ms per call in eager mode and 394 ms with torch.compile**. On a Jetson AGX Thor it takes 132 ms compiled, with about 12 GB peak memory. SmolVLA on Thor runs at 50 ms compiled ([NVIDIA forum benchmarks](https://forums.developer.nvidia.com/t/vla-models-0-5-gr00t-smolvla-measured-on-jetson-agx-thor-agx-orin-and-orin-nano-latency-energy-memory-per-policy-call/387191)), and on AGX Orin it measured 67 ms with two cameras ([ApxInf PR](https://github.com/infinigence/ApxInf/pull/110)). No Orin NX numbers are published. Extrapolating from these, π0.5 or GR00T onboard the Go2 would run around 1 Hz, which is useless for closed-loop control. The right split is to run the VLA on the RTX 5070 Ti over a dedicated 5/6 GHz access point, stream action chunks of 0.5–1 s, and have the Jetson interpolate and execute them while keeping the servo loops local. π0.5's ~12 GB footprint should fit in 16 GB of VRAM for inference. Full fine-tuning of π0-class models probably won't fit, so plan on LoRA or rented GPUs for training. That's an inference, untested on a 5070 Ti specifically. SmolVLA or ACT on the Orin NX is the untethered fallback at a few Hz. An LLM agent such as Claude belongs above all of this as a task planner calling skills ("navigate to," "pick X"), never inside the control loop. Helpful DoggyBot's VLM-planner-over-RL-controller design follows this pattern ([arXiv 2410.00231](https://arxiv.org/abs/2410.00231)). Extra onboard compute such as a Thor backpack buys untethered π0.5 at about 7 Hz. It costs payload and needs its own regulated power, so I'd defer it until the offboard pipeline works.

## Light fetching is realistic; Spot Arm's door-and-valve work is not

The builds people have actually done set realistic expectations. UMI on Legs (Go2 + ARX5) is the high-water mark: >70% success across prehensile, non-prehensile and dynamic tasks, including a policy trained on a fixed-base arm that ran on the quadruped without retraining ([arXiv 2407.10353](https://arxiv.org/abs/2407.10353)). Helpful DoggyBot deliberately avoided a back-mounted arm, arguing that it costs agility, and used a 1-DOF mouth gripper. It fetched toys in unseen homes with **60% success** ([arXiv 2410.00231](https://arxiv.org/abs/2410.00231)). The Go2 + PiPER VLA study found that broader demonstration coverage cut held-out end-effector error by 30% ([arXiv 2610.32271](https://arxiv.org/abs/2610.32271)). Many GitHub Go2-plus-arm repos stop at simulation: Go2 + Z1 warehouse logistics, Go2 + PiPER ground pickup in Isaac Lab, and D1Training itself ([go2-piper-mobile-manipulation](https://github.com/HWB-hub/go2-piper-mobile-manipulation); [D1Training](https://github.com/Lukasterixx/D1Training)). Commercial packages like Toborlife's $15,990 Go2 + AIRBOT + Quest/Pico teleop kit are sold for data collection and list no validated tasks ([Toborlife](https://toborlife.ai/go2-edu-manipulation-arm/)). Also watch firmware: Go2 firmware 1.11.1 reportedly broke the SDK for some users ([Humanoid Applications](https://humanoidapplications.com/fix/unitree-go2/)).

The realistic task envelope follows from payload. That means fetching items under 0.5 kg with a D1 or about 1 kg with a PiPER, pressing buttons and switches, opening light drawers and cabinets, pushing light objects, and collecting teleop data, all at 40–70% success outside curated demos. Spring-loaded doors, stiff valves and heavy sample bags are out of reach. Spot Arm, by contrast, offers about 1 m reach, **11 kg lift and 25 kg drag**, a 4K gripper camera, and productized semi-autonomous door, valve and lever behaviors with whole-body balancing ([Boston Dynamics Spot Arm](https://bostondynamics.com/products/spot/arm/)). Spot Arm is quote-only. Third-party estimates for Spot + Arm run about **$100k–$140k** ([Standard Bots](https://standardbots.com/articles/spot-robot); [Grabarobot](https://grabarobot.com/blog/boston-dynamics-spot-price-guide-2026/)). The Go2 build costs about a fifth as much, has 1/22 (D1) to 1/7 (PiPER) of the lift, and requires you to build the behaviors yourself. Its advantage is an open SDK that lets you run your own policies. Unitree's B2 + Z1 tier (about $85.8k + $16k) ([Robotics Center](https://www.roboticscenter.ai/blog/robot-dog-price-guide); [Unitree shop](https://shop.unitree.com/collections/education-industry)) costs about as much as Spot Arm, so it's only worth it if openness matters more than Spot's mature manipulation stack.

## Recommended arm and build path

**Buy the AgileX PiPER with gripper from a specialist seller (~$3.5k–$4.5k). Do not buy the D1, and skip RobotShop's $7k+ PiPER bundles.** The reasoning is that your goal, driving the arm with learned policies from a 5070 Ti, needs an arm that accepts high-rate commands and has Go2 research code behind it. The PiPER meets both. The D1's 10 Hz cycle, reported defects and uncertain support fail the first test. The ARX5 that UMI used is the only better-documented choice, but the only current US listing in the ARX line found here was the X5 at $8,333 on backorder ([Robotics Center ARX X5](https://www.roboticscenter.ai/store/product/arx-arm-x5)). The PiPER's cost is mass, so the build path below is designed around heat and payload.

**Step 1, weeks 1–4: build the pipeline with a cheap arm.** Buy the Go2 EDU Plus + Mid-360 bundle and a $480 SO-101. Mount the SO-101 on a printed dock-rail plate adapted from the UMI CAD, powered from the dock's 12 V/3 A rail at light duty. Build the AnchorVLA-style Quest 3 teleop node, record LeRobot datasets, and serve ACT/SmolVLA policies from the 5070 Ti over a dedicated access point. Everything you learn here carries over, and it matches published Go2 EDU research hardware.

**Step 2, month 2: install the PiPER properly.** Machine or CF-nylon-print the adapter plate, mounted as far back toward the CoM as reach allows. Wire the dock's arm XT30 → fuse → ~200 W buck-boost to 24 V → e-stop → arm, and bench-test on a lab supply first. Connect CAN through USB-CAN to the Orin NX. Weigh everything, enter it in the app's payload setting, disable flips, and log leg motor temperatures from the first walk.

**Step 3, month 3 and later: scale the learning stack.** Use stop-then-manipulate with Unitree's gait as the default, and fine-tune π0.5 on the 5070 Ti with LoRA. Mount the LiDAR at the opposite end from the arm, with self-filtering, and add Nav2 for "go to" skills. Put an LLM planner on top. Add onboard compute (an AGX Thor class backpack with its own regulator) only if untethered VLA operation becomes a requirement. Attempt UMI-style whole-body control only after re-weighing the payload budget, because the PiPER plus LiDAR plus extra compute will push past 5 kg and into the overheating regime UMI documented.

## Conclusion

The question "which arm fits a Go2" is decided less by RobotShop's spec sheets than by three constraints the catalogue doesn't show: leg-motor heat, the arm's control rate, and how much published Go2 code exists for it. Those constraints rank the options differently from price or payload. Unitree's own arm loses on control rate and support. A $500 hobby arm wins as a learning platform because the Go2 VLA research was done on one. A mid-weight CAN arm is the most capable choice the dog can carry for longer than a few minutes. The heaviest open question is thermal, so treat the PiPER's 4.2 kg as a budget to manage and not a spec you can ignore.

The second takeaway is that the capability gap to Spot Arm is mostly a software and payload gap, not a hardware-quality one, and the software side is closing fastest. Measured Thor latencies, AnchorVLA's 50-demo recipe and offboard inference on a consumer GPU make learned manipulation on a $22k dog feasible in 2026, at 40–70% success on narrow tasks. That's good enough for research and demos, not yet for unattended work. What would change the recommendation is a measured runtime and temperature curve for a PiPER-equipped Go2, which nobody has published. Your build could be the first to produce one.
