</style><div class="wrap"><a class="back" href="research.html">← The Brain research</a><article id="doc"></article></div><script type="text/markdown" id="md"># Buy the platform, rethink the GPU

The quoted Micro Center build is a sound AI orchestration platform at a fair price, but it is not well balanced as quoted. Three parts are mismatched to the workload, and three integration gaps must be closed before the November 19 price guarantee expires. The $5,999.99 EPYC 9175F + TURIND8X-2T + 128 GB bundle is worth locking in: the CPU and board alone cost about $4.1–4.4K separately, and DRAM is in a historic shortage, so the bundled memory comes in below what it would cost to replace. The weak spots are elsewhere. The 16-core 9175F is the worst cores-per-dollar choice for agent fan-out. The four DIMMs fill only 4 of the board's 8 memory channels, giving about 29% of the CPU's rated bandwidth, and 128 GB is the floor for 10–20 parallel agents, not a comfortable amount. The $1,699.99 ProArt RTX 5070 Ti is the most overpriced item on the quote: about $106 per GB of VRAM for a card that sells for $1,230–1,500 elsewhere. The gaps are a case (still unchosen), the PSU's EPS cable count (the board specifies three 8-pin CPU inputs and the PSU ships two cables), and household power. The board itself has 8 DIMM slots, not 12. That removes the "12-channel EPYC" bandwidth advantage and puts it level with Threadripper PRO WRX90, which changes how the ~$27K alternative should be judged. My recommendation: buy the bundle, try to get the CPU swapped to a 32-core EPYC 9355P, don't pay $1,699.99 for the GPU, add an SSI-EEB case, confirm the power connectors, and spend future money on memory channels and VRAM rather than on a new platform.

## Agent fan-out runs out of RAM before cores or VRAM

The workload described is many agent sessions and LLM calls, MCP tool servers, containers, vector DBs, and a mix of cloud APIs with local inference. That mix hits limits in a predictable order, and the first one is **system RAM capacity**. Agent CLIs are Node processes that spawn tool subprocesses, hooks and per-session MCP servers. In one documented Claude Code case, **six parallel subagents produced about 70 node processes using 43.5 GB of RSS** and set off the OOM killer on a 46 GiB guest, with no CPU saturation reported ([GitHub #70523](https://github.com/anthropics/claude-code/issues/70523)). Each session starts every configured MCP server, which adds 44–300 MB per server per session ([GitHub #40667](https://github.com/anthropics/claude-code/issues/40667), [tskulbru.dev](https://tskulbru.dev/posts/claude-code-shared-mcp-servers/)), and users have counted 20 copies of a Playwright MCP server running at once ([GitHub #107433](https://github.com/anthropics/claude-code/issues/107433)). A shared-MCP proxy reportedly cut MCP RAM by about 77% ([readybytes.in](https://readybytes.in/blog/shared-mcp-servers-claude-code)), so software discipline is the cheapest capacity upgrade available. In practice, budget 1.5–7 GB per active agent and 150–400 MB per headless browser ([testdino](https://testdino.com/blog/playwright-parallel-execution)). That makes **128 GB the floor for 10–20 concurrent agents and 256 GB the comfortable target**, before any RAM is set aside for CPU-side model inference.

**CPU cores** matter second, and only in bursts. An agent waiting on a cloud API streams HTTPS and uses almost no CPU. Cores get used when agents run compiles, test suites, linters, Docker builds and Chromium. Playwright's default worker count is half the logical cores, and going beyond that causes flakiness ([testdino](https://testdino.com/blog/playwright-parallel-execution)). No published benchmark measures agents per core, so the scaling that follows is my reasoning. Sixteen fast cores comfortably handle 10–20 API-backed agents as long as their tool bursts don't line up. Thirty-two cores roughly doubles headroom for parallel test suites across worktrees.

**VRAM** affects only the local-model share of the work, and there 16 GB is a hard ceiling. gpt-oss-20b needs 15.5 GB at 32K context and 17.9 GB at 128K. It runs fast on a 5070 Ti, at **189.5 tok/s generation and 6,340 tok/s prompt processing** ([llama.cpp #15396](https://github.com/ggml-org/llama.cpp/discussions/15396)), but it fills the card. A 16 GB GPU therefore hosts one of three things: a 20B-class router or fallback model, an embedding-plus-reranker pair for RAG, or the attention and KV layers of a larger MoE model whose experts sit in system RAM. The VRAM tiers that unlock new capability are **24–32 GB** (30B-class coders fully resident), **72–96 GB** (gpt-oss-120b at 61–68 GB, and GLM-4.5-Air at about 68 GB, with room for KV cache) and **192 GB+** ([llama.cpp #15396](https://github.com/ggml-org/llama.cpp/discussions/15396), [llamabuilds.ai](https://www.llamabuilds.ai/models)).

**Memory bandwidth** limits CPU and hybrid MoE decode. Measured results run 3–4× below the theoretical ceiling ([runaihome](https://runaihome.com/blog/cpu-vs-gpu-llm-inference-home-lab-2026/)). The best reference point uses this exact CPU: **DeepSeek-V3.2 decodes at about 14.5 tok/s on a 9175F with 12×64 GB of DDR5-6400** ([loftllc.dev](https://loftllc.dev/en/docs/tech/llm-research/deepseek-v3.2-performance-analysis/)). This build cannot reproduce that result, for reasons covered in the next section. **Storage** is mostly about model-library size and load time. A 60 GB model loads in about 10 seconds from a 7 GB/s NVMe drive, compared with minutes over the network. Personal-scale vector DBs fit in RAM, so disk IOPS rarely matter ([Qdrant](https://qdrant.tech/articles/memory-consumption)). **10GbE** speeds up model pulls and serving the box's endpoints to other machines. Cloud API traffic does not need it.

## The TURIND8X-2T wires 8 channels, so the bundle runs at 29% of rated bandwidth

The board's verified specs come from a retailer copy of the ASRock Rack spec sheet, because the manufacturer page would not load. They differ from what an "EPYC workstation" usually implies. The full model is **TURIND8X-2T/500W**: EEB form factor (12.63" × 13"), a single SP5 socket, and support for EPYC 9004/9005 parts up to 500 W TDP. It has **8 DDR5 RDIMM slots at 1DPC**, up to 6400 MT/s, with a maximum of 1 TB (or 2 TB with 3DS modules). It has **seven PCIe 5.0 x16 slots plus one x8**. Slots 0, 2, 4 and 6 are x16 with CXL 2.0. Slot 1 shares lanes with one MCIO port and one M.2 slot, and the x8 slot 7 shares lanes with two MCIO ports. The rest of the board has two M.2 slots (PCIe 5.0 x4, one of which can also run SATA), MCIO ports, **dual Broadcom BCM57416 10GBASE-T** plus a dedicated IPMI port, an ASPEED AST2600 BMC whose VGA is the only onboard video, eight 6-pin fan headers, and power inputs of **one 24-pin plus three 8-pin EPS** ([Central Computer spec copy](https://www.centralcomputer.com/asrock-rack-turind8x-2t-500w-server-motherboard-single-socket-sp5-supports-amd-epyc-9005-9004-processors-8x-ddr5-rdimm-slots.html), [Multitronic](https://www.multitronic.fi/en/products/4601285)). The retailer copy contradicts itself on the MCIO count: it says "3 total" but itemizes 2+1+1. Another listing describes three PCIe-or-SATA MCIO ports plus one PCIe-only port ([AVADirect](https://www.avadirect.com/TURIND8X-2T-500W-AMD-SoC-SP5-EEB-Motherboard/Product/19758828)). Treat the exact MCIO count and connector type as unverified until you read the manual.

The 8-slot layout has a large consequence. The 9175F is a 12-channel CPU rated at **614 GB/s** ([AMD](https://www.amd.com/en/products/processors/server/epyc/9005-series/amd-epyc-9175F.html)), but with 8 slots the board can reach at most 8×6400 = 410 GB/s. The bundle's four DDR5-5600 modules deliver about **179 GB/s in theory**. Scaling the 14.5 tok/s DeepSeek result by that ratio predicts roughly 4 tok/s, and DeepSeek-class models (about 350–600 GB at Q4) would not fit in 128 GB anyway. On this machine, gpt-oss-120b (about 61 GB) in hybrid mode with `--n-cpu-moe` is a realistic stretch goal. Consumer rigs report 8–30 tok/s with that setup, and RAM speed moves the result about 3× ([hardware-corner](https://www.hardware-corner.net/gpt-oss-offloading-moe-layers/), [carteakey.dev](https://carteakey.dev/blog/local-inference/optimizing-gpt-oss-120b-local-inference/)). With a 61 GB model resident, though, 128 GB leaves little room for 20 agents.

The 9175F itself is unusual: **16 cores on 16 CCDs**, each core with its own 32 MB L3 slice (512 MB total), clocked at 4.2/5.0 GHz with a 320 W TDP ([Level1Techs](https://forum.level1techs.com/t/epyc-turin-gaming-build-9175f/228698/3), [PassMark](https://www.cpubenchmark.net/cpu.php?cpu=AMD+EPYC+9175F)). Its 16 GMI links mean it can saturate any memory you install, and its clocks suit Node event loops and single-threaded `tsc`. AMD designed it for per-core-licensed databases and as a GPU host. On an 8-channel board, however, its main structural advantage, enough CCDs to feed all 12 channels, goes unused. A **32-core EPYC 9355P** has eight CCDs, each measured at about 100 GB/s of read bandwidth ([Chips and Cheese](https://chipsandcheese.com/p/amds-epyc-9355p-inside-a-32-core)). By my calculation that is enough to saturate this board's 410 GB/s ceiling, and it gives **twice the cores for about the same street price**: $2,263–3,408 for the 9355P versus $2,970–3,139 for the 9175F ([Newegg](https://www.newegg.com/amd-epyc-9355p-socket-sp5/p/N82E16819113875), [chipversus](https://chipversus.com/hardware/cpu/epyc-9175f)). For this workload the 9355P is the better CPU. Whether Micro Center will swap it into the bundle is the most valuable question to ask before Thursday.

## Component-by-component: keep the core, change the GPU, close three gaps

| Item (quote) | Verdict | Why | Recommended action |
|---|---|---|---|
| 9175F + TURIND8X-2T + 4×32 GB bundle, $5,999.99 | **Keep (fair-to-good price)** | CPU $2,970–3,139 + board $1,100–1,265 means about $1.6–1.9K is effectively paid for 128 GB RDIMM | Ask for a 9355P swap; populate DIMMs by the manual's 4-DIMM rule; plan to fill all 8 slots |
| ProArt RTX 5070 Ti 16 GB, $1,699.99 | **Change** | 2.3× its $749 MSRP and above ASUS's own $1,069.99 list; same silicon sells for $1,229–1,500 | Price-match or buy a cheaper 5070 Ti; or an R9700 32 GB if ROCm is acceptable |
| SilverStone XE360-SP5, $379.99 | Keep or swap | Purpose-built SP5 AIO, but SilverStone's official TDP rating is unverified and the pump is a 24/7 failure point | Arctic Freezer 4U-SP5 (rated 360 W) for reliability; keep the AIO if quiet matters most |
| Leadex VII Platinum PRO 1200 W, $189.99 | **Keep, after an EPS check** | Right size for one GPU (about 1,050 W peak DC); has 2 EPS cables, while the board specifies 3× 8-pin | Check the manual to see whether the third EPS is required; if it is, choose a unit with three EPS cables |
| 6× Arctic P12 Pro + CPF04 hub, $99.93 | Keep | Adequate for a tower airflow layout | Drive the hub from a BMC fan header; lower IPMI fan thresholds |
| 2× Kioxia CD6-R 7.68 TB U.3, about $2,449 each | **Keep if new and warrantied** | $319/TB beats the Micron 7450 PRO ($372–410/TB); 1 DWPD is about 14 PB written; Gen4, 19 W | Confirm new vs. HP server pull and the warranty; consider replacing one with a Gen5 M.2 drive for faster model loads |
| MCIO→U.2 cables (Amazon) | Keep, with care | The drives are Gen4, which tolerates generic cables much better than Gen5 | Keep cables ≤50 cm, give each drive its own SATA power lead, and verify links after install |
| Case (unchosen) | **Add** | Many "E-ATX" cases do not take SSI-EEB | Phanteks Enthoo Pro 2 Server Edition |

**The GPU is the clearest change.** RTX 50-series prices are up 66% year over year because of the GDDR7 shortage ([TechTimes](https://www.techtimes.com/articles/328936/20261012/gpu-prices-jump-again-as-amd-radeon-loses-its-last-affordability-buffer.htm)). The 5070 Ti's MSRP is $749, the ProArt OC's list price is **$1,069.99** ([SHI](https://texas.gs.shi.com/product/50697879/ASUS-PROART-GEFORCE-RTX-5070-TI-OC-EDITION-GRAPHICS-CARD)), and new 5070 Ti listings in November ran **$1,229–1,500** ([bestvaluegpu](https://bestvaluegpu.com/history/new-and-used-rtx-5070-ti-price-history-and-specs/), [tech-insider](https://tech-insider.org/nvidia-rtx-5070-ti-price-jump-160-dollars-79-percent-above-msrp-2026/)). The ProArt's premium buys a slimmer cooler and no extra VRAM. For about the same $1,700, you could get an AMD **Radeon AI PRO R9700 with 32 GB** (around $1,680–1,700 at Micro Center), a used 24 GB RTX 3090 ($1,475–1,629), or a 48 GB Arc Pro B60 Dual (~$1,950) ([computingforgeeks](https://computingforgeeks.com/arc-pro-b70-vs-r9700/), [gpusold](https://gpusold.com/gpu/rtx-3090-24), [openclawdc](https://openclawdc.com/blog/cheapest-32gb-vram-gpu-2026/)). Each carries trade-offs: the R9700 needs ROCm, the 3090 is a five-year-old used card, and the B60 Dual is two 24 GB GPUs on one board with a weaker software stack. For a CUDA-first box running vLLM and llama.cpp with little friction, a 5070 Ti at market price is still reasonable. A 5070 Ti at $1,699.99 is not. Waiting is unlikely to help: NVIDIA has no RTX 50 Super on the 2026 roadmap, and a 24 GB 5080 is rumored no earlier than Q1 2027 ([TechPowerUp](https://www.techpowerup.com/346010/no-nvidia-geforce-rtx-50-super-gpus-this-year-rtx-60-series-also-pushed-back)). Avoid the RTX 5090 (street price $4,300+) for this build. It keeps generating 12V-2x6 melting reports even when power-limited ([Guru3D](https://www.guru3d.com/story/geforce-rtx-5090-12v2x6-connector-melts-even-under-a-500w-cap/), [TweakTown](https://tweaktown.com/news/110219/undervolted-and-power-limited-geforce-rtx-5090-melts-12v-2x6-cable-and-connector/index.html)).

**The PSU's power budget is fine, but its connector count is not confirmed.** The Leadex VII Platinum PRO 1200 W has **one 600 W 12V-2x6, two EPS (4+4) and four PCIe 6+2** connectors ([Newegg](https://www.newegg.com/super-flower-atx-3-1-compatible-1200w-80-plus-platinum-certified-power-supplies-white/p/1HU-024C-00066)). The board spec lists **three 8-pin EPS inputs** ([Central Computer](https://www.centralcomputer.com/asrock-rack-turind8x-2t-500w-server-motherboard-single-socket-sp5-supports-amd-epyc-9005-9004-processors-8x-ddr5-rdimm-slots.html)). My sources don't say whether the third input is required for a 320 W CPU. Check the manual before you build. If all three are mandatory, choose a PSU that ships three EPS cables. Don't improvise with a PCIe-to-EPS adapter. For one GPU, 1,200 W covers about 1,050 W of peak DC load. Two 600 W GPUs would need about 1,700 W, which means a second PSU.

**The storage price is fair only if the drives are new.** At $2,449, the CD6-R costs **$319/TB**. That is below the Micron 7450 PRO 7.68 TB at $2,862–3,129 ([ListOfDisks](https://www.listofdisks.com/products/micron-7450-pro-7-68tb-mtfdkcc7t6tfr-7a7aa0), [CompSource](https://www.compsource.com/buy/MTFDKCC7T6TFR1BC15ABYYR/Micron-4165)) and below the Samsung 9100 PRO 8 TB, which is listed at $2,719.99 and out of stock ([Samsung](https://www.samsung.com/us/memory-storage/nvme-ssd/9100-pro-nvme-ssd-sku-mz-vap8t0b-am/)). The CD6-R is rated at 6.2/4.0 GB/s, 1 DWPD and **up to 19 W active** ([Newegg](https://www.newegg.com/KIOXIA-CD6-R-7-68TB/p/N82E16820988003), [Kioxia](https://business.kioxia.com/ru-ru/ssd/data-center-ssd/cd6-r.html)). That much power in a 15 mm 2.5" shell needs a front-intake fan blowing across it. HPE-branded Kioxia drives carry HPE's warranty, not Kioxia's, and take firmware only through HPE's tools ([Kioxia HPE OEM](https://business.kioxia.com/en-ca/ssd/oem/hpe.html)). If the Amazon listing is an HP server pull, $2,449 is too much. The quote also leaves both onboard **Gen5 M.2 slots empty**. A Gen5 M.2 drive reads models roughly 2.4× faster than a CD6-R, so a sensible layout is a fast M.2 drive for the OS and model library plus U.3 drives for high-endurance scratch, containers and data.

**For the cables, the CD6-R's Gen4 link is forgiving.** Forum reports describe defective generic SFF-8654 cables, AER errors, and a generic 0.5 m cable that failed at Gen4. Tight bends hurt even good Gen5 runs ([Level1Techs p.3](https://forum.level1techs.com/t/a-neverending-story-pcie-3-0-4-0-5-0-6-0-sci-fi-bifurcation-adapters-switches-hbas-cables-nvme-backplanes-risers-extensions-the-good-the-bad-the-ugly-will-there-be-a-final-solution/171428?page=3), [p.44](https://forum.level1techs.com/t/a-neverending-story-pcie-3-0-4-0-5-0-6-0-sci-fi-bifurcation-adapters-switches-hbas-cables-nvme-backplanes-risers-extensions-the-good-the-bad-the-ugly-will-there-be-a-final-solution/171428?page=44)). Use the shortest cable that reaches. If errors appear, force the port to Gen4. Because of the lane sharing above, put the GPU in slot 0, 2, 4 or 6 so MCIO use never steals its lanes.

**For the case, buy the Phanteks Enthoo Pro 2 Server Edition.** It has verified **SSI-EEB support, 503 mm GPU clearance, 11 2.5" positions, a 480 mm front and 360 mm top radiator mount**, and is sold as an 11-PCI-slot chassis ([Phanteks](https://phanteks.com/product/enthoo-pro-2-server-v2-black/), [Phanteks store](https://www.phanteks.store/products/phanteks-enthoo-pro-2-server-edition-closed-side-panel-black)). The Fractal Meshify 2 XL also supports SSI-EEB, but GPU clearance drops to about 340 mm in its storage layout ([Fractal](https://www.fractal-design.com/products/cases/meshify/meshify-2-xl-dark-tempered-glass/dark-tempered-glass/)). Lian Li does not confirm SSI-EEB mounting for the V3000 Plus, which lists EEB and E-ATX only ([Lian Li](https://lian-li.com/product/v3000-plus/)), and the Thermaltake AX500's SSI-EEB fit could not be verified. Mount the XE360's radiator at the top as exhaust so the GPU's intake air stays cool.

**A single GPU fits a household circuit; two do not.** AI inference that runs for 3 hours or more counts as a continuous load under the NEC 125% rule, which caps a 120 V circuit at **1,440 W on 15 A and 1,920 W on 20 A** ([EEPower](https://eepower.com/technical-articles/national-electrical-code-basics-sizing-and-protecting-branch-circuit-conductors/), [IAEI](https://iaeimagazine.org/2016/may2016/100-vs-80-choosing-the-right-ocpd-solution/)). One GPU draws about 1,150 W at the wall. That fits a lightly shared 15 A circuit but is better on a dedicated 20 A circuit. Two 600 W GPUs sit right at the 20 A limit, and three or more need a 240 V circuit, usually a routine permitted job on Miami's typical 200 A service. South Florida storms make a pure-sine UPS of about 1,500–2,200 VA prudent for one GPU. Plan for the heat too: each kilowatt is 3,412 BTU/h of air-conditioning load.

## Pricing realities: DRAM sets the clock, GPUs carry the markup

Memory is the market force that matters most for timing. Server DRAM contract prices rose 55–60% quarter over quarter in Q2 2026. **64 GB DDR5 RDIMMs went from $873 in Q1 to a projected $1,586 in Q4 2026**, and no meaningful new supply is expected before late 2027–2028 ([runaihome](https://runaihome.com/blog/cpu-vs-gpu-llm-inference-home-lab-2026/)). TrendForce listed the 32 GB DDR5 RDIMM module spot average at **2,025 on November 2**, down 6.5% that week ([TrendForce](https://www.trendforce.com/price/dram/dram_spot), [FourWeekMBA](https://fourweekmba.com/ai-has-memory-peaked-spot-prices-slip-as-micron-rallies-24/)). If that figure is US dollars per module, filling the board's other four slots would cost about $8K. That is hard to reconcile with a $6K bundle that already includes 128 GB, so treat the unit as uncertain and get a live retail quote. Either way, the 128 GB inside the bundle is the most supply-exposed and appreciating part of the quote. That is the strongest reason to lock the bundle now.

GPU street prices sit 79–120% above MSRP for the 5070 Ti and 5080. The RTX PRO 5000 72 GB is **$8,900 at Micro Center** ([rtx.live](https://rtx.live/gpus/rtx-pro-5000-blackwell-72gb)). The RTX PRO 6000 96 GB Max-Q, the ideal dense, blower-style 300 W card, listed at about $8.4–8.6K at launch ([HotHardware](https://hothardware.com/news/nvidia-rtx-pro-6000-blackwell-cards-96gb-gddr7-listed-8k)) but now trades at $15–22K on secondary markets ([gpupoet](https://gpupoet.com/gpu/learn/price/september-2026/nvidia-rtx-pro-6000-blackwell-max-q)). Its current retail price is the largest unknown in any high-VRAM plan. Micro Center's quote shows 7% Miami-Dade sales tax ($585.89 on $8,369.89). A Micro Center card takes 5% off.

The tiers below are pre-tax and use the prices cited above. Line items without a sourced price are marked "quote needed".

At the $27K level, the important comparison is with the ASUS WRX90 Threadripper PRO quote. **WRX90 is also an 8-channel platform with 128 PCIe 5.0 lanes**, and the 32-core PRO 9975WX lists at $4,099 ([Wccftech](https://wccftech.com/amd-confirms-ryzen-threadripper-9000-hedt-cpu-prices-available-31st-july/)). Because the TURIND8X-2T is also limited to 8 channels, the two platforms reach about the same memory bandwidth. WRX90 offers a friendlier workstation board (onboard audio and USB, normal fan control) and 32 cores out of the box. It does not offer any additional local-AI capability. I did not see the WRX90 quote's parts list, so I can't say what GPU it included. My conclusion is that the same $27K spent on this SP5 bundle buys a 72 GB-class GPU, and VRAM is the line in this workload that changes what the machine can do. That supports your own reaction that the WRX90 total "seems crazy for this compute." The EPYC route wins on capability per dollar, and the WRX90 route wins only on ergonomics.

## Upgrade path: memory first, VRAM second, power third

The platform has a long runway. **First, fill the remaining four DIMM slots with identical 32 GB modules.** That doubles bandwidth to about 358 GB/s and capacity to 256 GB. Match capacity and rank so interleaving stays balanced. Moving to 64 GB modules later would mean replacing all eight, so decide early whether 256 GB or 512 GB is the end state. **Second, add VRAM with blower-style, 2-slot pro cards** (PRO 5000 or PRO 6000 Max-Q) in slots 0/2/4/6. Open-air 2.5–3-slot cards like the ProArt (304 mm, 2.5 slots, [Newegg](https://www.newegg.ca/asus-proart-rtx5070ti-o16g-geforce-rtx-4070-12gb-graphics-card-air-cooler/p/N82E16814126830)) recirculate heat when stacked and cap the board at 2–3 cards. Consumer RTX 50 cards have no NVLink or stock P2P, so vLLM tensor parallelism falls back to NCCL through host memory ([vLLM forum](https://discuss.vllm.ai/t/what-means-there-is-no-p2p-support/1928)). Running one model per GPU (router, coder, embedder) avoids that penalty and fits orchestration naturally. **Third, scale power.** A second 300 W card still fits the 1,200 W PSU. Two 600 W cards need a second PSU joined with an add2psu board, with each GPU powered entirely from one unit. Three or more GPUs need a 240 V circuit. **Finally, the CPU can grow.** The board supports 9005 parts up to 500 W, so a 64–96-core 9555P or 9655P ($5.2–6.8K, [IPC Store](https://ipcstore.com/amd-epyc-9655p-processor-26-ghz-384-mb-l3-16068228)) can drop in later. Above 360 W you would need to upgrade the Arctic cooler, and the XE360's rating would need confirming.

## Conclusion

This machine is bounded by memory, not by compute. The board's 8-slot design turns the 9175F's best feature, saturating 12 channels, into an unused feature. Its high-clock, 16-core design then becomes a liability for agent fan-out, where RAM capacity and burst cores matter more. That is why the right fixes are cheap: a CPU swap at the same price, four more DIMMs, and a GPU bought at market price rather than at a premium. Expensive moves like a WRX90 platform or a 5090 don't help much here.

There is a second takeaway. Because both the EPYC and Threadripper PRO routes top out at 8 channels here, the platform decision is basically settled, and the real decision is about VRAM. Every tier above $15K should be judged by how much model it can hold resident on the GPU. Until 72–96 GB cards return to sane prices, the best orchestration setup is a lean local tier (router, embeddings, reranker) on a 16–32 GB card, with frontier reasoning left to the cloud APIs that will carry most of the agent load anyway.
