Step-by-step bring-up of the Go2 X add-on computer, from bare board to a networked, ROS 2-ready unit. Written 2026-11-22 from the first bench session. It expands **Step 2: Software on the Jetson** of the [Go2 X build plan](fu-build-plan.html).

Commands marked **Mac** run in Terminal on the Mac. Commands marked **Jetson** run on the Jetson, either at its own keyboard or over SSH. Anything marked *verify* has not yet been checked on this unit.

## 0. What you need on the bench

| Item | Why | Notes |
|---|---|---|
| Jetson Orin Nano Super Developer Kit | The computer | Part 945-13766-0000-000 |
| 19 V DC supply, 5.5 × 2.5 mm barrel | Power | The supplied brick is the safe choice. A power bank only works if its DC output is set to **19 V** |
| microSD card, **64 GB or more**, UHS-I U3 / A2 | First boot | 32 GB works for bring-up only. The JetPack 6.2.1 image is 24.1 GB, leaving almost no space |
| 1 TB M.2 2280 NVMe SSD (PCIe) | Permanent boot drive | Step 7 |
| Monitor with **DisplayPort**, or an *active* DP-to-HDMI adapter | See the boot screens | Passive adapters often give a black screen |
| USB keyboard and mouse | First-boot setup | Use any USB-A port |
| **USB-C data cable** (Jetson USB-C → Mac) | Headless setup, rescue, network over USB | Must carry data, not only charge |
| Ethernet cable | Network | Plug into the router for internet; later into the Go2 |

## 1. Know the board

Looking at the dev kit with the fan on top and the ports toward you:

| Port | What it is for |
|---|---|
| **Barrel jack** (far left) | 19 V power in. The board powers on as soon as power is connected |
| **DisplayPort** | The only video output; there is no HDMI |
| **4 × USB-A** (two stacked pairs) | Host ports for keyboard, mouse, drives, LiDAR, arm. **A computer cannot connect to the Jetson through these** |
| **RJ45 Ethernet** | Gigabit. The green link LED shows a live cable |
| **USB-C** (small oval port, top right) | Device port. It connects to the Mac for network-over-USB (192.168.55.1), the serial console and recovery-mode flashing |
| **microSD slot** | On the underside of the module (the board under the heatsink), on its edge |
| **2 × M.2 Key M** (underside of the carrier) | NVMe SSDs |
| **2 × 22-pin MIPI CSI** connectors | Cameras (Raspberry Pi-style ribbon cables) |
| **40-pin header** | GPIO, I²C, SPI, UART |
| **Button header** | Power, reset and **force-recovery** pins (Step 9). Check the silkscreen for the FC REC and GND pins |

Lesson from the first session: the USB cable was in a **USB-A** port, so the Mac never saw the Jetson. The Mac link always goes to the **USB-C** port.

## 2. Write JetPack to the microSD card (Mac)

NVIDIA's current SD image for this kit is **JetPack 6.2.1 (Jetson Linux 36.4.4)**. NVIDIA's instruction is to flash 6.2.1 and then upgrade over APT to 6.2.2 / Jetson Linux 36.5 (Step 6).

1. **Download** (11.7 GB): `https://developer.nvidia.com/downloads/embedded/L4T/r36_Release_v4.4/jp62-r1-orin-nano-sd-card-image.zip`. Our copy is saved at `~/Code/ai-rig/jetson/jp621-orin-nano-sd-card-image.zip`; it passed a zip integrity test and contains `sd-blob.img` (24,086,839,296 bytes).
2. **Insert the card** into the Mac's reader. Find it (**Mac**):
   ```
   diskutil list external physical
   ```
   Match the disk by size. Our 32 GB card showed up as `disk5`, 31.3 GB. **Writing to the wrong disk destroys it.** Unplug other USB drives first.
3. **Write it** (**Mac**, asks for your password, 15–25 min, press Ctrl+T for progress):
   ```
   diskutil unmountDisk /dev/disk5
   unzip -p ~/Code/ai-rig/jetson/jp621-orin-nano-sd-card-image.zip sd-blob.img | sudo dd of=/dev/rdisk5 bs=4m
   sync && diskutil eject /dev/disk5
   ```
   Alternative: balenaEtcher, which verifies the card after writing.
4. If macOS says *"The disk you inserted was not readable"*, click **Ignore**. The card holds Linux partitions that macOS cannot read. Clicking **Initialize** would erase it.

## 3. First boot

1. With power **disconnected**, insert the card into the slot under the module, contacts facing the board.
2. Connect the monitor (DisplayPort), keyboard and mouse, Ethernet to the **router**, and the USB-C cable to the Mac.
3. Turn on the monitor and select its input.
4. Connect **power last**. The fan spins and the green LED lights.
5. **Expected:** the NVIDIA logo within about 30 s, then Ubuntu's **oem-config** setup: language, licence, keyboard, time zone, then **username, computer name and password**, then the APU power mode. Pick **MAXN SUPER** if it is offered. The unit reboots to the desktop.

Suggested naming: computer name `fu-gen1-01`, username `accel`. Record the password in the team password manager, not in this document.

### Headless first boot (no working display)

If no monitor works, oem-config runs on the **serial console over USB-C** instead.

**Mac:**
```
ls /dev/cu.usbmodem*
screen /dev/cu.usbmodem* 115200
```
Press Enter if the screen is blank, and complete the same setup questions in the terminal. Exit `screen` with Ctrl+A then K. *Verify* on this unit.

## 4. If the screen stays black: firmware

The Jetson's **QSPI boot firmware** must be **Jetson Linux 36.x or newer** to boot any JetPack 6 card. Kits built before JetPack 6 shipped with 35.x (JetPack 5) firmware, and with that firmware a JetPack 6 card shows a black screen or stops at a UEFI shell.

**Check:** the NVIDIA logo screen shows the UEFI firmware version, and pressing **Esc** there opens the UEFI menu, which shows it too. If it reads 35.x, update it.

**Update path (no Linux PC needed):**
1. Write NVIDIA's **JetPack 5.1.3** SD image to a card, the same way as Step 2.
2. Boot it and complete setup. It stages a QSPI update to 36.x. Reboot and **let the update finish without removing power**. It takes several minutes, with a progress bar on screen.
3. Power off, swap in the JetPack 6.2.1 card, and boot.

The full procedure is in NVIDIA's *JetPack 6.x Update Path* guide and the Jetson AI Lab *Initial Setup Guide for Jetson Orin Nano*. Follow those exact steps; this section is a summary.

**Other black-screen causes, in order:**
1. A blank or badly written card. Reseat it; rewrite it with Etcher, which verifies.
2. A passive DP-to-HDMI adapter, or a monitor that was off at power-on.
3. Under-voltage. A power bank not set to 19 V lets the LEDs light but stops the boot.

## 5. Get on the network and SSH in

**Over USB-C (always available once Ubuntu is running):** the Jetson appears to the Mac as a USB network adapter. The Jetson is at **192.168.55.1**, and the Mac gets 192.168.55.100.

**Mac:**
```
ping 192.168.55.1
ssh accel@192.168.55.1
```

**Over Ethernet:**
- **To the router:** the Jetson gets an address by DHCP. Find it with `hostname -I` (**Jetson**), or reach it by name with `ssh accel@fu-gen1-01.local`.
- **Direct cable to the Mac:** this gives no address unless the Mac shares its connection. Turn on System Settings → General → Sharing → **Internet Sharing**, sharing Wi-Fi to the USB LAN adapter. Lesson from the first session: a direct cable to the Mac only showed an IPv6 link-local neighbour; there was no IPv4 address and no SSH.

**Install your SSH key and make login key-only:**

**Mac:**
```
ssh-copy-id accel@192.168.55.1
```

**Jetson** (only after the key login works):
```
sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
sudo systemctl restart ssh
```

## 6. Update and install the JetPack SDK

**Jetson:**
```
cat /etc/nv_tegra_release          # expect R36 (release), REVISION: 4.4
sudo apt update && sudo apt full-upgrade -y
sudo apt install -y nvidia-jetpack # CUDA, cuDNN, TensorRT, VPI, multimedia API
sudo reboot
```

- **Upgrade to 6.2.2 / Jetson Linux 36.5:** follow NVIDIA's APT note on the JetPack 6.2.2 page. It may require pointing the NVIDIA apt source at the r36.5 repository before upgrading (*verify*). Afterwards, check that `cat /etc/nv_tegra_release` reports the new revision.
- **Power mode:** choose **MAXN SUPER** from the power-mode menu in the top bar. In a terminal, `sudo nvpmodel -q` shows the current mode and `sudo nvpmodel -p --verbose` lists them. Use `sudo jetson_clocks` only for benchmarking.
- **Monitoring:**
  ```
  sudo pip3 install -U jetson-stats && sudo reboot
  jtop
  ```
  jtop shows CPU and GPU load, temperatures, power draw and the JetPack version.

## 7. Move to the NVMe SSD (recommended before field use)

A microSD card is slow and wears out under constant logging. The unit should boot from the 1 TB NVMe.

1. Power off. Fit the SSD in an M.2 Key M slot on the underside of the carrier and secure the screw.
2. Choose a method:
   - **A. Write the same image to the SSD from the Mac.** Put the SSD in a USB NVMe enclosure, write `sd-blob.img` to it exactly as in Step 2, then install it in the Jetson **without** the microSD card. With 36.x firmware the UEFI boots from NVMe. On first boot, grow the root partition to fill the disk (*verify* that the image auto-expands).
   - **B. NVIDIA SDK Manager or `l4t_initrd_flash.sh`** from an **x86 Ubuntu 22.04 PC**, with the Jetson in force-recovery mode (Step 9). This is the official path. It cannot run on an Apple Silicon Mac.
3. Confirm with `lsblk` (**Jetson**): root should be mounted from `nvme0n1p1`.
4. Keep the microSD card as a labelled rescue card.

## 8. Software stack for the Go2

Install in this order (**Jetson**).

**8.1 Docker with GPU access.** The NVIDIA container runtime comes with `nvidia-jetpack`.
```
sudo usermod -aG docker $USER   # log out and back in
docker run --rm --runtime nvidia nvcr.io/nvidia/l4t-jetpack:r36.4.0 nvidia-smi
```
The image tag must match the installed L4T version (*verify*).

**8.2 ROS 2 Humble** (Ubuntu 22.04). Follow the official ROS 2 Humble Debian install: add the ROS apt source and key, then:
```
sudo apt install -y ros-humble-ros-base python3-colcon-common-extensions
echo "source /opt/ros/humble/setup.bash" >> ~/.bashrc
```
Isaac ROS containers are the alternative when GPU-accelerated perception packages are needed.

**8.3 CycloneDDS matching the robot.** The build plan pins CycloneDDS **0.10.x**.
```
sudo apt install -y ros-humble-rmw-cyclonedds-cpp
echo "export RMW_IMPLEMENTATION=rmw_cyclonedds_cpp" >> ~/.bashrc
```
Bind CycloneDDS to the Ethernet interface that faces the dog, using a `CYCLONEDDS_URI` XML that names the interface.

**8.4 Unitree software.** Build `unitree_sdk2` and `unitree_ros2` in a colcon workspace if the Step 1 network test gives **Result A**. Use the community WebRTC driver (`go2_ros2_sdk`) if it gives **Result B**. Both choices are in the build plan, Step 1.

**8.5 Link to the Brain.** Use Zenoh (`rmw_zenoh` or `zenoh-bridge-ros2dds`) over Wi-Fi to the workstation. Do not bridge the robot's DDS network onto the office LAN.

## 9. Recovery mode and full reflash

Use this when the unit will not boot from anything, or for an official SDK Manager flash.

1. Power off.
2. Jumper the **FC REC** pin to **GND** on the button header.
3. Connect USB-C to an **x86 Ubuntu 22.04** host and apply power. On the host, `lsusb` shows an NVIDIA device (vendor ID `0955`).
4. Flash with SDK Manager or `l4t_initrd_flash.sh` (this also rewrites the QSPI firmware).
5. Remove the jumper and power-cycle.

Recovery flashing does not work from macOS.

## 10. Network setup for the robot (bench first)

Once Step 1 of the build plan is ready, give the Ethernet port the static address on the dog's network. On JetPack 6 the port is usually named **`enP8p1s0`**; confirm with `ip link`.

**Jetson:**
```
sudo nmcli con add type ethernet ifname enP8p1s0 con-name go2 \
  ipv4.method manual ipv4.addresses 192.168.123.99/24 ipv6.method ignore
sudo nmcli con up go2
ping 192.168.123.161                 # Go2 motion board
```

Keep internet access on **Wi-Fi** (`nmcli dev wifi connect <SSID> --ask`) so the robot network stays isolated. Avoid .161, .18 and .100 on 192.168.123.x.

## 11. Cameras on the CSI ports

The bench unit has two Raspberry Pi-style camera ribbons fitted.

1. **Check the sensor.** JetPack supports the **IMX219** (Raspberry Pi Camera v2) out of the box. Camera Module 3 (IMX708) and the HQ camera (IMX477) need third-party drivers (*verify* which modules are fitted).
2. **Enable them** (**Jetson**):
   ```
   sudo /opt/nvidia/jetson-io/jetson-io.py
   ```
   Choose *Configure Jetson 24pin CSI Connector* → *Configure for compatible hardware* → the matching camera profile (for example *Camera IMX219 Dual*). Save, then reboot.
3. **Test:**
   ```
   ls /dev/video*
   gst-launch-1.0 nvarguscamerasrc sensor-id=0 ! 'video/x-raw(memory:NVMM),width=1920,height=1080' ! nvvidconv ! xvimagesink
   ```
4. Power off before reseating a ribbon. Contacts face the connector's pins; close the latch fully.

## 11b. Connecting the LiDAR and cameras together

The plan is to connect the cameras and the LiDAR directly to the Jetson. The board has **one** Ethernet port, so plan the connections before cabling.

**Port plan:**

| Sensor | Connects to | Power | Notes |
|---|---|---|---|
| CSI camera 1 | CSI connector 0 (22-pin ribbon) | From the Jetson | Set up in Step 11 |
| CSI camera 2 | CSI connector 1 | From the Jetson | Set up in Step 11 |
| Unitree L2 LiDAR | Ethernet through the **5-port 12 V switch**, or a USB 3 Gigabit Ethernet adapter on the Jetson | **12 V** from the accessory buck converter. Never from a Jetson USB port | Factory IP 192.168.1.62, so it must be moved (below) |
| Go2 rear Ethernet port | The same switch | From the robot | 192.168.123.161 |
| Insta360 X4 (if used) | USB-A, as a USB storage/webcam device | Its own battery | 360° capture is normally recorded on the camera and processed on the Brain; *verify* webcam (UVC) mode on the X4 if live video is wanted |
| USB peripherals (arm, IMU, GNSS) | USB-A | Bus power, or external power for anything over about 0.9 A | Prefer USB 3 ports; avoid a hub carrying the LiDAR adapter |

**Recommended bench layout:**
```
                    ┌──────────────┐
  Go2 rear RJ45 ────┤              │
  Unitree L2 ───────┤  12 V 5-port ├──── Jetson enP8p1s0  (192.168.123.99)
  spare / laptop ───┤  GbE switch  │
                    └──────────────┘
  CSI 0 / CSI 1 ── cameras          USB-C ── Mac (192.168.55.x, bench only)
  Wi-Fi ── office / travel router (internet, Zenoh link to the Brain)
```

**LiDAR bring-up (Unitree L2):**
1. Power the L2 from the 12 V rail, sharing a ground with the Jetson supply. Connect its Ethernet to the switch.
2. **First contact at the factory address.** Temporarily add a second address on the Jetson's port so that it can reach 192.168.1.62. **Jetson:**
   ```
   sudo ip addr add 192.168.1.2/24 dev enP8p1s0
   ping 192.168.1.62
   ```
3. Using Unitree's L2 configuration tool or SDK, change the LiDAR's IP to **192.168.123.20** and its **destination IP to 192.168.123.99**. The L2 streams point-cloud UDP packets to whatever host is set as the destination. Then remove the temporary address:
   ```
   sudo ip addr del 192.168.1.2/24 dev enP8p1s0
   ```
   (*verify* the exact tool and the default ports in the L2 manual)
4. Build the **unilidar_sdk2** ROS 2 package. Launch it and check `ros2 topic hz` on the point-cloud and IMU topics.
5. Add **Point-LIO** (or FAST-LIO2) for odometry, fed by the L2's built-in IMU.

**Camera checks with the LiDAR running:**
- Run both CSI cameras plus the LiDAR driver together for 10 minutes, watching `jtop`. Two 1080p CSI streams plus the L2 should fit comfortably. The Orin Nano has **no hardware video encoder**, so any H.264/H.265 recording or streaming is done on the CPU. Keep live streams small (about 640×480 at 15 fps) and record raw or compressed on the Brain.
- Timestamps: cameras use the Jetson clock; the L2 stamps its own packets. Run `chrony` on the Jetson and sync the LiDAR's time where its SDK supports it (*verify*).

**Cabling rules for the dog:**
- Flat-edge RJ45 under the plate.
- Strain relief on every ribbon. CSI ribbons are fragile; route them away from the fan and the leg sweep.
- Keep sensor 12 V and the Jetson's 19 V on separate fused branches from the accessory battery (build plan, Step 3).

## 12. Acceptance checklist

| # | Check | Pass |
|---|---|---|
| 1 | Boots to the desktop or login with the monitor attached | ☐ |
| 2 | Firmware version 36.x or later shown on the boot screen | ☐ |
| 3 | `ssh accel@192.168.55.1` works over USB-C with a key; password login is disabled | ☐ |
| 4 | Internet through the router or Wi-Fi; `apt update` is clean | ☐ |
| 5 | `/etc/nv_tegra_release` at R36 with the target revision; `nvidia-jetpack` installed | ☐ |
| 6 | Power mode MAXN SUPER; jtop runs | ☐ |
