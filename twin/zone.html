R.domElement.addEventListener('click',e=>{ if(PICK||!rdn||Math.hypot(e.clientX-rdn[0],e.clientY-rdn[1])>5) return; const r=R.domElement.getBoundingClientRect(); rr.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),cam);
  const h=rr.intersectObjects(ROOMFL,false)[0]; if(!h) return; SELROOM=h.object.userData.room; paintRooms(); showRoom(SELROOM); });
function showRoom(r){ const cov=r.scan_coverage, c=cov==null?'':cov>=.7?'#2FD39A':cov>=.35?'#E9B949':'#FF6B5E'; const sp=Object.values(ST?.spaces||{}).find(x=>x.name===r.name);
  side(`<div class="card"><div class="k10">Room · from your floor plan</div><b style="font-size:16px">${esc(r.name)}</b>${r.dims?` <span class="mute">${esc(r.dims)}</span>`:''}<br>
   <div style="margin:8px 0;display:flex;gap:14px"><div><b style="font-size:18px">${r.area_m2??'—'} m²</b><br><span class="mute" style="font-size:11px">PLAN AREA</span></div><div><b style="font-size:18px;color:${c}">${cov!=null?Math.round(cov*100)+' %':'—'}</b><br><span class="mute" style="font-size:11px">SCANNED</span></div><div><b style="font-size:18px">${(r.tags||[]).length}</b><br><span class="mute" style="font-size:11px">TAGS</span></div></div>
   ${cov!=null&&cov<.5?`<p style="color:#E9B949;font-size:12px;margin:0 0 8px">Under half of this room was captured. Film a slow loop around it next.</p>`:''}
   ${sp?`<p class="mute" style="font-size:12px">In the ledger as ${sp.id}.</p>`:'<p class="mute" style="font-size:12px">Not in the ledger yet.</p>'}
   ${r.name==='Bedroom 3'||sp?.id==='SPC-0001'?'<a href="index.html"><button class="pri">Open room view ›</button></a>':''}</div>`); }
// owner floor plan (digitised rooms) drawn on the floor in gold
if(PO) for(const r of PO.rooms){ const pts=r.poly_xz.map(([x,z])=>new THREE.Vector3(x,fy+.03,z)); const l=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineDashedMaterial({color:0xFFD27A,dashSize:.18,gapSize:.1,depthTest:false})); l.computeLineDistances(); l.renderOrder=20; LAY.plan.add(l);
  const sh=new THREE.Shape(r.poly_xz.map(([x,z])=>new THREE.Vector2(x,-z))); const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshBasicMaterial({color:0xFFD27A,transparent:true,opacity:.07,depthWrite:false})); m.rotation.x=-Math.PI/2; m.position.y=fy+.02; LAY.plan.add(m); }
// ---- labels ----
const pins=[]; function pin(txt,pos,col,cls,fn){ const d=document.createElement('div'); d.className='pin '+(cls||''); d.style.color=col; d.innerHTML=(cls==='room'?'':'<i></i>')+'<span>'+esc(txt)+'</span>'; d.onclick=fn; $('#labels').appendChild(d); pins.push({d,pos}); return d; }
Object.entries(Z.tags).sort().forEach(([k,p])=>{ const d=pin(k,new THREE.Vector3(p[0],p[1],p[2]),'#00C8FF','tagdot',()=>show({tag:k,p})); d.title=k; });
const planPins=[]; if(PO) for(const r of PO.rooms){ if(r.name==='Bedroom 3') continue; if(/A\/C|W\/D|Closet|Corridor|elevator/.test(r.name)) continue; const d=pin(r.name,new THREE.Vector3(r.center_xz[0],fy+.05,r.center_xz[1]),'#FFD27A','room plan',()=>{}); d.title=r.dims||''; planPins.push(d); }
if(B3){ const c=B3.floor_rect.reduce((s,p)=>[s[0]+p[0]/4,s[1]+p[1]/4],[0,0]); const sp=ST&&Object.values(ST.spaces)[0]; pin(sp?.name||'Bedroom 3',new THREE.Vector3(c[0],fy+.05,c[1]),'#D4A65A','room',()=>location.href='ledger.html'); }
// ---- rooms recorded in the ledger (named in this view or elsewhere) ----
const roomPins=[]; function drawRooms(){ roomPins.forEach(d=>d.remove()); roomPins.length=0; if(!ST) return;
  for(const sp of Object.values(ST.spaces)){ const c=sp.geometry?.zone_point; if(!c) continue; const d=pin(sp.name,new THREE.Vector3(c[0],c[1]+.05,c[2]),'#2FD39A','room',()=>show({space:sp})); roomPins.push(d); } }
drawRooms();
// ---- side panel ----
const reg=Z.registration||{}; const agree=reg.scale_agreement_pct;
$('#regChip').textContent=reg.residual_rms_m!=null?`frame fit ${(reg.residual_rms_m*100).toFixed(1)} cm · scale check ${agree!=null?(agree>0?'+':'')+agree+' %':'—'}`:'unregistered'; if(agree==null||Math.abs(agree)>3) $('#regChip').classList.add('warn');
let LON={cov:false,arch:true,plan:false,walls:false,floor:false,scan:false,path:true,b3:false,tags:true};
function side(extra){ $('#side').innerHTML=`<div class="k10">Zone · Level 1</div><h2 id="zt">${esc(Z.name||'Unit zone')}</h2><div class="mute" style="font-size:12px">From the 360° walk (VID_092) and the phone walk (IMG_1163) · ${Z.stats.cameras} posed views</div>
  <div class="stats"><div><b>${Z.floorArea} m²</b><span>floor seen</span></div><div><b>${Object.keys(Z.tags).length}</b><span>control tags</span></div><div><b>${(Z.ceiling_y-Z.floor_y).toFixed(2)} m</b><span>ceiling height</span></div><div><b>${(Z.stats.points/1000).toFixed(0)}k</b><span>scan points</span></div></div>
  ${extra||''}
  <div class="sec"><div class="k10">Rooms</div>${Object.values(ST?.spaces||{}).map(sp=>`<div class="row" data-sp="${sp.id}"><i style="background:${sp.id==='SPC-0001'?'#D4A65A':'#2FD39A'}"></i>${esc(sp.name)}<b>${sp.id}</b></div>`).join('')}
    ${PO?`<div style="margin-top:8px"><button class="pri" id="recRooms">Record ${PO.rooms.filter(r=>!Object.values(ST?.spaces||{}).some(s=>s.name===r.name)).length} plan rooms in the ledger</button></div>`:''}
    <div style="margin-top:8px"><button id="nameRoom">＋ Name a room</button> <span class="mute" style="font-size:11.5px">click its floor, pick the name from your plan</span></div></div>
  <div class="sec"><div class="k10">Layers</div>${[['cov','Colour rooms by scan coverage','#2FD39A'],['arch','Unit model (from your floor plan)','#E9ECF2'],['plan','Plan room outlines','#FFD27A'],['walls','Scan evidence: walls','#8E9AB5'],['floor','Scan evidence: floor','#B4B1AA'],['scan','Scan points','#8E9AB5'],['path','Capture path','#D4A65A'],['b3','Bedroom 3 (measured room)','#D4A65A'],['tags','Control tags','#00C8FF']].map(([k,n,c])=>`<div class="row" data-l="${k}"><i style="background:${c}"></i>${n}<span class="sw ${LON[k]?'on':''}"><i></i></span></div>`).join('')}</div>
  ${PO?`<div class="sec"><div class="k10">Plan vs scan</div><div class="card">Owner plan digitised from your image (±0.3 m) and anchored on Bedroom 3 (${(PO.anchor_residual_m*100).toFixed(1)} cm).<br>${Z.warp?`<b style="color:#2FD39A">Pulled onto the plan</b> with ${Object.keys(Z.warp.pairs).length} tags pinned to the positions you marked (thin-plate spline, Bedroom 3 fixed). Consistency check (each tag predicted from the others): ${Object.values(Z.warp.leave_one_out_m).map(v=>v.toFixed(1)).join(', ')} m. Unmarked: ${Object.keys(Z.tags).filter(t=>!Z.warp.pairs[t]).join(', ')}.`:'<b style="color:#E9B949">The scan drifts with distance from Bedroom 3.</b>'}</div></div>`:''}
  <div class="sec"><div class="k10">Registration</div><div class="card">${esc(reg.method||'')}<br>Fit to Bedroom 3 markers: <b>${reg.residual_rms_m!=null?(reg.residual_rms_m*100).toFixed(1)+' cm RMS':'—'}</b><br>Scale from markers vs from ${Object.keys(Z.tags).length} control tags: <b>${agree!=null?(agree>0?'+':'')+agree+' %':'—'}</b>${reg.tag_scale_spread_pct!=null?` (tag spread ${reg.tag_scale_spread_pct} %)`:''}</div></div>
  <div class="sec"><div class="k10">Control tags</div>${Object.entries(Z.tags).sort().map(([k,p])=>`<div class="row" data-t="${k}"><i style="background:#00C8FF"></i>${k}<b>${(p[1]-Z.floor_y).toFixed(2)} m up</b></div>`).join('')}</div>`;
  document.querySelectorAll('[data-l]').forEach(r=>r.onclick=()=>{ const k=r.dataset.l; LON[k]=!LON[k]; apply(); side(extra); });
  document.querySelectorAll('[data-t]').forEach(r=>r.onclick=()=>show({tag:r.dataset.t,p:Z.tags[r.dataset.t]}));
  document.querySelectorAll('[data-sp]').forEach(r=>r.onclick=()=>show({space:ST.spaces[r.dataset.sp]}));
  const rb=$('#recRooms'); if(rb) rb.onclick=async()=>{ let who=localStorage.getItem('ledger.author'); if(!who){ rb.insertAdjacentHTML('afterend','<div style="margin-top:6px;display:flex;gap:6px"><input id="recWho" placeholder="Your name (signs the record)" style="flex:1;padding:7px;background:#070B16;border:1px solid #1C2640;border-radius:8px;color:#EEF2FA"><button class="pri" id="recGo">Record</button></div>'); $('#recWho').focus(); $('#recGo').onclick=()=>{ const v=$('#recWho').value.trim(); if(!v) return; localStorage.setItem('ledger.author',v); rb.click(); }; return; } try{ localStorage.setItem('ledger.author',who); }catch(_){}
    let n=0; for(const r of PO.rooms){ if(Object.values(ST.spaces).some(s=>s.name===r.name)) continue; const res=await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'space.created',data:{level:Object.keys(ST.levels)[0],name:r.name,kind:/Bath|Powder/.test(r.name)?'bathroom':/Closet|Wardrobe|W\/D|A\/C/.test(r.name)?'utility':/Hall|Corridor|foyer/.test(r.name)?'circulation':/elevator/.test(r.name)?'vertical':'room',plan_dims:r.dims||undefined,area_m2_plan:r.area_m2,scan_coverage:r.scan_coverage,geometry:{outline_xz:r.poly_xz,zone_point:[r.center_xz[0],Z.floor_y,r.center_xz[1]],source:'owner floor plan, digitised; anchored on Bedroom 3'}},author:who})}); if(res.ok) n++; }
    ST=await fetch('/api/state').then(r=>r.json()); side(`<div class="card" style="border-color:#2FD39A"><b style="color:#2FD39A">✓ ${n} rooms recorded</b> · signed by ${esc(who)}<br><span class="mute" style="font-size:12px">Each is a ledger space with its plan outline and how much of it was scanned.</span></div>`); };
  const nb=$('#nameRoom'); if(nb) nb.onclick=()=>{ PICK=true; R.domElement.style.cursor='crosshair'; $('#hint').textContent='Click the floor of the room you want to name · Esc cancels'; }; }
function show(o){ if(o.space){ const sp=o.space, c=sp.geometry?.zone_point; if(c){ ctl.target.set(c[0],fy,c[2]); cam.zoom=2; cam.updateProjectionMatrix(); }
    side(`<div class="card"><b>${esc(sp.name)}</b> · ${sp.id}<br>${c?`Building frame: ${c.map(v=>v.toFixed(2)).join(', ')} m<br>`:''}Named by ${esc(sp.history?.[0]?.author||'')}${sp.id==='SPC-0001'?'<br><a href="index.html" style="color:#D4A65A">Open the full room twin ›</a>':'<br><span class="mute">Room twin not built yet: capture this room with the rig or a phone walk.</span>'}</div>`); return; }
  if(o.tag){ const p=o.p; ctl.target.set(p[0],fy,p[2]); cam.zoom=2.4; cam.updateProjectionMatrix(); side(`<div class="card"><b>${o.tag}</b> · MKS-1 control point (AprilTag 36h11, 150 mm)<br>Building frame: ${p.map(v=>v.toFixed(2)).join(', ')} m<br>Height above floor: ${(p[1]-fy).toFixed(2)} m ${p[1]-fy>=1.35&&p[1]-fy<=1.65?'<span style="color:#2FD39A">✓ within 1.40–1.60 m</span>':'<span style="color:#E9B949">outside 1.40–1.60 m</span>'}</div>`); } }
function apply(){ roomPins.forEach(d=>d.style.display=''); ARCH.visible=LON.arch; COV=LON.cov; paintRooms(); LAY.plan.visible=LON.plan; planPins.forEach(d=>d.style.display=LON.plan?'':'none'); LAY.walls.visible=LON.walls; LAY.floor.visible=LON.floor; LAY.scan.visible=LON.scan; LAY.path.visible=LON.path; LAY.b3.visible=LON.b3; pins.forEach(p=>p.d.style.display=(p.d.classList.contains('plan')?(LON.arch||LON.plan):p.d.classList.contains('room')?true:LON.tags)?'':'none'); }
side(); apply();
let PICK=false; const ray=new THREE.Raycaster(), floorPlane=new THREE.Plane(new THREE.Vector3(0,1,0),-fy);
const NAMES=['Bedroom 4','Bath','Closet','Private foyer','Private elevator lobby','W/D','Powder room','Hallway','Living area','Kitchen','Workshop','Second office','Sunset terrace'];
addEventListener('keydown',e=>{ if(e.key==='Escape'&&PICK){ PICK=false; R.domElement.style.cursor=''; $('#hint').textContent='Drag to orbit · right-drag to pan · scroll to zoom · click a tag or room'; } });
let pdn=null; R.domElement.addEventListener('pointerdown',e=>pdn=[e.clientX,e.clientY]);
R.domElement.addEventListener('click',async e=>{ if(!PICK||!pdn||Math.hypot(e.clientX-pdn[0],e.clientY-pdn[1])>5) return; const r=R.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),cam); const p=new THREE.Vector3(); if(!ray.ray.intersectPlane(floorPlane,p)) return;
  PICK=false; R.domElement.style.cursor=''; $('#hint').textContent='Drag to orbit · right-drag to pan · scroll to zoom · click a tag or room';
  const used=new Set(Object.values(ST.spaces).map(s=>s.name)); const box=document.createElement('div'); box.id='nm';
  box.innerHTML=`<div class="nmb"><b>Name this room</b><p class="mute">At ${p.x.toFixed(2)}, ${p.z.toFixed(2)} m in the building frame. Names come from your floor plan.</p><div class="nmg">${NAMES.map(n=>`<button ${used.has(n)?'disabled title="already named"':''} data-n="${n}">${n}</button>`).join('')}</div>
    <input id="nmo" placeholder="Or type a name"><input id="nmw" placeholder="Your name (signs the record)" value="${esc(localStorage.getItem('ledger.author')||'')}"><div style="display:flex;gap:8px;margin-top:10px"><button class="pri" id="nmOk">Record room</button><button id="nmX">Cancel</button></div><p id="nmE" style="color:#FF6B5E;font-size:12px;margin:8px 0 0"></p></div>`;
  document.body.appendChild(box); let pickName=''; box.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ pickName=b.dataset.n; box.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('on',x===b)); $('#nmo').value=''; });
  $('#nmX').onclick=()=>box.remove();
  $('#nmOk').onclick=async()=>{ const name=($('#nmo').value.trim()||pickName), who=$('#nmw').value.trim(); if(!name){ $('#nmE').textContent='Pick or type a room name.'; return; } if(!who){ $('#nmE').textContent='Add your name: every record is signed.'; $('#nmw').focus(); return; }
    try{ localStorage.setItem('ledger.author',who); }catch(_){}
    const r=await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'space.created',data:{level:Object.keys(ST.levels)[0],name,kind:'room',geometry:{zone_point:[+p.x.toFixed(3),+fy.toFixed(3),+p.z.toFixed(3)],source:'named in zone view on scan '+SCAN.split('/')[1]}},author:who})}); const j=await r.json();
    if(!r.ok){ $('#nmE').textContent='Not saved: '+(j.error||r.status); return; } box.remove(); ST=await fetch('/api/state').then(r=>r.json()); drawRooms(); apply(); side(`<div class="card" style="border-color:#2FD39A"><b style="color:#2FD39A">✓ ${esc(name)} recorded</b> · ${j.target}<br>Signed by ${esc(who)} · it now appears in the room list and the ledger.</div>`); }; });
const v=new THREE.Vector3(); (function loop(){ requestAnimationFrame(loop); ctl.update(); R.render(S,cam); const r=host.getBoundingClientRect();
  for(const p of pins){ v.copy(p.pos).project(cam); p.d.style.left=((v.x+1)/2*r.width)+'px'; p.d.style.top=((1-v.y)/2*r.height)+'px'; } })();
window.__ready=true;
</script></body></html>
